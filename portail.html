<meta charset="UTF-8">

<title>Mon espace — Coaching</title>
<style>
  :root{
    box-sizing:border-box;
    --bg:#F7F3E8; --card:#FFFDF7; --line:#E4DAC0; --text:#3A3226; --muted:#6B6355;
    --accent: #9C7A2E; --accentSoft:#FBF5E4;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  #app{max-width:640px;margin:0 auto;padding:20px 16px 60px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px}
  h1{font-size:19px;margin:4px 0 2px}
  .muted{color:var(--muted);font-size:13px}
  .reminder{background:var(--accentSoft);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:18px;font-size:14px;line-height:1.5}
  .reminder b{color:var(--accent)}
  .tabs{display:flex;gap:8px;margin:18px 0 14px}
  .tab-btn{flex:1;padding:10px;border:1px solid var(--line);background:#fff;border-radius:10px;font-weight:600;font-size:13.5px;cursor:pointer;color:var(--text)}
  .tab-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
  .outil-desc{color:var(--muted);font-size:13px;margin-bottom:14px;font-style:italic}
  .rv-summary{background:var(--accentSoft);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:13.5px;line-height:1.55;margin-bottom:14px}
  .rv-dom{background:#fff;border:1px solid var(--line);border-radius:14px;margin:10px 0;padding:0 14px}
  .rv-dom[open]{padding-bottom:14px}
  .rv-dhead{list-style:none;display:flex;align-items:center;gap:10px;cursor:pointer;padding:13px 0;min-height:44px}
  .rv-dhead::-webkit-details-marker{display:none}
  .rv-title{flex:1;font-weight:600;font-size:14.5px;line-height:1.35}
  .rv-dscore{display:flex;flex-direction:column;align-items:flex-end;color:var(--accent);line-height:1.1}
  .rv-dscore b{font-size:19px}
  .rv-dscore small{font-size:10.5px;color:var(--muted)}
  .rv-chev{font-size:20px;color:var(--muted);transition:transform .2s}
  .rv-dom[open] .rv-chev{transform:rotate(90deg)}
  .rv-q{padding:11px 0 9px;border-top:1px solid var(--line)}
  .rv-q-top{display:flex;align-items:flex-start;gap:10px}
  .rv-q-text{flex:1;font-size:14.5px;line-height:1.4}
  .rv-q-score{min-width:24px;text-align:right;font-weight:700;font-size:17px;color:var(--accent)}
  .rv-slider{width:100%;margin:10px 0 2px;accent-color:var(--accent);height:30px}
  .rv-slider.untouched{opacity:.5}
  .rv-scale{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
  .rv-note{width:100%;margin-top:9px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:13.5px;background:#fff}
  .rv-saved{font-size:11.5px;color:#4a9e6a;text-align:right;min-height:15px}
  .btn{display:inline-block;background:var(--accent);color:#fff;border:none;border-radius:10px;padding:11px 18px;font-weight:600;font-size:13.5px;cursor:pointer}
  .contract-view{max-height:60vh;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:12.5px;background:#fff}
  .empty{color:var(--muted);font-size:13.5px;text-align:center;padding:30px 10px}
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){--bg:#1C1812;--card:#26211A;--line:#3A3226;--text:#F0E8D2;--muted:#B8AC94;--accentSoft:#2E2718}
    .rv-note,.tab-btn,.contract-view{background:#1C1812;color:var(--text)}
  }
</style>
</head>

/* ═══ Moteur Outils (Ikigaï / Arbre de vie) — identique au côté coach ═══ */

function esc(s){ return String(s===undefined||s===null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;"); }
function fmt1(v){ return (Math.round(v*10)/10).toString().replace(".",","); }

const PORTAL = { clientId:null, client:null, sid:null, outils:{ikigai:{q:{},note:{},scores:{}},arbre:{q:{},note:{},scores:{}}}, tab:"ikigai" };

function recalc(def, d){
  d.scores = {};
  def.domaines.forEach(dom=>{
    const q = d.q[dom.id] || {};
    const vals = Object.keys(q).map(k=>q[k]).filter(v=>typeof v==="number");
    if (vals.length) d.scores[dom.id] = vals.reduce((a,b)=>a+b,0)/vals.length;
  });
}
function statsOf(def, d){
  let answered=0,total=0,lowQ=null,highQ=null;
  def.domaines.forEach(dom=>{
    total += dom.questions.length;
    const q = d.q[dom.id]||{};
    dom.questions.forEach((txt,i)=>{
      const v=q[i]; if (typeof v!=="number") return;
      answered++;
      if (!lowQ||v<lowQ.v) lowQ={v,txt};
      if (!highQ||v>highQ.v) highQ={v,txt};
    });
  });
  const rated = def.domaines.filter(x=>d.scores[x.id]!==undefined);
  const avg = rated.length ? rated.reduce((a,x)=>a+d.scores[x.id],0)/rated.length : null;
  const lowDom = rated.length>1 ? rated.reduce((m,x)=>d.scores[x.id]<d.scores[m.id]?x:m, rated[0]) : null;
  return {answered,total,avg,lowDom,lowQ,highQ};
}
function radarSvg(def, scores){
  const n=def.domaines.length, cx=190, cy=175, R=100;
  const ang = i => -Math.PI/2 + i*2*Math.PI/n;
  const pt = (i,v) => [cx+Math.cos(ang(i))*R*v/10, cy+Math.sin(ang(i))*R*v/10];
  const f = p => p[0].toFixed(1)+","+p[1].toFixed(1);
  let rings=""; [2,4,6,8,10].forEach(k=>{ rings += `<polygon points="${def.domaines.map((_,i)=>f(pt(i,k))).join(" ")}" fill="none" stroke="var(--line)" stroke-width="1"/>`; });
  let axes="",labels="",dots="";
  def.domaines.forEach((dom,i)=>{
    const e=pt(i,10);
    axes += `<line x1="${cx}" y1="${cy}" x2="${e[0].toFixed(1)}" y2="${e[1].toFixed(1)}" stroke="var(--line)" stroke-width="1"/>`;
    const lx=cx+Math.cos(ang(i))*(R+22), ly=cy+Math.sin(ang(i))*(R+22);
    labels += `<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="middle" dominant-baseline="central" font-size="18">${dom.icone}</text>`;
    const s=scores[dom.id];
    if (s!==undefined){ const p=pt(i,s); dots += `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="4.5" fill="var(--accent)"/>`; }
  });
  const poly = def.domaines.map((dom,i)=>f(pt(i, scores[dom.id]===undefined?0:scores[dom.id]))).join(" ");
  return `<svg viewBox="0 0 380 350" width="100%" style="max-width:340px;display:block;margin:0 auto">
    ${rings}${axes}
    <polygon points="${poly}" fill="rgba(156,122,46,0.18)" stroke="var(--accent)" stroke-width="2.3" stroke-linejoin="round"/>
    ${dots}${labels}
  </svg>`;
}
function summaryHtml(def, d){
  const st = statsOf(def, d);
  if (!st.answered) return `<span>Aucune question notée pour l'instant.</span>`;
  let h = `<div><b>Moyenne :</b> ${fmt1(st.avg)}/10 · ${st.answered}/${st.total} questions notées</div>`;
  if (st.lowDom) h += `<div><b>À regarder en premier :</b> ${st.lowDom.icone} ${esc(st.lowDom.court)} (${fmt1(d.scores[st.lowDom.id])}/10)</div>`;
  return h;
}
function headScoreHtml(dom, d){
  const q=d.q[dom.id]||{}; const n=Object.keys(q).filter(k=>typeof q[k]==="number").length;
  const s=d.scores[dom.id];
  return `<b>${s===undefined?"—":fmt1(s)}</b><small>${n}/${dom.questions.length}</small>`;
}
function questionHtml(tool, dom, i, d){
  const v=(d.q[dom.id]||{})[i]; const has=typeof v==="number";
  return `<div class="rv-q-top">
      <div class="rv-q-text">${esc(dom.questions[i])}</div>
      <div class="rv-q-score" id="qs-${tool}-${dom.id}-${i}">${has?v:"—"}</div>
    </div>
    <input type="range" class="rv-slider${has?"":" untouched"}" min="1" max="10" step="1" value="${has?v:5}"
      oninput="slide('${tool}','${dom.id}',${i},this)" onpointerup="slideCommit('${tool}','${dom.id}',${i},this)">
    <div class="rv-scale"><span>1 · pas du tout</span><span>10 · tout à fait</span></div>`;
}
function domainHtml(tool, dom, d, open){
  const qs = dom.questions.map((_,i)=>{
    const has = typeof (d.q[dom.id]||{})[i] === "number";
    return `<div class="rv-q${has?" has":""}" id="q-${tool}-${dom.id}-${i}">${questionHtml(tool,dom,i,d)}</div>`;
  }).join("");
  return `<details class="rv-dom" id="dom-${tool}-${dom.id}"${open?" open":""}>
    <summary class="rv-dhead">
      <span class="rv-title">${dom.icone} ${esc(dom.titre)}</span>
      <span class="rv-dscore" id="ds-${tool}-${dom.id}">${headScoreHtml(dom,d)}</span>
      <span class="rv-chev">›</span>
    </summary>
    ${qs}
    <input type="text" class="rv-note" placeholder="Tes mots sur ce thème (facultatif)" value="${esc(d.note[dom.id]||"")}" oninput="noteChange('${tool}','${dom.id}',this.value)">
  </details>`;
}
function panelHtml(tool){
  const def = OUTILS_DEF[tool], d = PORTAL.outils[tool];
  return `<p class="outil-desc">${esc(def.intro)}</p>
    <div id="radar-${tool}">${radarSvg(def, d.scores)}</div>
    <div class="rv-summary" id="sum-${tool}">${summaryHtml(def, d)}</div>
    ${def.domaines.map((dom,k)=>domainHtml(tool, dom, d, k===0)).join("")}
    <div class="rv-saved" id="saved-${tool}"></div>`;
}
function refreshRadar(tool){
  const def = OUTILS_DEF[tool], d = PORTAL.outils[tool];
  recalc(def, d);
  const r = document.getElementById("radar-"+tool); if (r) r.innerHTML = radarSvg(def, d.scores);
  const s = document.getElementById("sum-"+tool); if (s) s.innerHTML = summaryHtml(def, d);
  def.domaines.forEach(dom=>{ const h=document.getElementById("ds-"+tool+"-"+dom.id); if (h) h.innerHTML = headScoreHtml(dom, d); });
}
let _saveTimer=null;
function persist(){
  clearTimeout(_saveTimer);
  _saveTimer = setTimeout(()=>{
    firebase.firestore().collection("outils").doc(PORTAL.sid).set({
      clientId: PORTAL.clientId, ikigai: PORTAL.outils.ikigai, arbre: PORTAL.outils.arbre,
      updatedAt: new Date().toISOString()
    }, { merge:true }).then(()=>{
      ["ikigai","arbre"].forEach(t=>{ const el=document.getElementById("saved-"+t); if (el) el.textContent="✓ Enregistré"; });
    }).catch(e=>console.error("Enregistrement impossible:", e));
  }, 700);
}
function slide(tool, domId, i, el){
  const d = PORTAL.outils[tool];
  if (!d.q[domId]) d.q[domId]={};
  const val = Number(el.value);
  d.q[domId][i] = val;
  el.classList.remove("untouched");
  const row = el.closest(".rv-q"); if (row) row.classList.add("has");
  const sc = document.getElementById(`qs-${tool}-${domId}-${i}`); if (sc) sc.textContent = String(val);
  refreshRadar(tool); persist();
}
function slideCommit(tool, domId, i, el){ if (el.classList.contains("untouched")) slide(tool, domId, i, el); }
function noteChange(tool, domId, val){ PORTAL.outils[tool].note[domId]=val; persist(); }
function switchTab(tool){
  PORTAL.tab = tool;
  document.querySelectorAll(".tab-btn").forEach(b=>b.classList.toggle("active", b.dataset.tool===tool));
  document.getElementById("panel").innerHTML = panelHtml(tool);
}

function frenchDate(iso){
  if (!iso) return null;
  const d = new Date(iso+"T00:00:00");
  if (isNaN(d)) return null;
  return d.toLocaleDateString("fr-FR", {weekday:"long", day:"numeric", month:"long"});
}

function parcoursHtml(parcours){
  parcours = parcours || { phases: [], objectifs: [] };
  const phasesHtml = (parcours.phases||[]).map(ph => `
    <div style="display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)">
      <span style="font-size:17px">${ph.done ? "✅" : "⬜"}</span>
      <span style="font-size:14px;${ph.done ? "text-decoration:line-through;color:var(--muted)" : ""}">${esc(ph.label)}</span>
    </div>`).join("");
  const objHtml = (parcours.objectifs||[]).map(ob => `
    <div style="margin-bottom:14px">
      <div style="display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:5px">
        <span>${esc(ob.titre)}</span><b style="color:var(--accent)">${ob.progression||0}%</b>
      </div>
      <div style="background:var(--line);border-radius:6px;height:8px;overflow:hidden">
        <div style="background:var(--accent);height:100%;width:${ob.progression||0}%"></div>
      </div>
    </div>`).join("");
  return `
    <div style="font-weight:700;margin-bottom:8px">🧗 Mon parcours</div>
    ${phasesHtml || '<p class="muted" style="margin:4px 0">Les étapes seront ajoutées par ton coach.</p>'}
    ${objHtml ? `<div style="margin-top:16px">${objHtml}</div>` : ""}
  `;
}

function exerciceSimpleHtml(ex, idx){
  return `
    <label style="display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer">
      <input type="checkbox" ${ex.done ? "checked" : ""} onchange="toggleExercice(${idx}, this.checked)" style="margin-top:3px">
      <span>
        <span style="font-size:14px;${ex.done ? "text-decoration:line-through;color:var(--muted)" : ""}">${esc(ex.titre)}</span>
        ${ex.consigne ? `<div style="font-size:12.5px;color:var(--muted);margin-top:2px">${esc(ex.consigne)}</div>` : ""}
      </span>
    </label>`;
}

// Exercice avec questions : le client répond directement, l'enregistrement est automatique.
function exerciceStructureHtml(ex, idx, rep){
  const remplis = ex.champs.filter(c => String(rep[c.id] || "").trim()).length;
  const champs = ex.champs.map(c => `
    <div style="margin:12px 0">
      <label for="rep_${idx}_${esc(c.id)}" style="font-weight:600;font-size:13.5px">${esc(c.label)}</label>
      ${c.aide ? `<div class="muted" style="font-size:12.5px;margin:2px 0 4px">${esc(c.aide)}</div>` : ""}
      <textarea id="rep_${idx}_${esc(c.id)}" rows="3" style="width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit;font-size:16px" data-champ="${esc(c.id)}" oninput="saisieReponse(${idx}, this.dataset.champ, this.value)">${esc(rep[c.id] || "")}</textarea>
    </div>`).join("");
  return `
    <details style="border-bottom:1px solid var(--line);padding:10px 0">
      <summary style="cursor:pointer;font-size:14px;font-weight:600">${esc(ex.titre)} <span class="muted" style="font-weight:400;font-size:12.5px">· ${remplis}/${ex.champs.length} rempli(s)${ex.done ? " · terminé ✅" : ""}</span></summary>
      ${ex.consigne ? `<p class="muted" style="font-size:13px;white-space:pre-line">${esc(ex.consigne)}</p>` : ""}
      ${champs}
      <label style="display:flex;align-items:center;gap:8px;margin-top:6px;font-size:13.5px"><input type="checkbox" ${ex.done ? "checked" : ""} onchange="toggleExercice(${idx}, this.checked)"> J'ai terminé cet exercice</label>
      <div id="msg_${idx}" class="muted" style="font-size:12px;min-height:16px;margin-top:4px"></div>
    </details>`;
}

function exercicesHtml(client){
  const exos = client.exercices || [];
  if (!exos.length) return "";
  const rep = client.reponsesExercices || {};
  const rows = exos.map((ex, idx) => (ex.champs && ex.champs.length) ? exerciceStructureHtml(ex, idx, rep[ex.id] || {}) : exerciceSimpleHtml(ex, idx)).join("");
  return `<div class="card"><div style="font-weight:700;margin-bottom:6px">📝 Mes exercices</div>${rows}</div>`;
}

const _repTimers = {};
function saisieReponse(idx, champId, valeur){
  const ex = (PORTAL.client.exercices || [])[idx];
  if (!ex) return;
  PORTAL.client.reponsesExercices = PORTAL.client.reponsesExercices || {};

function agendaLien(client) {
  const date = client.nextSession, heure = client.nextSessionHeure || "";
  const p = x => String(x).padStart(2, "0");
  const ymd = d => d.getFullYear() + p(d.getMonth()+1) + p(d.getDate());
  let dates;
  if (!heure) { const nd = new Date(date + "T00:00:00"); nd.setDate(nd.getDate() + 1); dates = date.replace(/-/g, "") + "/" + ymd(nd); }
  else { const st = new Date(date + "T" + heure + ":00"), en = new Date(st.getTime() + 3600000); const f = d => ymd(d) + "T" + p(d.getHours()) + p(d.getMinutes()) + "00"; dates = f(st) + "/" + f(en); }
  return "https://calendar.google.com/calendar/render?" + new URLSearchParams({ action:"TEMPLATE", text:"Séance de coaching", dates:dates }).toString();
}

function plantSvg(stage) {
  const top = { 1:115, 2:80, 3:55, 4:38 }[stage];
  const leaf = (x, y, rot) => `<ellipse cx="${x}" cy="${y}" rx="10" ry="4.8" fill="#5FA05A" transform="rotate(${rot} ${x} ${y})"/>`;
  const flower = (x, y, c) => { let u = ""; for (let i = 0; i < 5; i++) u += `<ellipse cx="${x}" cy="${y-8}" rx="4.8" ry="7.5" fill="${c}" transform="rotate(${i*72} ${x} ${y})"/>`; return u + `<circle cx="${x}" cy="${y}" r="3.6" fill="#F2C94C"/>`; };
  const bud = (x, y) => `<ellipse cx="${x}" cy="${y}" rx="4" ry="6" fill="#E88A8A"/>`;
  const pairs = { 1:1, 2:2, 3:3, 4:3 }[stage];
  let leaves = "";
  for (let k = 0; k < pairs; k++) { const y = 138 - k * 26; leaves += leaf(68, y, -30) + leaf(92, y - 6, 30); }
  let haut = "";
  if (stage === 3) haut = bud(80, top - 4) + bud(66, top + 16) + bud(94, top + 12);
  if (stage === 4) haut = flower(80, top, "#E87A7A") + flower(60, top + 24, "#F29BA0") + flower(100, top + 20, "#E87A7A");
  if (stage <= 2) haut = leaf(72, top, -40) + leaf(88, top - 2, 40);
  return `<svg viewBox="0 0 160 190" width="130" height="154" role="img" aria-label="Plante, étape ${stage} sur 4"><path d="M80 152 L80 ${top}" stroke="#4E8B4A" stroke-width="4" stroke-linecap="round" fill="none"/>${leaves}${haut}<ellipse cx="80" cy="152" rx="34" ry="6" fill="#6B4A32"/><path d="M46 152 L54 186 L106 186 L114 152 Z" fill="#C8734A"/><rect x="44" y="148" width="72" height="9" rx="3" fill="#B5633C"/></svg>`;
}
function progressionParcours(p) {
  if (!p) return 0;
  const ph = p.phases || [];
  if (ph.length) return ph.filter(x => x.done).length / ph.length;
  const ob = p.objectifs || [];
  if (ob.length) return ob.reduce((a, o) => a + (o.progression || 0), 0) / ob.length / 100;
  return 0;
}
function planteHtml(client) {
  const r = progressionParcours(client.parcours), st = r < 0.25 ? 1 : r < 0.5 ? 2 : r < 0.75 ? 3 : 4;
  const noms = ["Le lancement", "La mise en place", "La pratique", "La floraison"];
  return `<div class="card" id="planteZone" style="display:flex;align-items:center;gap:14px">${plantSvg(st)}<div><div class="muted" style="font-size:12px;letter-spacing:.08em">ÉVOLUTION DE MON PROJET</div><div style="font-size:17px;font-weight:700;margin:4px 0">Étape ${st} · ${noms[st-1]}</div><div class="muted" style="font-size:13px">${Math.round(r * 100)}% des étapes franchies</div></div></div>`;
}
function rdvPortailListe(client) {
  const l = (client.rendezVous || []).filter(r => r && r.date);
  if (l.length) return l;
  return client.nextSession ? [{ id: "next", date: client.nextSession, heure: client.nextSessionHeure || "", motif: "" }] : [];
}
function rdvPortailHtml(client) {
  const tous = rdvPortailListe(client);
  const p2 = x => String(x).padStart(2, "0"), d0 = new Date();
  const maintenant = d0.getFullYear() + "-" + p2(d0.getMonth()+1) + "-" + p2(d0.getDate()) + "T" + p2(d0.getHours()) + ":" + p2(d0.getMinutes());
  const cle = r => r.date + "T" + (r.heure || "00:00");
  const jolie = d => { const x = new Date(d + "T00:00:00"); return isNaN(x) ? d : x.toLocaleDateString("fr-FR", { weekday:"long", day:"numeric", month:"long", year:"numeric" }); };
  const avenir = tous.filter(r => cle(r) >= maintenant).sort((a, b) => cle(a) < cle(b) ? -1 : 1);
  const passes = tous.filter(r => cle(r) < maintenant).sort((a, b) => cle(a) < cle(b) ? 1 : -1);
  const ligne = (r, lien) => `<div style="padding:8px 10px;border:1px solid #E4DAC0;border-radius:8px;margin-bottom:6px;font-size:14px"><b>${esc(jolie(r.date))}</b>${r.heure ? " à " + esc(r.heure) : ""}${r.motif ? '<span class="muted"> — ' + esc(r.motif) + "</span>" : ""}${lien ? '<br><a href="' + agendaLien({ nextSession: r.date, nextSessionHeure: r.heure }) + '" target="_blank" rel="noopener" style="font-size:12.5px;color:var(--accent);font-weight:600;text-decoration:none">📅 Ajouter à mon agenda</a>' : ""}</div>`;
  const bloc = (titre, liste, lien) => `<div style="font-weight:700;font-size:13px;margin:10px 0 6px">${titre} (${liste.length})</div>` + (liste.length ? liste.map(r => ligne(r, lien)).join("") : '<div class="muted" style="font-size:13px">Aucun</div>');
  if (!tous.length) return `<div class="card" id="rdvZone"><div style="font-weight:700">📅 Mes rendez-vous</div><p class="muted">Aucun rendez-vous enregistré pour le moment.</p></div>`;
  return `<div class="card" id="rdvZone"><div style="font-weight:700">📅 Mes rendez-vous</div>${bloc("À venir", avenir, true)}${bloc("Passés", passes, false)}</div>`;

function envoyerCheckin() {
  const btn = document.getElementById("ck_btn"); if (!btn || btn.disabled) return;

const QUESTIONS_ACCUEIL = [

  }

    return `<div style="margin:12px 0"><label for="qa_${x.id}" style="font-weight:600;font-size:13.5px">${esc(x.label)}</label><textarea id="qa_${x.id}" rows="3" maxlength="2000" style="width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit;font-size:16px;margin-top:4px">${esc(val)}</textarea></div>`;

    <p class="muted" style="margin:2px 0 4px">Quelques questions pour préparer notre premier rendez-vous. Il n'y a pas de bonne ou de mauvaise réponse, et tu peux laisser vide ce que tu ne souhaites pas partager.</p>${champs}

function modifierQuestionnaire() { document.getElementById("questZone").innerHTML = questionnaireInterieur(PORTAL.client, true); }
function envoyerQuestionnaire() {
  const btn = document.getElementById("qa_btn"), msg = document.getElementById("qa_msg");
  if (!btn || btn.disabled) return;
  const rep = {};
  QUESTIONS_ACCUEIL.forEach(x => { const el = document.getElementById("qa_" + x.id); rep[x.id] = ((el && el.value) || "").trim().slice(0, 2000); });
  if (!Object.values(rep).some(v => v)) { msg.textContent = "Écris au moins une réponse avant d'envoyer."; return; }
  const avant = PORTAL.client.questionnaireAccueil, maintenant = new Date().toISOString();
  const data = Object.assign({}, rep, { envoyeLe: (avant && avant.envoyeLe) || maintenant });
  if (avant) data.modifieLe = maintenant;
  btn.disabled = true; btn.textContent = "Envoi…";
  firebase.firestore().collection("clients").doc(PORTAL.clientId).update({ questionnaireAccueil: data })
    .then(() => { PORTAL.client.questionnaireAccueil = data; document.getElementById("questZone").innerHTML = questionnaireInterieur(PORTAL.client, false); })
    .catch(e => { console.error("questionnaire:", e); btn.disabled = false; btn.textContent = "Envoyer mes réponses"; msg.textContent = "⚠️ Non envoyé, vérifie ta connexion et réessaie. Tes réponses sont toujours là."; });
}

      <div style="font-weight:700;margin-bottom:4px">🛠️ Mes outils</div>
      <p class="muted" style="margin-top:0">À remplir avant notre prochaine séance, si tu en as l'occasion — pas d'obligation.</p>
      <div class="tabs">${actifs.map((k, i) => `<button class="tab-btn${i === 0 ? " active" : ""}" data-tool="${k}" onclick="switchTab('${k}')">${noms[k]}</button>`).join("")}</div>
      <div id="panel">${panelHtml(actifs[0])}</div>
    </div>`;
}

function renderPortal(){
  const app = document.getElementById("app");
  const nom = (PORTAL.client && PORTAL.client.name) || "";
  const next = frenchDate(PORTAL.client && PORTAL.client.nextSession);
  app.innerHTML = `
    <h1>👋 Bonjour ${esc(nom)}</h1>
    <p class="muted" style="margin-bottom:16px">Ton espace personnel de coaching</p>
    ${next ? `<div class="reminder">🗓️ Ta prochaine séance : <b>${esc(next)}</b>${PORTAL.client.nextSessionHeure ? " à " + esc(PORTAL.client.nextSessionHeure) : ""}<br><a href="${agendaLien(PORTAL.client)}" target="_blank" rel="noopener" style="font-size:13px;color:var(--accent);font-weight:600;text-decoration:none">📅 Ajouter à mon agenda</a></div>` : ""}
    ${questionnaireHtml(PORTAL.client)}
    <div class="card" id="rythmeZone">${rythmesHtml(PORTAL.client)}</div>
    ${checkinHtml(PORTAL.client)}
    ${planteHtml(PORTAL.client)}
    ${rdvPortailHtml(PORTAL.client)}
    <div id="contractZone"></div>
    ${(PORTAL.client.parcours && (PORTAL.client.parcours.phases||[]).length) ? `<div class="card">${parcoursHtml(PORTAL.client.parcours)}</div>` : ""}
    ${exercicesHtml(PORTAL.client)}
    ${outilsCardHtml(PORTAL.client)}
    <div class="card" id="echangeZone">${echangesHtml(PORTAL.client)}</div>
  `;
  renderContractButton();
  document.getElementById("echangeSend").addEventListener("click", sendEchange);
}

(function init(){
  const params = new URLSearchParams(location.search);
  const token = params.get("t");
  const app = document.getElementById("app");
  if (!token){ app.innerHTML = '<div class="empty">Lien invalide.<br>Demande un nouveau lien à ton coach.</div>'; return; }

  firebase.auth().signInAnonymously().then(function(){
    return firebase.firestore().collection("portalLinks").doc(token).get();
  }).then(function(snap){
    if (!snap.exists){ app.innerHTML = '<div class="empty">Ce lien a expiré.<br>Demande un nouveau lien à ton coach.</div>'; return; }
    const clientId = snap.data().clientId;
    PORTAL.clientId = clientId;
    PORTAL.sid = clientId + "_current";
    return firebase.firestore().collection("clients").doc(clientId).get().then(function(csnap){
      PORTAL.client = csnap.exists ? csnap.data() : {};
      return firebase.firestore().collection("outils").doc(PORTAL.sid).get();
    }).then(function(osnap){
      if (osnap.exists){
        const data = osnap.data();
        if (data.ikigai) PORTAL.outils.ikigai = Object.assign({q:{},note:{},scores:{}}, data.ikigai);
        if (data.arbre) PORTAL.outils.arbre = Object.assign({q:{},note:{},scores:{}}, data.arbre);
      }
      recalc(OUTILS_DEF.ikigai, PORTAL.outils.ikigai);
      recalc(OUTILS_DEF.arbre, PORTAL.outils.arbre);
      renderPortal();
    });
  }).catch(function(e){
    console.error("portail:", e);
    app.innerHTML = '<div class="empty">⚠️ Problème de connexion.<br>Réessaie dans un instant.</div>';
  });
})();
</script>
</body>
</html>
