<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mon espace — Coaching</title>
<style>
  :root{
    box-sizing:border-box;
    --bg:#F7F3E8; --card:#FFFDF7; --line:#E4DAC0; --text:#3A3226; --muted:#6B6355;
    --accent: #9C7A2E; --accentSoft:#FBF5E4;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  #app{max-width:640px;margin:0 auto;padding:20px 16px 60px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px}
  h1{font-size:19px;margin:4px 0 2px}
  .muted{color:var(--muted);font-size:13px}
  .reminder{background:var(--accentSoft);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:18px;font-size:14px;line-height:1.5}
  .reminder b{color:var(--accent)}
  .tabs{display:flex;gap:8px;margin:18px 0 14px}
  .tab-btn{flex:1;padding:10px;border:1px solid var(--line);background:#fff;border-radius:10px;font-weight:600;font-size:13.5px;cursor:pointer;color:var(--text)}
  .tab-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
  .outil-desc{color:var(--muted);font-size:13px;margin-bottom:14px;font-style:italic}
  .rv-summary{background:var(--accentSoft);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:13.5px;line-height:1.55;margin-bottom:14px}
  .rv-dom{background:#fff;border:1px solid var(--line);border-radius:14px;margin:10px 0;padding:0 14px}
  .rv-dom[open]{padding-bottom:14px}
  .rv-dhead{list-style:none;display:flex;align-items:center;gap:10px;cursor:pointer;padding:13px 0;min-height:44px}
  .rv-dhead::-webkit-details-marker{display:none}
  .rv-title{flex:1;font-weight:600;font-size:14.5px;line-height:1.35}
  .rv-dscore{display:flex;flex-direction:column;align-items:flex-end;color:var(--accent);line-height:1.1}
  .rv-dscore b{font-size:19px}
  .rv-dscore small{font-size:10.5px;color:var(--muted)}
  .rv-chev{font-size:20px;color:var(--muted);transition:transform .2s}
  .rv-dom[open] .rv-chev{transform:rotate(90deg)}
  .rv-q{padding:11px 0 9px;border-top:1px solid var(--line)}
  .rv-q-top{display:flex;align-items:flex-start;gap:10px}
  .rv-q-text{flex:1;font-size:14.5px;line-height:1.4}
  .rv-q-score{min-width:24px;text-align:right;font-weight:700;font-size:17px;color:var(--accent)}
  .rv-slider{width:100%;margin:10px 0 2px;accent-color:var(--accent);height:30px}
  .rv-slider.untouched{opacity:.5}
  .rv-scale{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
  .rv-note{width:100%;margin-top:9px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:13.5px;background:#fff}
  .rv-saved{font-size:11.5px;color:#4a9e6a;text-align:right;min-height:15px}
  .btn{display:inline-block;background:var(--accent);color:#fff;border:none;border-radius:10px;padding:11px 18px;font-weight:600;font-size:13.5px;cursor:pointer}
  .contract-view{max-height:60vh;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:12.5px;background:#fff}
  .empty{color:var(--muted);font-size:13.5px;text-align:center;padding:30px 10px}
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){--bg:#1C1812;--card:#26211A;--line:#3A3226;--text:#F0E8D2;--muted:#B8AC94;--accentSoft:#2E2718}
    .rv-note,.tab-btn,.contract-view{background:#1C1812;color:var(--text)}
  }
</style>
</head>

<script>

/* ═══ Moteur Outils (Ikigaï / Arbre de vie) — identique au côté coach ═══ */

function esc(s){ return String(s===undefined||s===null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;"); }
function fmt1(v){ return (Math.round(v*10)/10).toString().replace(".",","); }

const PORTAL = { clientId:null, client:null, sid:null, outils:{ikigai:{q:{},note:{},scores:{}},arbre:{q:{},note:{},scores:{}}}, tab:"ikigai" };

function recalc(def, d){
  d.scores = {};
  def.domaines.forEach(dom=>{
    const q = d.q[dom.id] || {};
    const vals = Object.keys(q).map(k=>q[k]).filter(v=>typeof v==="number");
    if (vals.length) d.scores[dom.id] = vals.reduce((a,b)=>a+b,0)/vals.length;
  });
}
function statsOf(def, d){
  let answered=0,total=0,lowQ=null,highQ=null;
  def.domaines.forEach(dom=>{
    total += dom.questions.length;
    const q = d.q[dom.id]||{};
    dom.questions.forEach((txt,i)=>{
      const v=q[i]; if (typeof v!=="number") return;
      answered++;
      if (!lowQ||v<lowQ.v) lowQ={v,txt};
      if (!highQ||v>highQ.v) highQ={v,txt};
    });
  });
  const rated = def.domaines.filter(x=>d.scores[x.id]!==undefined);
  const avg = rated.length ? rated.reduce((a,x)=>a+d.scores[x.id],0)/rated.length : null;
  const lowDom = rated.length>1 ? rated.reduce((m,x)=>d.scores[x.id]<d.scores[m.id]?x:m, rated[0]) : null;
  return {answered,total,avg,lowDom,lowQ,highQ};
}
function radarSvg(def, scores){
  const n=def.domaines.length, cx=190, cy=175, R=100;
  const ang = i => -Math.PI/2 + i*2*Math.PI/n;
  const pt = (i,v) => [cx+Math.cos(ang(i))*R*v/10, cy+Math.sin(ang(i))*R*v/10];
  const f = p => p[0].toFixed(1)+","+p[1].toFixed(1);
  let rings=""; [2,4,6,8,10].forEach(k=>{ rings += `<polygon points="${def.domaines.map((_,i)=>f(pt(i,k))).join(" ")}" fill="none" stroke="var(--line)" stroke-width="1"/>`; });
  let axes="",labels="",dots="";
  def.domaines.forEach((dom,i)=>{
    const e=pt(i,10);
    axes += `<line x1="${cx}" y1="${cy}" x2="${e[0].toFixed(1)}" y2="${e[1].toFixed(1)}" stroke="var(--line)" stroke-width="1"/>`;
    const lx=cx+Math.cos(ang(i))*(R+22), ly=cy+Math.sin(ang(i))*(R+22);
    labels += `<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="middle" dominant-baseline="central" font-size="18">${dom.icone}</text>`;
    const s=scores[dom.id];
    if (s!==undefined){ const p=pt(i,s); dots += `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="4.5" fill="var(--accent)"/>`; }
  });
  const poly = def.domaines.map((dom,i)=>f(pt(i, scores[dom.id]===undefined?0:scores[dom.id]))).join(" ");
  return `<svg viewBox="0 0 380 350" width="100%" style="max-width:340px;display:block;margin:0 auto">
    ${rings}${axes}
    <polygon points="${poly}" fill="rgba(156,122,46,0.18)" stroke="var(--accent)" stroke-width="2.3" stroke-linejoin="round"/>
    ${dots}${labels}
  </svg>`;
}
function summaryHtml(def, d){
  const st = statsOf(def, d);
  if (!st.answered) return `<span>Aucune question notée pour l'instant.</span>`;
  let h = `<div><b>Moyenne :</b> ${fmt1(st.avg)}/10 · ${st.answered}/${st.total} questions notées</div>`;
  if (st.lowDom) h += `<div><b>À regarder en premier :</b> ${st.lowDom.icone} ${esc(st.lowDom.court)} (${fmt1(d.scores[st.lowDom.id])}/10)</div>`;
  return h;
}
function headScoreHtml(dom, d){
  const q=d.q[dom.id]||{}; const n=Object.keys(q).filter(k=>typeof q[k]==="number").length;
  const s=d.scores[dom.id];
  return `<b>${s===undefined?"—":fmt1(s)}</b><small>${n}/${dom.questions.length}</small>`;
}
function questionHtml(tool, dom, i, d){
  const v=(d.q[dom.id]||{})[i]; const has=typeof v==="number";
  return `<div class="rv-q-top">
      <div class="rv-q-text">${esc(dom.questions[i])}</div>
      <div class="rv-q-score" id="qs-${tool}-${dom.id}-${i}">${has?v:"—"}</div>
    </div>
    <input type="range" class="rv-slider${has?"":" untouched"}" min="1" max="10" step="1" value="${has?v:5}"
      oninput="slide('${tool}','${dom.id}',${i},this)" onpointerup="slideCommit('${tool}','${dom.id}',${i},this)">
    <div class="rv-scale"><span>1 · pas du tout</span><span>10 · tout à fait</span></div>`;
}
function domainHtml(tool, dom, d, open){
  const qs = dom.questions.map((_,i)=>{
    const has = typeof (d.q[dom.id]||{})[i] === "number";
    return `<div class="rv-q${has?" has":""}" id="q-${tool}-${dom.id}-${i}">${questionHtml(tool,dom,i,d)}</div>`;
  }).join("");
  return `<details class="rv-dom" id="dom-${tool}-${dom.id}"${open?" open":""}>
    <summary class="rv-dhead">
      <span class="rv-title">${dom.icone} ${esc(dom.titre)}</span>
      <span class="rv-dscore" id="ds-${tool}-${dom.id}">${headScoreHtml(dom,d)}</span>
      <span class="rv-chev">›</span>
    </summary>
    ${qs}
    <input type="text" class="rv-note" placeholder="Tes mots sur ce thème (facultatif)" value="${esc(d.note[dom.id]||"")}" oninput="noteChange('${tool}','${dom.id}',this.value)">
  </details>`;
}
function panelHtml(tool){
  const def = OUTILS_DEF[tool], d = PORTAL.outils[tool];
  return `<p class="outil-desc">${esc(def.intro)}</p>
    <div id="radar-${tool}">${radarSvg(def, d.scores)}</div>
    <div class="rv-summary" id="sum-${tool}">${summaryHtml(def, d)}</div>
    ${def.domaines.map((dom,k)=>domainHtml(tool, dom, d, k===0)).join("")}
    <div class="rv-saved" id="saved-${tool}"></div>`;
}
function refreshRadar(tool){
  const def = OUTILS_DEF[tool], d = PORTAL.outils[tool];
  recalc(def, d);
  const r = document.getElementById("radar-"+tool); if (r) r.innerHTML = radarSvg(def, d.scores);
  const s = document.getElementById("sum-"+tool); if (s) s.innerHTML = summaryHtml(def, d);
  def.domaines.forEach(dom=>{ const h=document.getElementById("ds-"+tool+"-"+dom.id); if (h) h.innerHTML = headScoreHtml(dom, d); });
}
let _saveTimer=null;
function persist(){
  clearTimeout(_saveTimer);
  _saveTimer = setTimeout(()=>{
    firebase.firestore().collection("outils").doc(PORTAL.sid).set({
      clientId: PORTAL.clientId, ikigai: PORTAL.outils.ikigai, arbre: PORTAL.outils.arbre,
      updatedAt: new Date().toISOString()
    }, { merge:true }).then(()=>{
      ["ikigai","arbre"].forEach(t=>{ const el=document.getElementById("saved-"+t); if (el) el.textContent="✓ Enregistré"; });
    }).catch(e=>console.error("Enregistrement impossible:", e));
  }, 700);
}
function slide(tool, domId, i, el){
  const d = PORTAL.outils[tool];
  if (!d.q[domId]) d.q[domId]={};
  const val = Number(el.value);
  d.q[domId][i] = val;
  el.classList.remove("untouched");
  const row = el.closest(".rv-q"); if (row) row.classList.add("has");
  const sc = document.getElementById(`qs-${tool}-${domId}-${i}`); if (sc) sc.textContent = String(val);
  refreshRadar(tool); persist();
}
function slideCommit(tool, domId, i, el){ if (el.classList.contains("untouched")) slide(tool, domId, i, el); }
function noteChange(tool, domId, val){ PORTAL.outils[tool].note[domId]=val; persist(); }
function switchTab(tool){
  PORTAL.tab = tool;
  document.querySelectorAll(".tab-btn").forEach(b=>b.classList.toggle("active", b.dataset.tool===tool));
  document.getElementById("panel").innerHTML = panelHtml(tool);
}

function frenchDate(iso){
  if (!iso) return null;
  const d = new Date(iso+"T00:00:00");
  if (isNaN(d)) return null;
  return d.toLocaleDateString("fr-FR", {weekday:"long", day:"numeric", month:"long"});
}

function parcoursHtml(parcours){
  parcours = parcours || { phases: [], objectifs: [] };
  const phasesHtml = (parcours.phases||[]).map(ph => `
    <div style="display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)">
      <span style="font-size:17px">${ph.done ? "✅" : "⬜"}</span>
      <span style="font-size:14px;${ph.done ? "text-decoration:line-through;color:var(--muted)" : ""}">${esc(ph.label)}</span>
    </div>`).join("");
  const objHtml = (parcours.objectifs||[]).map(ob => `
    <div style="margin-bottom:14px">
      <div style="display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:5px">
        <span>${esc(ob.titre)}</span><b style="color:var(--accent)">${ob.progression||0}%</b>
      </div>
      <div style="background:var(--line);border-radius:6px;height:8px;overflow:hidden">
        <div style="background:var(--accent);height:100%;width:${ob.progression||0}%"></div>
      </div>
    </div>`).join("");
  return `
    <div style="font-weight:700;margin-bottom:8px">🧗 Mon parcours</div>
    ${phasesHtml || '<p class="muted" style="margin:4px 0">Les étapes seront ajoutées par ton coach.</p>'}
    ${objHtml ? `<div style="margin-top:16px">${objHtml}</div>` : ""}
  `;
}

function exerciceSimpleHtml(ex, idx){
  return `
    <label style="display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer">
      <input type="checkbox" ${ex.done ? "checked" : ""} onchange="toggleExercice(${idx}, this.checked)" style="margin-top:3px">
      <span>
        <span style="font-size:14px;${ex.done ? "text-decoration:line-through;color:var(--muted)" : ""}">${esc(ex.titre)}</span>
        ${ex.consigne ? `<div style="font-size:12.5px;color:var(--muted);margin-top:2px">${esc(ex.consigne)}</div>` : ""}
      </span>
    </label>`;
}

// Exercice avec questions : le client répond directement, l'enregistrement est automatique.
// Résultats partagés par le coach (le portail ne reçoit que des chiffres déjà calculés : aucun barème).
function resultatsPartagesHtml(res){
  if (!res || !Array.isArray(res.barres) || !res.barres.length) return "";
  const haut = Math.max.apply(null, res.barres.map(b => Number(b.valeur) || 0));
  const intro = res.type === "drivers"
    ? "Voici ce que ton coach a relevé avec toi. Plus la barre est haute, plus ce message est présent dans ta vie ces temps-ci. Ce n'est pas un diagnostic : c'est un point de départ pour en parler ensemble."
    : "Voici les positions que tu as le plus choisies dans ta vie de tous les jours. Elles décrivent des habitudes, pas ce que tu vaux, et elles peuvent évoluer.";
  const barres = res.barres.map(b => { const v = Number(b.valeur) || 0, m = Number(b.max) || 1, fort = v === haut && haut > 0;
    return `<div style="margin:8px 0"><div style="display:flex;justify-content:space-between;gap:8px;font-size:13.5px;${fort ? "font-weight:700" : ""}"><span>${esc(b.nom)}</span><span>${v} / ${m}</span></div><div style="height:9px;border-radius:5px;background:#E9E3D2;margin-top:3px"><div style="height:9px;border-radius:5px;background:var(--accent);width:${Math.min(100, Math.round(v * 100 / m))}%"></div></div></div>`; }).join("");
  const detail = (res.detail || []).length ? `<details style="margin-top:6px"><summary style="cursor:pointer;font-size:13px">Voir le détail par situation</summary>${res.detail.map(d => `<div style="font-size:13px;margin-top:4px"><b>${esc(d.theme)}</b> → ${esc(d.position)}</div>`).join("")}</details>` : "";
  const mot = res.message ? `<div style="margin-top:8px;padding:8px 10px;border-left:3px solid var(--accent);background:#FBF7EC;font-size:13.5px;white-space:pre-wrap"><b>Le mot de ton coach :</b> ${esc(res.message)}</div>` : "";
  return `<div style="margin:12px 0;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#FFFDF7"><div style="font-weight:700;font-size:14px">📊 Mes résultats</div><p class="muted" style="font-size:13px;margin:4px 0 6px">${esc(intro)}</p>${barres}${detail}${mot}</div>`;
}

// Question « répartir des points » (par exemple 10 points entre 4 réponses), avec total contrôlé en direct.
function pointsChampHtml(c, idx, rep){
  const tot = c.total || 10, p = String(rep[c.id] || "").split(",").map(x => x.trim());
  const somme = p.reduce((a, x) => a + (parseInt(x, 10) || 0), 0);
  const lignes = (c.options || []).map((o, k) => `<label style="display:flex;align-items:center;gap:10px;padding:8px 10px;margin:5px 0;border:1px solid var(--line);border-radius:10px;font-size:14px;line-height:1.4;background:#fff"><span style="flex:1">${esc(o.texte)}</span><input type="number" inputmode="numeric" min="0" max="${tot}" step="1" value="${esc(p[k] === undefined ? "" : p[k])}" data-pts="rep_${idx}_${esc(c.id)}" oninput="saisiePoints(${idx}, '${esc(c.id)}', ${tot})" aria-label="Points pour : ${esc(o.texte)}" style="width:62px;box-sizing:border-box;border:1px solid var(--line);border-radius:8px;padding:8px;font-family:inherit;font-size:16px;text-align:center"></label>`).join("");
  return `<fieldset style="margin:12px 0;border:0;padding:0;min-width:0"><legend style="font-weight:600;font-size:13.5px;padding:0">${esc(c.label)}</legend>${c.aide ? `<div class="muted" style="font-size:12.5px;margin:2px 0 4px">${esc(c.aide)}</div>` : ""}${lignes}<div id="tot_${idx}_${esc(c.id)}" style="font-size:13px;margin:4px 2px;font-weight:600;color:${somme === tot ? "#2F7D3B" : "#8F5200"}">${libelleTotal(somme, tot)}</div></fieldset>`;
}
function libelleTotal(somme, tot){
  if (somme === tot) return "✅ Total : " + tot + " / " + tot;
  const ecart = Math.abs(tot - somme), s = ecart > 1 ? "s" : "";
  return "Total : " + somme + " / " + tot + (somme < tot ? " — il te reste " + ecart + " point" + s + " à répartir" : " — tu as dépassé de " + ecart + " point" + s);
}
function saisiePoints(idx, champId, tot){
  const champs = Array.from(document.querySelectorAll('input[data-pts="rep_' + idx + '_' + champId + '"]'));
  let somme = 0;
  const vals = champs.map(i => { let v = parseInt(i.value, 10); if (isNaN(v)) v = 0; if (v < 0) { v = 0; i.value = "0"; } if (v > tot) { v = tot; i.value = String(tot); } somme += v; return v; });
  const t = document.getElementById("tot_" + idx + "_" + champId);
  if (t) { t.textContent = libelleTotal(somme, tot); t.style.color = somme === tot ? "#2F7D3B" : "#8F5200"; }
  saisieReponse(idx, champId, champs.every(i => i.value === "") ? "" : vals.join(","));
}

// Séance en direct : le coach partage un protocole pendant la séance ; la personne voit la question montrée et répond.
let _liveUnsub = null, _liveCourant = null, _liveTimer = null;
function demarrerLive(){
  if (_liveUnsub || !PORTAL.clientId) return;
  try { _liveUnsub = firebase.firestore().collection("clients").doc(PORTAL.clientId).onSnapshot(s => { const d = s.data && s.data(); if (PORTAL.client) PORTAL.client.seanceDirect = d ? d.seanceDirect : null; renderLive(); }, e => { console.error("direct:", e); _liveUnsub = null; }); } catch (e) { console.error("direct:", e); }
}
function renderLive(){
  const z = document.getElementById("liveZone"); if (!z) return;
  const l = PORTAL.client && PORTAL.client.seanceDirect;
  if (!l || !l.actif) { z.innerHTML = ""; _liveCourant = null; return; }
  const i = typeof l.courant === "number" ? l.courant : -1, ch = (l.champs || [])[i];
  if (z.querySelector("#live_rep") && _liveCourant === i) return;   // on ne reconstruit pas la zone pendant que la personne écrit
  _liveCourant = i;
  const rep = ch && l.reponses ? (l.reponses[ch.id] || "") : "";
  z.innerHTML = `<div class="card" style="border:2px solid #C0392B55"><div style="font-weight:700">🔴 Séance en direct avec ton coach</div><div class="muted" style="margin:2px 0 6px">${esc(l.titre || "")}</div>` + (ch
    ? `<div style="font-weight:600;font-size:15px;margin:8px 0 2px">${esc(ch.label)}</div>${ch.aide ? `<div class="muted" style="font-size:13px">${esc(ch.aide)}</div>` : ""}<textarea id="live_rep" rows="4" placeholder="Écris ici, ton coach te voit en direct" oninput="saisieLive(this.value)" style="width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:10px;padding:10px;font-family:inherit;font-size:16px;margin-top:8px">${esc(rep)}</textarea><div id="live_etat" class="muted" style="font-size:12px;min-height:16px"></div>`
    : `<p class="muted" style="font-size:14px">${l.consigne ? esc(l.consigne) + "<br><br>" : ""}Ton coach va te présenter les questions une par une. Tu peux répondre ici, ou à l'oral.</p>`) + `</div>`;
}
function saisieLive(valeur){
  clearTimeout(_liveTimer);
  const l = PORTAL.client && PORTAL.client.seanceDirect; if (!l || !l.actif) return;
  const ch = (l.champs || [])[l.courant]; if (!ch) return;
  const etat = document.getElementById("live_etat"); if (etat) etat.textContent = "…";
  _liveTimer = setTimeout(async () => {
    try { await firebase.firestore().collection("clients").doc(PORTAL.clientId).update({ ["seanceDirect.reponses." + ch.id]: String(valeur).slice(0, 4000), "seanceDirect.majLe": new Date().toISOString() }); const e2 = document.getElementById("live_etat"); if (e2) e2.textContent = "✓ Vu par ton coach"; }
    catch (e) { console.error("direct:", e); const e2 = document.getElementById("live_etat"); if (e2) e2.textContent = "⚠️ Non envoyé, réessaie"; }
  }, 700);
}

      ${c.aide ? `<div class="muted" style="font-size:12.5px;margin:2px 0 4px">${esc(c.aide)}</div>` : ""}
      ${(c.options || []).map(o => `<label style="display:flex;align-items:flex-start;gap:10px;padding:9px 10px;margin:5px 0;border:1px solid var(--line);border-radius:10px;font-size:14px;line-height:1.4;cursor:pointer;background:#fff"><input type="radio" name="rep_${idx}_${esc(c.id)}" value="${esc(o.id)}" ${rep[c.id] === o.id ? "checked" : ""} data-champ="${esc(c.id)}" onchange="saisieReponse(${idx}, this.dataset.champ, this.value)" style="margin-top:2px;width:18px;height:18px;flex:none"><span>${esc(o.texte)}</span></label>`).join("")}

}

  const exos = client.exercices || [];

const _repTimers = {};
function saisieReponse(idx, champId, valeur){
  const ex = (PORTAL.client.exercices || [])[idx];
  if (!ex) return;
  PORTAL.client.reponsesExercices = PORTAL.client.reponsesExercices || {};
  (PORTAL.client.reponsesExercices[ex.id] = PORTAL.client.reponsesExercices[ex.id] || {})[champId] = valeur;
  const msg = document.getElementById("msg_" + idx);
  if (msg) msg.textContent = "…";
  const cle = ex.id + "." + champId;
  clearTimeout(_repTimers[cle]);
  _repTimers[cle] = setTimeout(() => {
    firebase.firestore().collection("clients").doc(PORTAL.clientId).update({
      ["reponsesExercices." + ex.id + "." + champId]: valeur,
      ["reponsesExercices." + ex.id + "._maj"]: new Date().toISOString()
    }).then(() => { if (msg) msg.textContent = "✓ Enregistré"; })
      .catch(e => { console.error("réponse:", e); if (msg) msg.textContent = "⚠️ Non enregistré, vérifie ta connexion"; });
  }, 800);
}

function toggleExercice(idx, done){
  PORTAL.client.exercices[idx].done = done;
  firebase.firestore().collection("clients").doc(PORTAL.clientId).update({
    exercices: PORTAL.client.exercices
  }).catch(e => { console.error("exercice:", e); });
}

  const list = entries.length ? entries.map(e => {
    const isClient = e.author === "client";
    return `<div style="margin-bottom:10px;text-align:${isClient ? "right" : "left"}">
      <div style="display:inline-block;max-width:80%;text-align:left;padding:8px 12px;border-radius:12px;font-size:13.5px;line-height:1.4;background:${isClient ? "var(--accentSoft)" : "#fff"};border:1px solid var(--line)">

  }).join("") : '<p class="muted" style="text-align:center;padding:14px 0">Aucun échange pour le moment.</p>';

      <button class="btn" id="echangeSend">Envoyer</button>
    </div>
  `;
}

function sendEchange(){
  const input = document.getElementById("echangeInput");
  const text = input.value.trim();
  if (!text) return;
  if (!PORTAL.client.echanges) PORTAL.client.echanges = [];
  PORTAL.client.echanges.push(echangeEntry("client", text));
  firebase.firestore().collection("clients").doc(PORTAL.clientId).update({
    echanges: firebase.firestore.FieldValue.arrayUnion(PORTAL.client.echanges[PORTAL.client.echanges.length - 1])
  }).then(() => {
    input.value = "";
    document.getElementById("echangeZone").innerHTML = echangesHtml(PORTAL.client);
    document.getElementById("echangeSend").addEventListener("click", sendEchange);
  }).catch(e => {
    console.error("échange:", e);
    PORTAL.client.echanges.pop();
    alert("Message non envoyé, réessaie dans un instant.");
  });
}

const RYTHMES = {

  pause:   { court:"Pause",   label:"Je souffle…", emoji:"⏸️", color:"#4A90C8" },

  sos:     { court:"SOS",     label:"Urgence",     emoji:"🆘", color:"#D9534F" }
};

function rythmesHtml(client) {
  const cur = client.rythme && client.rythme.etat;

  }).join("");
  const msgs = {

  } else if (cur && msgs[cur]) {
    msg = `<p class="muted" style="margin:12px 0 0;font-size:13.5px">${esc(msgs[cur])}</p>`;
  }

function setRythme(etat) {
  if (!RYTHMES[etat]) return;
  const entry = { etat: etat, date: new Date().toISOString() };
  const prev = PORTAL.client.rythme;
  PORTAL.client.rythme = entry;
  firebase.firestore().collection("clients").doc(PORTAL.clientId).update({
    rythme: entry,
    rythmeHistorique: firebase.firestore.FieldValue.arrayUnion(entry)
  }).then(() => {
    document.getElementById("rythmeZone").innerHTML = rythmesHtml(PORTAL.client);
  }).catch(e => {
    console.error("rythme:", e);
    PORTAL.client.rythme = prev;
    document.getElementById("rythmeZone").innerHTML = rythmesHtml(PORTAL.client);
    alert("Ton rythme n'a pas pu être enregistré. Réessaie dans un instant.");
  });
}

function agendaLien(client) {
  const date = client.nextSession, heure = client.nextSessionHeure || "";
  const p = x => String(x).padStart(2, "0");
  const ymd = d => d.getFullYear() + p(d.getMonth()+1) + p(d.getDate());
  let dates;
  if (!heure) { const nd = new Date(date + "T00:00:00"); nd.setDate(nd.getDate() + 1); dates = date.replace(/-/g, "") + "/" + ymd(nd); }
  else { const st = new Date(date + "T" + heure + ":00"), en = new Date(st.getTime() + 3600000); const f = d => ymd(d) + "T" + p(d.getHours()) + p(d.getMinutes()) + "00"; dates = f(st) + "/" + f(en); }
  return "https://calendar.google.com/calendar/render?" + new URLSearchParams({ action:"TEMPLATE", text:"Séance de coaching", dates:dates }).toString();
}

function plantSvg(stage) {
  const top = { 1:115, 2:80, 3:55, 4:38 }[stage];
  const leaf = (x, y, rot) => `<ellipse cx="${x}" cy="${y}" rx="10" ry="4.8" fill="#5FA05A" transform="rotate(${rot} ${x} ${y})"/>`;
  const flower = (x, y, c) => { let u = ""; for (let i = 0; i < 5; i++) u += `<ellipse cx="${x}" cy="${y-8}" rx="4.8" ry="7.5" fill="${c}" transform="rotate(${i*72} ${x} ${y})"/>`; return u + `<circle cx="${x}" cy="${y}" r="3.6" fill="#F2C94C"/>`; };
  const bud = (x, y) => `<ellipse cx="${x}" cy="${y}" rx="4" ry="6" fill="#E88A8A"/>`;
  const pairs = { 1:1, 2:2, 3:3, 4:3 }[stage];
  let leaves = "";
  for (let k = 0; k < pairs; k++) { const y = 138 - k * 26; leaves += leaf(68, y, -30) + leaf(92, y - 6, 30); }
  let haut = "";
  if (stage === 3) haut = bud(80, top - 4) + bud(66, top + 16) + bud(94, top + 12);
  if (stage === 4) haut = flower(80, top, "#E87A7A") + flower(60, top + 24, "#F29BA0") + flower(100, top + 20, "#E87A7A");
  if (stage <= 2) haut = leaf(72, top, -40) + leaf(88, top - 2, 40);
  return `<svg viewBox="0 0 160 190" width="130" height="154" role="img" aria-label="Plante, étape ${stage} sur 4"><path d="M80 152 L80 ${top}" stroke="#4E8B4A" stroke-width="4" stroke-linecap="round" fill="none"/>${leaves}${haut}<ellipse cx="80" cy="152" rx="34" ry="6" fill="#6B4A32"/><path d="M46 152 L54 186 L106 186 L114 152 Z" fill="#C8734A"/><rect x="44" y="148" width="72" height="9" rx="3" fill="#B5633C"/></svg>`;
}
function progressionParcours(p) {
  if (!p) return 0;
  const ph = p.phases || [];
  if (ph.length) return ph.filter(x => x.done).length / ph.length;
  const ob = p.objectifs || [];
  if (ob.length) return ob.reduce((a, o) => a + (o.progression || 0), 0) / ob.length / 100;
  return 0;
}
function planteHtml(client) {
  const r = progressionParcours(client.parcours), st = r < 0.25 ? 1 : r < 0.5 ? 2 : r < 0.75 ? 3 : 4;
  const noms = ["Le lancement", "La mise en place", "La pratique", "La floraison"];
  return `<div class="card" id="planteZone" style="display:flex;align-items:center;gap:14px">${plantSvg(st)}<div><div class="muted" style="font-size:12px;letter-spacing:.08em">ÉVOLUTION DE MON PROJET</div><div style="font-size:17px;font-weight:700;margin:4px 0">Étape ${st} · ${noms[st-1]}</div><div class="muted" style="font-size:13px">${Math.round(r * 100)}% des étapes franchies</div></div></div>`;
}
function rdvPortailListe(client) {
  const l = (client.rendezVous || []).filter(r => r && r.date);
  if (l.length) return l;
  return client.nextSession ? [{ id: "next", date: client.nextSession, heure: client.nextSessionHeure || "", motif: "" }] : [];
}
function rdvPortailHtml(client) {
  const tous = rdvPortailListe(client);
  const p2 = x => String(x).padStart(2, "0"), d0 = new Date();
  const maintenant = d0.getFullYear() + "-" + p2(d0.getMonth()+1) + "-" + p2(d0.getDate()) + "T" + p2(d0.getHours()) + ":" + p2(d0.getMinutes());
  const cle = r => r.date + "T" + (r.heure || "00:00");
  const jolie = d => { const x = new Date(d + "T00:00:00"); return isNaN(x) ? d : x.toLocaleDateString("fr-FR", { weekday:"long", day:"numeric", month:"long", year:"numeric" }); };
  const avenir = tous.filter(r => cle(r) >= maintenant).sort((a, b) => cle(a) < cle(b) ? -1 : 1);
  const passes = tous.filter(r => cle(r) < maintenant).sort((a, b) => cle(a) < cle(b) ? 1 : -1);
  const ligne = (r, lien) => `<div style="padding:8px 10px;border:1px solid #E4DAC0;border-radius:8px;margin-bottom:6px;font-size:14px"><b>${esc(jolie(r.date))}</b>${r.heure ? " à " + esc(r.heure) : ""}${r.motif ? '<span class="muted"> — ' + esc(r.motif) + "</span>" : ""}${lien ? '<br><a href="' + agendaLien({ nextSession: r.date, nextSessionHeure: r.heure }) + '" target="_blank" rel="noopener" style="font-size:12.5px;color:var(--accent);font-weight:600;text-decoration:none">📅 Ajouter à mon agenda</a>' : ""}</div>`;
  const bloc = (titre, liste, lien) => `<div style="font-weight:700;font-size:13px;margin:10px 0 6px">${titre} (${liste.length})</div>` + (liste.length ? liste.map(r => ligne(r, lien)).join("") : '<div class="muted" style="font-size:13px">Aucun</div>');
  if (!tous.length) return `<div class="card" id="rdvZone"><div style="font-weight:700">📅 Mes rendez-vous</div><p class="muted">Pas encore de rendez-vous ici. Dès que ton coach en planifie un, il apparaîtra juste ici 🌿</p></div>`;
  return `<div class="card" id="rdvZone"><div style="font-weight:700">📅 Mes rendez-vous</div>${bloc("À venir", avenir, true)}${bloc("Passés", passes, false)}</div>`;
}

function checkinInterieur(client, envoye) {
  const k = (client.checkins || []).filter(x => x && x.date);
  const dernier = k[k.length - 1];

// Empreinte SHA-256 des éléments du contrat (détecte toute modification après signature).
async function contratEmpreinte(p, mention) {
  try {
    const t = JSON.stringify([p.nom, p.adresse, p.email, p.tel, p.objectif, p.debut, p.fin, String(p.nbSeances), String(p.montant), p.precision || "", p.faitLe || "", mention || ""]);
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(t));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
  } catch (e) { return null; }
}

// Zone de signature manuscrite (doigt, stylet ou souris).
function creerPadSignature(canvas) {
  const ctx = canvas.getContext && canvas.getContext("2d"); let dessin = false, trace = false;
  const r0 = canvas.getBoundingClientRect(), ratio = window.devicePixelRatio || 1;
  if (r0.width && ctx) { canvas.width = Math.round(r0.width * ratio); canvas.height = Math.round((r0.height || 140) * ratio); ctx.scale(ratio, ratio); }
  if (ctx) { ctx.lineWidth = 2.2; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.strokeStyle = "#1a1a1a"; }
  canvas.style.touchAction = "none";
  const pos = e => { const r = canvas.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
  canvas.addEventListener("pointerdown", e => { if (!ctx) return; dessin = true; const q = pos(e); ctx.beginPath(); ctx.moveTo(q.x, q.y); try { canvas.setPointerCapture(e.pointerId); } catch (x) {} e.preventDefault(); });
  canvas.addEventListener("pointermove", e => { if (!dessin || !ctx) return; const q = pos(e); ctx.lineTo(q.x, q.y); ctx.stroke(); trace = true; e.preventDefault(); });
  const fin = () => { dessin = false; };
  canvas.addEventListener("pointerup", fin); canvas.addEventListener("pointercancel", fin); canvas.addEventListener("pointerleave", fin);
  return { vide: () => !trace, dataUrl: () => trace ? canvas.toDataURL("image/png") : null, effacer: () => { trace = false; if (ctx) { ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, canvas.width, canvas.height); ctx.restore(); } } };
}

    <canvas id="ct_canvas" style="width:100%;height:150px;border:1px dashed var(--accent);border-radius:8px;background:#fff;display:block"></canvas>
    <button type="button" onclick="effacerContratSignature()" style="margin-top:6px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;font-family:inherit;font-size:16px;cursor:pointer">Effacer</button>
    <p class="muted" style="font-size:12.5px;margin:10px 0 6px">En signant, la date et l'heure de ta signature ainsi que l'adresse IP de ta connexion sont enregistrées, pour prouver que c'est bien toi qui as signé.</p>
    <button type="button" id="ct_btn" disabled onclick="signerContratV2()" style="border:none;border-radius:10px;padding:11px 16px;background:var(--accent);color:#fff;font-family:inherit;font-size:16px;font-weight:600;cursor:pointer;opacity:.5">✍️ Signer le contrat</button>
    <div class="muted" id="ct_msg" style="font-size:12.5px;margin-top:6px;min-height:16px"></div></div>`;
}
// Les anciens contrats sont réaffichés depuis du HTML enregistré : on en retire tout ce qui pourrait s'exécuter.
function assainirHtml(html) {
  const doc = new DOMParser().parseFromString(String(html || ""), "text/html");
  doc.querySelectorAll("script,iframe,object,embed,link,meta,base,form").forEach(n => n.remove());
  doc.querySelectorAll("*").forEach(n => Array.from(n.attributes).forEach(a => { const nom = a.name.toLowerCase(), v = String(a.value).trim().toLowerCase(); if (nom.indexOf("on") === 0 || ((nom === "href" || nom === "src" || nom === "xlink:href" || nom === "action" || nom === "formaction") && (v.indexOf("javascript:") === 0 || (v.indexOf("data:") === 0 && v.indexOf("data:image/") !== 0)))) n.removeAttribute(a.name); }));
  return doc.body.innerHTML;
}
let _ctPad = null;
function initContratSignature() { const cv = document.getElementById("ct_canvas"); if (!cv) return; _ctPad = creerPadSignature(cv); ["pointerup", "pointerleave"].forEach(ev => cv.addEventListener(ev, majContratSignature)); }
const mentionOk = t => String(t || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-zA-Z ]/g, "").replace(/\s+/g, " ").trim().toLowerCase() === "lu et approuve";
function majContratSignature() { const b = document.getElementById("ct_btn"); if (!b) return; const ok = _ctPad && !_ctPad.vide() && mentionOk(document.getElementById("ct_mention").value); b.disabled = !ok; b.style.opacity = ok ? "1" : ".5"; }
function effacerContratSignature() { if (_ctPad) _ctPad.effacer(); majContratSignature(); }
async function adresseIp() { try { const c = new AbortController(), t = setTimeout(() => c.abort(), 4000); const r = await fetch("https://api.ipify.org?format=json", { signal: c.signal }); clearTimeout(t); const j = await r.json(); return j && j.ip ? String(j.ip) : null; } catch (e) { return null; } }
async function signerContratV2() {
  const btn = document.getElementById("ct_btn"), msg = document.getElementById("ct_msg"); if (!btn || btn.disabled || !PORTAL.contrat) return;
  const mention = document.getElementById("ct_mention").value.trim(), signature = _ctPad && _ctPad.dataUrl();
  if (!signature || !mentionOk(mention)) { msg.textContent = "Écris « Lu et approuvé » et signe avant de valider."; return; }
  if (signature.length > 400000) { msg.textContent = "Ta signature est trop détaillée pour être enregistrée : efface-la et signe plus simplement."; return; }
  btn.disabled = true; btn.textContent = "Signature en cours…";
  try {
    const ref = firebase.firestore().collection("clients").doc(PORTAL.clientId).collection("contracts").doc(PORTAL.contrat.id);
    const frais = await ref.get();
    if (!frais.exists || frais.data().status !== "pending_signature") { msg.textContent = "Ce contrat vient d'être modifié par ton coach. Recharge la page pour voir la dernière version."; btn.textContent = "✍️ Signer le contrat"; return; }
    const d = frais.data(), maintenant = new Date().toISOString(), ip = await adresseIp(), empreinte = await contratEmpreinte(d.params, "Lu et approuvé");
    const sig = { coach: d.coachSignature, client: signature, mention: "Lu et approuvé", signeLe: maintenant, ip, empreinte };
    const charge = { status: "signed", clientSignature: signature, mention: "Lu et approuvé", signedAt: maintenant, signedAtServer: firebase.firestore.FieldValue.serverTimestamp(), signerIp: ip, ipStatus: ip ? "ok" : "indisponible", signerUserAgent: String(navigator.userAgent || "").slice(0, 300), contentHash: empreinte, htmlContent: contratHtml(d.params, sig) };
    const db = firebase.firestore();
    if (typeof db.runTransaction === "function") { await db.runTransaction(async tx => { const s = await tx.get(ref); if (!s.exists || s.data().status !== "pending_signature" || JSON.stringify(s.data().params) !== JSON.stringify(d.params)) throw new Error("MODIFIE"); tx.update(ref, charge); }); } else { await ref.update(charge); }
    try { await firebase.firestore().collection("clients").doc(PORTAL.clientId).update({ contractStatus: "signed" }); } catch (e) { console.error("statut client:", e); }
    PORTAL.contrat = { id: PORTAL.contrat.id, data: Object.assign({}, d, { status: "signed", clientSignature: signature, mention: "Lu et approuvé", signedAt: maintenant, signerIp: ip, contentHash: empreinte }) };
    document.getElementById("contractZone").innerHTML = contratSigneHtml(PORTAL.contrat.data);
  } catch (e) { if (e && e.message === "MODIFIE") { msg.textContent = "Ce contrat vient d'être modifié par ton coach. Recharge la page pour voir la dernière version."; btn.textContent = "✍️ Signer le contrat"; btn.disabled = false; return; } console.error("signature:", e); btn.disabled = false; btn.textContent = "✍️ Signer le contrat"; msg.textContent = "⚠️ La signature n'a pas pu être enregistrée. Ton dessin est conservé : réessaie dans un instant."; }
}
function telechargerContratClient() { const d = PORTAL.contrat && PORTAL.contrat.data; if (d) telechargerContratPDF(d.params, contratSigObj(d), "mon-contrat-de-coaching.pdf").catch(() => alert("Le PDF n'a pas pu être créé. Réessaie dans un instant.")); }

function renderContractButton(){ chargerContratV2().then(v2 => { if (!v2) renderContractButtonLegacy(); }).catch(() => renderContractButtonLegacy()); }
function renderContractButtonLegacy(){
  const box = document.getElementById("contractZone");
  firebase.firestore().collection("clients").doc(PORTAL.clientId).collection("contracts")
    .orderBy("createdAt","desc").limit(1).get().then(qs=>{
      if (qs.empty) { box.innerHTML = ""; return; }
      const doc = qs.docs[0].data();
      box.innerHTML = `<div class="card">
        <div style="font-weight:700;margin-bottom:10px">📄 Mon contrat ${doc.status==="signed" ? "(signé)" : "(brouillon)"}</div>
        <button class="btn" id="btnShowContract" style="background:transparent;color:var(--accent);border:1px solid var(--accent);padding:9px 14px">Afficher</button>
        <div id="contractHtml" style="display:none;margin-top:12px" class="contract-view"></div>
      </div>`;
      document.getElementById("btnShowContract").addEventListener("click", function(){
        const z = document.getElementById("contractHtml");
        if (z.style.display==="none"){ z.style.display="block"; z.innerHTML = assainirHtml(doc.htmlContent); this.textContent="Masquer"; }
        else { z.style.display="none"; this.textContent="Afficher"; }
      });
    }).catch(()=>{ box.innerHTML=""; });
}

// Les outils (Ikigaï, Arbre de vie) restent masqués tant que le coach ne les a pas activés pour ce client.
function outilsActifs(client) {
  const po = (client && client.portailOutils) || {};
  return ["ikigai", "arbre"].filter(k => po[k] === true);
}
function outilsCardHtml(client) {
  const actifs = outilsActifs(client);
  if (!actifs.length) return "";
  const noms = { ikigai: "🎯 Ikigaï", arbre: "🌳 Arbre de Vie" };
  PORTAL.tab = actifs[0];
  return `<div class="card">
      <div style="font-weight:700;margin-bottom:4px">🛠️ Mes outils</div>
      <p class="muted" style="margin-top:0">À remplir avant notre prochaine séance, si tu en as l'occasion — pas d'obligation.</p>
      <div class="tabs">${actifs.map((k, i) => `<button class="tab-btn${i === 0 ? " active" : ""}" data-tool="${k}" onclick="switchTab('${k}')">${noms[k]}</button>`).join("")}</div>
      <div id="panel">${panelHtml(actifs[0])}</div>
    </div>`;
}

function renderPortal(){
  const app = document.getElementById("app");
  const nom = (PORTAL.client && PORTAL.client.name) || "";
  const next = frenchDate(PORTAL.client && PORTAL.client.nextSession);
  app.innerHTML = `
    <h1>👋 Bonjour ${esc(nom)}</h1>
    <p class="muted" style="margin-bottom:16px">Ton espace personnel de coaching</p>
    <div id="liveZone"></div>
    ${rdvPortailHtml(PORTAL.client)}
    <div id="contractZone"></div>
    ${questionnaireHtml(PORTAL.client)}
    <div class="card" id="rythmeZone">${rythmesHtml(PORTAL.client)}</div>
    ${checkinHtml(PORTAL.client)}
    ${planteHtml(PORTAL.client)}
    ${(PORTAL.client.parcours && (PORTAL.client.parcours.phases||[]).length) ? `<div class="card">${parcoursHtml(PORTAL.client.parcours)}</div>` : ""}
    ${exercicesHtml(PORTAL.client)}
    ${outilsCardHtml(PORTAL.client)}
    <div class="card" id="echangeZone">${echangesHtml(PORTAL.client)}</div>
  `;
  renderContractButton(); demarrerLive();
  document.getElementById("echangeSend").addEventListener("click", sendEchange);
}

(function init(){
  const params = new URLSearchParams(location.search);
  const token = params.get("t");
  const app = document.getElementById("app");
  if (!token){ app.innerHTML = '<div class="empty">Lien invalide.<br>Demande un nouveau lien à ton coach.</div>'; return; }

  firebase.auth().signInAnonymously().then(function(){
    return firebase.firestore().collection("portalLinks").doc(token).get();
  }).then(function(snap){
    if (!snap.exists){ app.innerHTML = '<div class="empty">Ce lien a expiré.<br>Demande un nouveau lien à ton coach.</div>'; return; }
    const clientId = snap.data().clientId;
    PORTAL.clientId = clientId;
    PORTAL.sid = clientId + "_current";
    return firebase.firestore().collection("clients").doc(clientId).get().then(function(csnap){
      PORTAL.client = csnap.exists ? csnap.data() : {};
      return firebase.firestore().collection("outils").doc(PORTAL.sid).get();
    }).then(function(osnap){
      if (osnap.exists){
        const data = osnap.data();
        if (data.ikigai) PORTAL.outils.ikigai = Object.assign({q:{},note:{},scores:{}}, data.ikigai);
        if (data.arbre) PORTAL.outils.arbre = Object.assign({q:{},note:{},scores:{}}, data.arbre);
      }
      recalc(OUTILS_DEF.ikigai, PORTAL.outils.ikigai);
      recalc(OUTILS_DEF.arbre, PORTAL.outils.arbre);
      renderPortal();
    });
  }).catch(function(e){
    console.error("portail:", e);
    app.innerHTML = '<div class="empty">⚠️ Problème de connexion.<br>Réessaie dans un instant.</div>';
  });
})();
