        client.nextSessionHeure = fd.heure || client.nextSessionHeure || "";
        client.sessionHistory = client.sessionHistory || [];
        client.sessionHistory.push("Séance " + client.sessionHistory.length + 1 + " — " + (fd.motif || "RDV (agenda)") + (fd.date ? " (" + fd.date + ")" : ""));
        appliquerForfait(client, fd.motif);
        save();
        notifCoach("📦 Séance décomptée pour " + client.name + (client.forfaitTotal ? " (" + client.forfaitUtilisees + "/" + client.forfaitTotal + ")" : ""));
      }
    }

    setState({ tab: "agenda" });
  });
  const cancelBtn = h("button",{class:"btn-g"},"Annuler");
  cancelBtn.addEventListener("click", () => setState({ tab: "agenda" }));
  row.appendChild(saveBtn); row.appendChild(cancelBtn);
  form.appendChild(row);
  return form;
}

function moisLabelFR(ym) {
  const [y,m] = ym.split("-");
  const noms = ["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
  return noms[Number(m)-1] + " " + y.slice(2);
}

function renderStatistiquesTab() {
  const wrap = h("div",{class:"page-wrap"});
  wrap.appendChild(h("h3",{style:"font-size:20px;color:#2E2A20;font-weight:600;margin-bottom:18px;font-style:italic"}, "Statistiques"));

  const clients = state.clients || [];
  const sessionsByClient = state.sessions || {};
  let allSessions = [];
  Object.keys(sessionsByClient).forEach(cid => {
    const arr = sessionsByClient[cid];
    if (Array.isArray(arr)) arr.forEach(s => allSessions.push(s));
  });

  if (!clients.length) {
    wrap.appendChild(h("p",{style:"color:#6B6355;font-size:14px"}, "Aucune donnée pour l'instant — les statistiques apparaîtront au fil de ta pratique."));
    return wrap;
  }

  // ── Cartes vue d'ensemble ──
  let exoDone = 0, exoTotal = 0;
  let objSum = 0, objCount = 0;
  let phaseDone = 0, phaseTotal = 0;
  let echangesTotal = 0, clientsAvecEchange = 0;
  clients.forEach(c => {
    (c.exercices || []).forEach(ex => { exoTotal++; if (ex.done) exoDone++; });
    if (c.parcours) {
      (c.parcours.objectifs || []).forEach(ob => { objSum += (ob.progression || 0); objCount++; });
      (c.parcours.phases || []).forEach(ph => { phaseTotal++; if (ph.done) phaseDone++; });
    }
    if ((c.echanges || []).length) { clientsAvecEchange++; echangesTotal += c.echanges.length; }
  });
  const tauxExo = exoTotal ? Math.round(exoDone/exoTotal*100) : null;
  const progMoy = objCount ? Math.round(objSum/objCount) : null;
  const tauxPhases = phaseTotal ? Math.round(phaseDone/phaseTotal*100) : null;

  const cards = [
    { val: clients.length, label: "Clients actifs" },
    { val: allSessions.length, label: "Séances réalisées" },
    { val: tauxExo===null ? "—" : tauxExo+"%", label: "Exercices complétés" },
    { val: progMoy===null ? "—" : progMoy+"%", label: "Progression moyenne des objectifs" },
  ];
  const cardsRow = h("div",{style:"display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:26px"});
  cards.forEach(s => {
    cardsRow.appendChild(h("div",{class:"card",style:"padding:18px;text-align:center"},
      h("div",{class:"stat-val",style:"color:#2E2A20"}, String(s.val)),
      h("div",{class:"stat-lbl"}, s.label)
    ));
  });
  wrap.appendChild(cardsRow);

  // ── Séances par mois (6 derniers mois avec activité) ──
  const parDate = {};
  allSessions.forEach(s => {
    if (!s.date) return;
    const d = new Date(s.date);
    if (isNaN(d)) return;
    const ym = d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0");
    parDate[ym] = (parDate[ym]||0) + 1;
  });
  const moisTries = Object.keys(parDate).sort().slice(-6);
  const sessCard = h("div",{class:"card",style:"padding:22px;margin-bottom:20px"});
  sessCard.appendChild(h("h3",{style:"font-size:16px;color:#2E2A20;font-weight:600;margin-bottom:16px"}, "Séances par mois"));
  if (!moisTries.length) {
    sessCard.appendChild(h("p",{style:"color:#6B6355;font-size:13px"}, "Aucune séance enregistrée pour l'instant."));
  } else {
    const max = Math.max(...moisTries.map(m => parDate[m]));
    moisTries.forEach(ym => {
      const n = parDate[ym];
      const pct = Math.round(n/max*100);
      sessCard.appendChild(h("div",{style:"margin-bottom:10px"},
        h("div",{style:"display:flex;justify-content:space-between;margin-bottom:4px"},
          h("span",{style:"color:#5A5648;font-size:13px"}, moisLabelFR(ym)),
          h("span",{style:"color:#5A5648;font-size:13px"}, String(n))
        ),
        h("div",{class:"prog-track"}, h("div",{class:"prog-bar",style:`width:${pct}%;background:#9C7A2E`}))
      ));
    });
  }
  wrap.appendChild(sessCard);

  // ── Parcours : étapes complétées ──
  const parcCard = h("div",{class:"card",style:"padding:22px;margin-bottom:20px"});
  parcCard.appendChild(h("h3",{style:"font-size:16px;color:#2E2A20;font-weight:600;margin-bottom:16px"}, "Avancement des parcours"));
  if (tauxPhases === null) {
    parcCard.appendChild(h("p",{style:"color:#6B6355;font-size:13px"}, "Aucune étape définie pour l'instant."));
  } else {
    parcCard.appendChild(h("div",{style:"margin-bottom:6px"},
      h("div",{style:"display:flex;justify-content:space-between;margin-bottom:4px"},
        h("span",{style:"color:#5A5648;font-size:13px"}, "Étapes cochées, tous clients confondus"),
        h("span",{style:"color:#5A5648;font-size:13px"}, `${phaseDone}/${phaseTotal} · ${tauxPhases}%`)
      ),
      h("div",{class:"prog-track"}, h("div",{class:"prog-bar",style:`width:${tauxPhases}%;background:#9C7A2E`}))
    ));
  }
  wrap.appendChild(parcCard);

  // ── Échanges ──
  const echCard = h("div",{class:"card",style:"padding:22px"});
  echCard.appendChild(h("h3",{style:"font-size:16px;color:#2E2A20;font-weight:600;margin-bottom:10px"}, "Échanges avec les clients"));
  echCard.appendChild(h("p",{style:"color:#5A5648;font-size:13.5px"},
    echangesTotal
      ? `${echangesTotal} message${echangesTotal>1?"s":""} au total, avec ${clientsAvecEchange} client${clientsAvecEchange>1?"s":""} sur ${clients.length}.`
      : "Aucun échange pour l'instant."
  ));
  wrap.appendChild(echCard);

  return wrap;
}

function renderRdvTab() {
  const wrap = h("div",{});
  if (!CoachLink.user) { wrap.appendChild(renderCoachLogin()); return wrap; }
  RdvRequests.listen();

  const nouveaux = RdvRequests.items.filter(r => r.status === "nouveau");
  const traites = RdvRequests.items.filter(r => r.status !== "nouveau");

  wrap.appendChild(h("div",{style:"font-weight:700;font-size:14px;color:#2E2A20;margin-bottom:14px"},
    "📅 Nouvelles demandes (" + nouveaux.length + ")"));

  if (!nouveaux.length) {
    wrap.appendChild(h("p",{style:"color:#5A5648;font-size:13px;padding:10px 0"},"Aucune nouvelle demande pour l'instant."));
  }

  nouveaux.forEach(r => {
    const card = h("div",{class:"card",style:"padding:16px;margin-bottom:12px;border-color:#9C7A2E33"});
    card.appendChild(h("div",{style:"display:flex;justify-content:space-between;align-items:start"},
      h("div",{},
        h("div",{style:"font-size:14px;font-weight:700;color:#2E2A20"}, r.prenom + " " + r.nom),
        h("div",{style:"font-size:12px;color:#9C7A2E;margin-top:2px"}, r.motif),
        r.theme ? h("div",{style:"font-size:12px;color:#9880d0;margin-top:2px"}, "💭 " + r.theme) : null,
        h("div",{style:"font-size:13.5px;color:#5A5648;margin-top:6px"}, "📧 " + r.email + (r.tel ? " · 📞 " + r.tel : "")),
        h("div",{style:"font-size:13.5px;color:#5A5648;margin-top:2px"},
          (r.date ? "Souhaité : " + r.date + (r.heure ? " à " + r.heure : "") : "Aucune date précisée")),
        r.message ? h("div",{style:"font-size:12px;color:#9a9a85;margin-top:8px;font-style:italic"}, "\"" + r.message + "\"") : null
      )
    ));
    const actions = h("div",{style:"display:flex;gap:8px;margin-top:12px"});
    const confirmBtn = h("button",{class:"btn-sm",style:"border-color:#4a9e6a44;color:#4a9e6a"},"✓ Confirmer");
    const rejectBtn = h("button",{class:"btn-sm",style:"border-color:#d0707044;color:#d07070"},"✕ Rejeter");
    function bloquerBoutons(txtConfirm, txtReject) {
      confirmBtn.disabled = true; rejectBtn.disabled = true;
      if (txtConfirm) confirmBtn.textContent = txtConfirm;
      if (txtReject) rejectBtn.textContent = txtReject;
    }
    function debloquerBoutons(err) {
      confirmBtn.disabled = false; rejectBtn.disabled = false;
      confirmBtn.textContent = "✓ Confirmer"; rejectBtn.textContent = "✕ Rejeter";
      if (err) {
        const errMsg = h("div",{style:"color:#d07070;font-size:12px;margin-top:6px"}, "Échec : " + err.message);
        card.appendChild(errMsg);
      }
    }
    confirmBtn.addEventListener("click", () => {
      bloquerBoutons("Confirmation…", null);
      RdvRequests.setStatus(r.id, "confirme", (err) => { if (err) debloquerBoutons(err); });
    });
    rejectBtn.addEventListener("click", () => {
      bloquerBoutons(null, "Rejet…");
      RdvRequests.setStatus(r.id, "rejete", (err) => { if (err) debloquerBoutons(err); });
    });
    actions.appendChild(confirmBtn); actions.appendChild(rejectBtn);
    card.appendChild(actions);
    wrap.appendChild(card);
  });

  if (traites.length) {
    wrap.appendChild(h("div",{style:"font-weight:700;font-size:13px;color:#5A5648;margin:18px 0 10px"}, "Traitées"));
    traites.slice(0,10).forEach(r => {
      const col = r.status === "confirme" ? "#4a9e6a" : (r.status === "annule" ? "#d0a070" : "#d07070");
      const label = r.status === "confirme" ? "Confirmé" : (r.status === "annule" ? "Annulé" : "Rejeté");
      const row = h("div",{style:"display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #D8CBA8;font-size:12.5px;gap:10px"});
      row.appendChild(h("div",{style:"color:#2E2A20;flex:1"}, r.prenom + " " + r.nom + " — " + r.motif));
      row.appendChild(h("span",{style:"color:"+col}, label));
      if (r.status === "confirme") {
        const cancelBtn = h("button",{class:"btn-sm",style:"border-color:#d0707044;color:#d07070;padding:4px 10px;font-size:13.5px"},"✕ Annuler");
        cancelBtn.addEventListener("click", () => {
          if (!confirm("Annuler ce rendez-vous et libérer le créneau ?")) return;
          cancelBtn.disabled = true;
          cancelBtn.textContent = "Annulation…";
          RdvRequests.annuler(r.id, (err) => {
            if (err) {
              cancelBtn.disabled = false;
              cancelBtn.textContent = "✕ Annuler";
              cancelBtn.style.background = "#d0707022";
              const errMsg = h("div",{style:"color:#d07070;font-size:11px;margin-top:4px"}, "Échec : " + err.message);
              row.appendChild(errMsg);
            }
          });
        });
        row.appendChild(cancelBtn);
      }
      wrap.appendChild(row);
    });
  }

  return wrap;
}

function clampNum(val, min, max, fallback) {
  var n = parseInt(val, 10);
  if (isNaN(n)) return fallback;
  return Math.min(max, Math.max(min, n));
}

function h(tag, attrs, ...children) {
  const el = document.createElement(tag);
  if (attrs) Object.entries(attrs).forEach(([k,v]) => {
    if (k === "class") el.className = v;
    else if (k === "style") el.style.cssText = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2).toLowerCase(), v);
    else el.setAttribute(k, v);
  });
  children.flat(Infinity).forEach(c => {
    if (c == null || c === false) return;
    el.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
  });
  return el;
}

function el(html) {
  const d = document.createElement("div");
  d.innerHTML = html;
  return d.firstElementChild || d;
}

function profileColor(p) { return PC[p] || "#4a9e6a"; }

function badgeProfil(p) {
  const col = profileColor(p);
  return h("span",{class:"badge-profil",style:`background:${col}22;color:${col};border:1px solid ${col}44`}, p);
}

function badgeStatus(s) {
  const col = s==="actif"?"#4a9e6a":s==="pause"?"#d4885a":"#6B6355";
  return h("span",{class:"status-badge",style:`background:${col}18;color:${col};border:1px solid ${col}33`}, s);
}

function badgeCat(c) {
  const col = CAT_COLORS[c] || "#5A5648";
  return h("span",{class:"cat-badge",style:`background:${col}1a;color:${col};border:1px solid ${col}33`}, c);
}

function avatar(name, profile, size) {

  rdvDuClient(c).forEach(r => { const q = r.date + "T" + (r.heure || "00:00"); ajout(q, "rdv", "🗓️", "Rendez-vous" + (new Date(q) > maintenant ? " (à venir)" : ""), r.motif, "fiche", !r.heure); });
  ((state.sessions || {})[c.id] || []).forEach(x => ajout(x.date, "seance", "🧠", "Séance EN LIVE" + (x.optionName ? " : " + x.optionName : ""), x.notes ? String(x.notes).replace(/<[^>]*>/g, "").slice(0, 160) : "", "notes-c"));
  (c.exercices || []).forEach(x => ajout(x.envoyeLe, "exercice", "📤", "Exercice envoyé : " + x.titre, x.done ? "Terminé par le client ✅" : "", "parcours"));
  const rep = c.reponsesExercices || {};
  Object.keys(rep).forEach(id => { if (rep[id] && rep[id]._maj) { const x = (c.exercices || []).find(e => e.id === id); ajout(rep[id]._maj, "exercice", "✍️", "Réponses reçues" + (x ? " : " + x.titre : ""), "", "parcours"); } });
  (c.rythmeHistorique || []).forEach(r => { const i = rythmeInfo(r.etat); if (i) ajout(r.date, "etat", i.emoji, "Rythme : " + i.court + " — " + i.label, "", "fiche"); });
  (c.checkins || []).forEach(k => ajout(k.date, "etat", "⚡", "Check-in : énergie " + k.energie + "/5 · charge mentale " + k.charge + "/5", k.note, "fiche"));
  if (c.questionnaireAccueil) ajout(c.questionnaireAccueil.modifieLe || c.questionnaireAccueil.envoyeLe, "message", "📋", "Questionnaire d'accueil " + (c.questionnaireAccueil.modifieLe ? "modifié" : "reçu"), "", "fiche");

// Numéro au format international sans « + » (exigé par WhatsApp). Renvoie null si le numéro est inutilisable.
function numeroInternational(tel) {
  let t = String(tel || "").replace(/\(0\)/g, "").replace(/[\s.\-()]/g, "");   // « +33 (0)6… » : le 0 entre parenthèses se retire
  if (!/^\+?\d{8,15}$|^00\d{8,15}$/.test(t)) return null;
  if (t.startsWith("+")) return t.slice(1);
  if (t.startsWith("00")) return t.slice(2);
  if (/^0\d{9}$/.test(t)) return "33" + t.slice(1);
  return t;
}

  const dossier = { exporteLe: new Date().toISOString(), format: "CoachingStudio — dossier client v1", client: c, rendezVous: rdvListeClient(c.id), seancesEnLive: ((state.sessions || {})[c.id] || []), contrats: contrats || [], outils: outils || null, avertissements };

const QA_LABELS = [["Ce qui l'amène à consulter", "q1"], ["Ce qui est important pour lui/elle", "q2"], ["Ce qu'il/elle attend des séances", "q3"], ["À savoir avant le 1er RDV", "q4"], ["Style d'accompagnement préféré", "q5"]];

const QA_CACHE = {};
async function questionnairesPublics(c) {
  const cle = c.id + "|" + (c.email || ""), maintenant = Date.now(), vu = QA_CACHE[cle];
  if (vu && maintenant - vu.t < 45000) return vu.p;
  const db = firebase.firestore(), requetes = [db.collection("questionnaires").where("clientId", "==", c.id).get()];
  if (c.email) requetes.push(db.collection("questionnaires").where("email", "==", c.email).get());
  const p = Promise.allSettled(requetes).then(res => {
    const cartes = [], vus = new Set(); let echecs = 0;
    res.forEach(x => { if (x.status !== "fulfilled") { echecs++; return; } x.value.docs.forEach(d => { if (vus.has(d.id)) return; vus.add(d.id); const r = d.data(); cartes.push({ source: "formulaire public", quand: r.createdAt || r.dateCreated, r }); }); });
    return { cartes, tout_echoue: echecs === res.length };
  });
  QA_CACHE[cle] = { t: maintenant, p };
  p.then(r => { if (r.tout_echoue) delete QA_CACHE[cle]; });   // un échec n'est jamais mis en cache
  return p;
}
// Réunit les réponses reçues via l'espace client ET via le formulaire public (par identifiant de client puis par email), sans doublon.
async function reponsesQuestionnaire(c) {
  const cartes = [], qa = c.questionnaireAccueil;
  if (qa) cartes.push({ source: "espace client", quand: qa.modifieLe || qa.envoyeLe, r: qa });
  const pub = await questionnairesPublics(c);
  pub.cartes.forEach(k => cartes.push(k));
  cartes.sort((a, b) => new Date(b.quand || 0) - new Date(a.quand || 0));
  return { cartes, erreur: pub.tout_echoue && !qa };
}

  const lire = async (nom, f) => { try { return await f(); } catch (e) { avertissements.push(nom + " : lecture impossible (" + (e && e.message ? e.message : "erreur") + ")"); return []; } };
  const requete = async (coll, champ, val) => { const q = await db.collection(coll).where(champ, "==", val).get(); return q.docs.map(d => ({ ref: d.ref, id: d.id })); };
  const unique = l => { const v = new Set(); return l.filter(x => { const k = x.ref.path || x.id; if (v.has(k)) return false; v.add(k); return true; }); };
  const sessions = await lire("séances", () => requete("sessions", "clientId", c.id));

// Supprime dans cet ordre : agenda Google, séances, outils, questionnaires, demandes, contrats, puis la fiche EN DERNIER.
async function supprimerDossierClient(c, inv, progression) {
  const db = firebase.firestore(), echecs = [], faits = [];
  const etape = t => { if (progression) progression(t); };
  const supprimerLot = async (nom, liste) => {
    etape(nom + "…"); if (!liste.length) return;
    try { for (let i = 0; i < liste.length; i += 400) { const b = db.batch(); liste.slice(i, i + 400).forEach(x => b.delete(x.ref)); await b.commit(); } faits.push(nom + " (" + liste.length + ")"); }
    catch (e) { echecs.push({ partie: nom, raison: e && e.message ? e.message : "erreur" }); }
  };
  // 1) évènements Google Agenda (non bloquant : on signale ce qui reste)
  if (inv.rdvs.length && typeof gcalUrl === "function" && gcalUrl()) {
    etape("Agenda Google…"); let ko = 0;
    for (const r of inv.rdvs) { try { await gcalAppel({ action: "delete", rdv: { id: r.id } }); } catch (e) { ko++; } }
    if (ko) echecs.push({ partie: "évènements Google Agenda", raison: ko + " à supprimer à la main dans ton agenda", nonBloquant: true }); else faits.push("évènements Google Agenda (" + inv.rdvs.length + ")");
  }
  await supprimerLot("Séances EN LIVE", inv.sessions);
  await supprimerLot("Outils (Ikigaï, Arbre de vie)", inv.outils);
  await supprimerLot("Réponses aux questionnaires", inv.questionnaires);
  await supprimerLot("Demandes de rendez-vous", inv.demandes);
  await supprimerLot("Contrats", inv.contrats);
  const bloquants = echecs.filter(e => !e.nonBloquant);
  if (bloquants.length) return { ok: false, faits, echecs, ficheSupprimee: false };
  etape("Fiche du client…");
  try { await db.collection("clients").doc(c.id).delete(); faits.push("fiche du client"); }
  catch (e) { echecs.push({ partie: "fiche du client", raison: e && e.message ? e.message : "erreur" }); return { ok: false, faits, echecs, ficheSupprimee: false }; }
  purgerCopiesLocales(c.id);
  return { ok: true, faits, echecs, ficheSupprimee: true };
}

// Retire le client de toutes les copies gardées dans ce navigateur (y compris la sauvegarde de sécurité).
function purgerCopiesLocales(clientId) {
  try {
    state.clients = (state.clients || []).filter(x => x.id !== clientId);
    state.appointments = (state.appointments || []).filter(a => a.clientId !== clientId);
    if (state.sessions) delete state.sessions[clientId];
    Object.keys(localStorage).filter(k => k.indexOf("cs4-") === 0).forEach(k => {
      let v; try { v = JSON.parse(localStorage.getItem(k)); } catch (e) { return; }
      if (Array.isArray(v)) { const n = v.filter(x => !(x && (x.id === clientId || x.clientId === clientId))); if (n.length !== v.length) localStorage.setItem(k, JSON.stringify(n)); }
      else if (v && typeof v === "object" && v[clientId] !== undefined) { delete v[clientId]; localStorage.setItem(k, JSON.stringify(v)); }
    });
  } catch (e) { console.error("purge locale:", e); }
}

// Clés = étapes du parcours (accents et majuscules ignorés). Si tu renommes tes étapes, aucune suggestion n'est inventée.

function packDeLEtape(etape) {

  const tous = catalogueComplet(), tr = ids => ids.map(id => tous.find(x => x.id === id)).filter(Boolean);

}
function packPourEtape(c) {

// ═════════ BROUILLON : liste des personnes coachées pour le tableau de bord ═════════
const ETATS_COACHE = { "actif": ["En cours", "#4a9e6a"], "pause": ["En pause", "#4A90C8"], "terminé": ["Terminé", "#6B6355"] };

// Tout ce que le tableau de bord affiche pour une personne coachée, calculé depuis sa fiche et l'agenda.
function donneesCoache(c) {
  const maintenant = Date.now();
  const passes = (state.appointments || []).filter(a => a.clientId === c.id && a.date && new Date(a.date + "T" + (a.heure || "23:59") + ":00").getTime() <= maintenant).length;
  const enLive = ((state.sessions || {})[c.id] || []).length;
  const ph = (c.parcours && c.parcours.phases) || [];
  let etape = null;
  if (ph.length) { const i = ph.findIndex(x => !x.done); etape = i === -1 ? { index: ph.length, total: ph.length, label: "Parcours terminé", fini: true } : { index: i + 1, total: ph.length, label: ph[i].label, fini: false }; }
  const k = (c.checkins || []).filter(x => x && x.date).sort((a, b) => new Date(b.date) - new Date(a.date))[0];
  const total = Number(c.forfaitTotal) > 0 ? Number(c.forfaitTotal) : 0, util = Math.max(0, Number(c.forfaitUtilisees) || 0);
  return {
    etat: ETATS_COACHE[c.status] ? c.status : null,
    seances: Math.max(passes, enLive),
    etape,
    energie: k ? { energie: k.energie, charge: k.charge, quand: k.date, bas: k.energie <= 2 || k.charge >= 4 } : null,
    forfait: total ? { nom: c.forfaitNom || "", total, utilisees: Math.min(total, util), restantes: Math.max(0, total - util) } : null,
    urgence: c.rythme && c.rythme.etat === "sos" ? 0 : c.rythme && c.rythme.etat === "blocage" ? 1 : 2
  };
}

// Empreinte SHA-256 des éléments du contrat (détecte toute modification après signature).
async function contratEmpreinte(p, mention) {
  try {
    const t = JSON.stringify([p.nom, p.adresse, p.email, p.tel, p.objectif, p.debut, p.fin, String(p.nbSeances), String(p.montant), p.precision || "", p.faitLe || "", mention || ""]);
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(t));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
  } catch (e) { return null; }
}

// Zone de signature manuscrite (doigt, stylet ou souris).
function creerPadSignature(canvas) {
  const ctx = canvas.getContext && canvas.getContext("2d"); let dessin = false, trace = false;
  const r0 = canvas.getBoundingClientRect(), ratio = window.devicePixelRatio || 1;
  if (r0.width && ctx) { canvas.width = Math.round(r0.width * ratio); canvas.height = Math.round((r0.height || 140) * ratio); ctx.scale(ratio, ratio); }
  if (ctx) { ctx.lineWidth = 2.2; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.strokeStyle = "#1a1a1a"; }
  canvas.style.touchAction = "none";
  const pos = e => { const r = canvas.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
  canvas.addEventListener("pointerdown", e => { if (!ctx) return; dessin = true; const q = pos(e); ctx.beginPath(); ctx.moveTo(q.x, q.y); try { canvas.setPointerCapture(e.pointerId); } catch (x) {} e.preventDefault(); });
  canvas.addEventListener("pointermove", e => { if (!dessin || !ctx) return; const q = pos(e); ctx.lineTo(q.x, q.y); ctx.stroke(); trace = true; e.preventDefault(); });
  const fin = () => { dessin = false; };
  canvas.addEventListener("pointerup", fin); canvas.addEventListener("pointercancel", fin); canvas.addEventListener("pointerleave", fin);
  return { vide: () => !trace, dataUrl: () => trace ? canvas.toDataURL("image/png") : null, effacer: () => { trace = false; if (ctx) { ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, canvas.width, canvas.height); ctx.restore(); } } };
}

// Notes « a,b,c,d » : entiers de 0 (réponse laissée vide) à noteMax ; null si une valeur est incorrecte.
function pointsDe(v, n, noteMax, noteMin) {
  if (typeof v !== "string" || !v.trim()) return null;
  const mx = noteMax === undefined ? 10 : noteMax, mn = noteMin || 0;
  const p = v.split(",").map(x => x.trim() === "" ? 0 : parseInt(x, 10));
  return p.length === n && p.every(x => Number.isInteger(x) && x >= mn && x <= mx) ? p : null;
}

function calculerResultatsCoach(type, rep) {
  rep = rep || {};
  if (type === "drivers") {
    const g = GRILLES_COACH.drivers;
    const lignes = g.groupes.map(gr => { let somme = 0, n = 0; gr.qs.forEach(q => { const s = g.scores[rep["q" + q]]; if (s !== undefined) { somme += s; n++; } }); return { id: gr.id, nom: gr.nom, somme, repondues: n, total: gr.qs.length, max: gr.qs.length * 5 }; });
    return { type, lignes, repondues: lignes.reduce((a, l) => a + l.repondues, 0), total: 35 };
  }
  if (type === "positions") {
    // Chaque réponse est notée de 1 à 8 (vide = 0) ; le total d'une situation ne dépasse pas 10. Seules les situations valides comptent.
    const R = GRILLES_COACH.positions.regles, comptes = { "++": 0, "+-": 0, "-+": 0, "--": 0 }, detail = [];
    GRILLES_COACH.positions.mapping.forEach((m, i) => {
      const brut = rep["t" + (i + 1)], pts = pointsDe(brut, 4, R.noteMax, R.toutesNotees ? 1 : 0), somme = pts ? pts.reduce((a, b) => a + b, 0) : 0;
      const valide = !!pts && somme >= 1 && somme <= R.totalMax, repartition = {};
      Object.keys(m).forEach(p => { repartition[p] = pts ? pts["abcd".indexOf(m[p])] : 0; });
      if (valide) Object.keys(repartition).forEach(p => { comptes[p] += repartition[p]; });
      const etat = valide ? "ok" : (typeof brut === "string" && brut.trim() ? "invalide" : "vide");
      detail.push({ theme: i + 1, points: pts, somme, valide, etat, repartition: valide ? repartition : null });
    });
    const valides = detail.filter(d => d.valide), donnes = valides.reduce((a, d) => a + d.somme, 0);
    return { type, comptes, detail, repondues: valides.length, total: 8, max: donnes, donnes };
  }
  return null;
}

// Ce que le coaché reçoit quand tu partages : uniquement les chiffres calculés, jamais le barème ni la lecture croisée.
function payloadPartage(cat, r, message) {
  const texteRepartition = rp => Object.keys(rp).filter(p => rp[p] > 0).sort((a, b) => rp[b] - rp[a]).map(p => POSITIONS_VIE[p] + " : " + rp[p]).join(" · ");
  const barres = r.type === "drivers"
    ? r.lignes.slice().sort((a, b) => b.somme - a.somme).map(l => ({ nom: l.nom, valeur: l.somme, max: l.max }))
    : ["++", "+-", "-+", "--"].map(p => ({ nom: POSITIONS_VIE[p], valeur: r.comptes[p], max: r.max }));
  const detail = r.type === "positions" ? r.detail.filter(d => d.valide).map(d => ({ theme: (cat.champs[d.theme - 1] || {}).label || "", position: texteRepartition(d.repartition) })) : [];
  return { type: r.type, titre: cat.titre, partageLe: new Date().toISOString(), message: message || "", barres, detail, repondues: r.repondues, sur: r.total, signature: JSON.stringify([barres, detail]) };
}

function panneauPartage(cat, r, c, ex) {

    zone.innerHTML = ""; const p = (c.resultatsPartages || {})[ex.id];
    if (p) {
      const d = new Date(p.partageLe);
      zone.appendChild(h("div",{style:"font-size:13px;font-weight:700;color:#2F7D3B"}, "✅ Partagé avec " + prenom + (isNaN(d) ? "" : " le " + d.toLocaleDateString("fr-FR", { day: "numeric", month: "long", year: "numeric" }))));

      const actuel = payloadPartage(cat, r, p.message);

        zone.appendChild(h("div",{style:"font-size:12.5px;color:#B26A00;margin-top:6px"}, "⚠️ Les réponses ont changé depuis le partage : " + prenom + " voit encore l'ancienne version."));
        zone.appendChild(bouton("🔄 Mettre à jour le partage", "btn-sm", () => { enregistrer(actuel); dessiner(); }));
      }
      const retirer = bouton("↩️ Retirer le partage", "btn-g", () => { if (!confirm("Retirer ces résultats de l'espace de " + prenom + " ?")) return; enregistrer(null); dessiner(); });
      retirer.style.marginLeft = "6px"; zone.appendChild(retirer); return;
    }
    zone.appendChild(h("div",{style:"font-size:12.5px;color:#5A5648"}, "Quand vous les aurez relus ensemble, tu peux les partager : " + prenom + " les verra dans son espace, avec une explication bienveillante. La lecture croisée ci-dessus reste pour toi seul·e."));
    const mot = h("textarea",{rows:"2",maxlength:"1000",placeholder:"Un mot pour l'accompagner (facultatif)",style:"width:100%;box-sizing:border-box;border:1px solid #E4DAC0;border-radius:8px;padding:8px;font-family:inherit;font-size:16px;margin:6px 0;background:#fff"});
    zone.appendChild(mot);
    zone.appendChild(bouton("📤 Partager les résultats avec " + prenom, "btn", () => {
      if (!r.repondues) { alert("Il n'y a pas encore de réponse à partager."); return; }
      if (r.repondues < r.total && !confirm("Le questionnaire n'est pas terminé (" + r.repondues + "/" + r.total + " réponses). Partager quand même ?")) return;
      if (!confirm("Partager ces résultats avec " + prenom + " ?\n\nIls apparaîtront dans son espace, avec une explication bienveillante.")) return;
      enregistrer(payloadPartage(cat, r, mot.value.trim().slice(0, 1000))); dessiner();
    }));
  }
  dessiner(); return zone;
}

function derniereReponse(c, catalogueId) {
  const l = (c.exercices || []).filter(e => e.catalogueId === catalogueId); if (!l.length) return null;
  const e = l[l.length - 1]; return { ex: e, rep: (c.reponsesExercices || {})[e.id] || {} };
}
function positionsDominantes(rp) {
  if (!rp || !rp.max) return []; const m = Math.max.apply(null, Object.values(rp.comptes));
  return m > 0 ? Object.keys(rp.comptes).filter(p => rp.comptes[p] === m) : [];
}

// ═════════ VISIOCONFÉRENCE (Google Meet) : un lien permanent par coaché, ou le lien de ton cabinet ═════════
const MEET_RE = /^https:\/\/meet\.google\.com\/(?:[a-z]{3}-[a-z]{4}-[a-z]{3}|lookup\/[A-Za-z0-9_\-]{3,60})$/;
// Accepte « meet.google.com/abc-defg-hij » ou l'adresse complète ; refuse tout le reste (dont « meet.google.com/new », qui n'est pas un lien de réunion).
function normaliserMeet(t) {
  const brut = String(t || "").replace(/[\u0000-\u001f\s]/g, ""); if (!brut) return null;
  const m = brut.match(/^(?:https?:\/\/)?meet\.google\.com\/([^?#]*)/i); if (!m) return null;
  const chemin = m[1].replace(/\/+$/, ""), url = "https://meet.google.com/" + (/^lookup\//i.test(chemin) ? "lookup/" + chemin.slice(7) : chemin.toLowerCase());
  return MEET_RE.test(url) ? url : null;
}
function meetCabinet() { try { return normaliserMeet(localStorage.getItem("cs4-meet-cabinet")); } catch (e) { return null; } }
const prenomVisio = c => String((c && c.name) || "").trim().split(/\s+/)[0] || "";
function lienMeetDe(c) { const v = c && c.visio; return (v && normaliserMeet(v.meetUrl)) || meetCabinet() || null; }

// Démarre la séance : Google Meet s'ouvre tout de suite (avant toute attente réseau, pour ne pas être bloqué), puis le coaché est prévenu dans son espace.
async function demarrerVisio(c, apres) {
  const url = lienMeetDe(c);
  if (!url) { const info = { ouverte: false, prevenu: false, manque: true, url: null }; if (apres) apres(info); return info; }
  const fen = window.open(url, "_blank"); if (fen) { try { fen.opener = null; } catch (e) {} }
  const t = new Date().toISOString(); c.visio = Object.assign({}, c.visio, { meetUrl: url, actif: true, depuis: t });
  let prevenu = true;
  try { await firebase.firestore().collection("clients").doc(c.id).update({ "visio.meetUrl": url, "visio.actif": true, "visio.depuis": t }); } catch (e) { console.error("visio:", e); prevenu = false; }
  const info = { ouverte: !!fen, prevenu, manque: false, url }; if (apres) apres(info); return info;
}
async function terminerVisio(c, apres) {
  const t = new Date().toISOString(); c.visio = Object.assign({}, c.visio, { actif: false, termineLe: t });
  try { await firebase.firestore().collection("clients").doc(c.id).update({ "visio.actif": false, "visio.termineLe": t }); } catch (e) { console.error("visio:", e); }
  if (apres) apres();
}
async function enregistrerMeet(c, texte) {
  const url = normaliserMeet(texte); if (!url) return { ok: false };
  const creeLe = (c.visio && c.visio.creeLe) || new Date().toISOString();
  try { await firebase.firestore().collection("clients").doc(c.id).update({ "visio.meetUrl": url, "visio.creeLe": creeLe }); } catch (e) { console.error("visio:", e); return { ok: true, sauve: false, url }; }
  c.visio = Object.assign({}, c.visio, { meetUrl: url, creeLe }); return { ok: true, sauve: true, url };
}
async function retirerMeet(c) {
  try { await firebase.firestore().collection("clients").doc(c.id).update({ "visio.meetUrl": null, "visio.actif": false }); } catch (e) { console.error("visio:", e); return false; }
  c.visio = Object.assign({}, c.visio, { meetUrl: null, actif: false }); return true;
}

function lienPortailDe(c) { try { return c && c.portalToken ? new URL("portail.html", location.href).href + "?t=" + c.portalToken : null; } catch (e) { return null; } }
async function creerLienPermanent(c) {
  if (c.portalToken) return c.portalToken;
  const car = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789", a = new Uint8Array(24); (window.crypto || window.msCrypto).getRandomValues(a);
  const token = Array.from(a).map(x => car[x % car.length]).join("");
  await firebase.firestore().collection("portalLinks").doc(token).set({ clientId: c.id, createdAt: new Date().toISOString() });
  c.portalToken = token; try { save(); } catch (e) {} ClientsManager.saveClient(c.id, { portalToken: token });
  return token;
}

function caduMoisCourant() {
  const maintenant = new Date();
  const cleMoisCourant = maintenant.getFullYear() + "-" + String(maintenant.getMonth()+1).padStart(2,"0");
  let reel = 0;
  state.clients.forEach(c => {
    (c.paiements || []).forEach(p => {
      if (p.date && p.date.slice(0,7) === cleMoisCourant && p.statut === "payé") {
        reel += Number(p.montant || 0);
      }
    });
  });
  return reel;
}

let formData = {};
function buildAddForm() {
  formData = {name:"",profile:"HPI",age:"",objective:"",nextSession:"",notes:"",status:"actif",email:"",tel:""};
  const form = h("div",{class:"qform",style:"margin-bottom:20px"});
  form.appendChild(h("h3",{style:"color:#9C7A2E;font-size:21px;margin-bottom:18px;font-style:italic"},"Nouveau client"));

  const g = h("div",{class:"grid2",style:"margin-bottom:12px"});

  const nameInp = inputEl({placeholder:"Ex: Marie D.", onInput:v=>formData.name=v});
  const ageInp  = inputEl({type:"number", placeholder:"Ex: 32", onInput:v=>formData.age=v});
  const profSel = selectEl({options:PROFILES, value:"HPI", onChange:v=>formData.profile=v});
  const datInp  = inputEl({type:"date", onChange:v=>formData.nextSession=v});

  g.appendChild(field("PRÉNOM & NOM *", nameInp));
  g.appendChild(field("ÂGE", ageInp));
  g.appendChild(field("PROFIL", profSel));
  g.appendChild(field("PROCHAINE SÉANCE", datInp));
  form.appendChild(g);

  const g2 = h("div",{class:"grid2",style:"margin-bottom:12px"});
  const emailInp = inputEl({type:"email", placeholder:"Ex: marie.d@email.com", onInput:v=>formData.email=v});
  const telInp = inputEl({type:"tel", placeholder:"Ex: 06 12 34 56 78", onInput:v=>formData.tel=v});
  g2.appendChild(field("EMAIL", emailInp));
  g2.appendChild(field("TÉLÉPHONE", telInp));
  form.appendChild(g2);

  const objInp = inputEl({placeholder:"Ex: Confiance en soi, gestion du stress...", onInput:v=>formData.objective=v});
  form.appendChild(h("div",{style:"margin-bottom:12px"},field("OBJECTIF", objInp)));

  const notInp = textareaEl({placeholder:"Notes...", height:"64px", onInput:v=>formData.notes=v});
  form.appendChild(h("div",{style:"margin-bottom:18px"},field("NOTES", notInp)));

  const row = h("div",{style:"display:flex;gap:10px"});
  const saveBtn = h("button",{class:"btn"},"Ajouter");
  saveBtn.addEventListener("click",()=>{
    if (!formData.name.trim()) return;
    const newClient = {...formData,id:Date.now()+"",sessions:0,sessionHistory:[],objectifs:[],entretiens:[]};
    state.clients.push(newClient);
    save();
    ClientsManager.saveClient(newClient.id, newClient); // 🔄 Sync Firestore
    notifCoach("✅ Client créé : "+newClient.name);
    setState({tab:"clients"});
  });
  const cancelBtn = h("button",{class:"btn-g"},"Annuler");
  cancelBtn.addEventListener("click",()=>setState({tab:"clients"}));
  row.appendChild(saveBtn); row.appendChild(cancelBtn);
  form.appendChild(row);
  return form;
}

function renderClientDetail() {
  const c = state.clients.find(x=>x.id===state.selClientId);
  if (!c) { setState({selClientId:null}); return renderClientList(); }

  const wrap = h("div",{class:"fade"});
  const backBtn = h("button",{class:"btn-g",style:"margin-bottom:18px"},"← Retour");
  backBtn.addEventListener("click",()=>setState({selClientId:null}));
  wrap.appendChild(backBtn);

  const box = h("div",{class:"card",style:"padding:26px"});

  // Header
  const hdr = h("div",{style:"display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px;flex-wrap:wrap;gap:16px"},
    h("div",{style:"display:flex;gap:16px;align-items:center;min-width:0"},
      avatar(c.name,c.profile,58),
      h("div",{style:"min-width:0"},
        h("h2",{style:"font-size:28px;color:#2E2A20;font-weight:600;font-style:italic;word-break:break-word"},c.name),
        h("div",{style:"display:flex;gap:8px;margin-top:6px;flex-wrap:wrap;align-items:center"},
          badgeProfil(c.profile),
          c.age?h("span",{style:"color:#5A5648;font-size:13px"},c.age+" ans"):null,
          badgeStatus(c.status)
        )
      )
    ),
    h("div",{style:"text-align:right;flex-shrink:0;margin-left:auto"},
      h("div",{style:"font-size:38px;color:#9C7A2E;font-weight:700;line-height:1"},String(c.sessions||0)),
      h("div",{style:"color:#5A5648;font-size:12px"},"séances")
    )
  );
  box.appendChild(hdr);

  const seanceWrap = h("div",{style:"margin-bottom:20px"});
  seanceWrap.appendChild(h("div",{style:"font-weight:700;font-size:11.5px;color:#9C7A2E;margin-bottom:8px;text-transform:uppercase;letter-spacing:.04em"},"Séance"));
  const bVisio = h("div",{class:"tool-btn",style:"color:#2F7D3B;background:#2F7D3B0c;border-color:#2F7D3B55"}, (c.visio && c.visio.actif) ? "🔴 Visio en cours" : "📹 Démarrer la visio");
  bVisio.addEventListener("click", () => demarrerVisio(c, info => { if (info && info.manque) alert("Ajoute d'abord le lien Google Meet de ce coaché : panneau « Visioconférence » en haut de sa fiche."); render(); }));
  seanceWrap.appendChild(bVisio); box.appendChild(seanceWrap);

  // Subtabs
  const stabs = h("div",{class:"subtabs"});
  [["fiche","◈ Fiche"],["temps","🕒 Fil du temps"],["protocole","🧭 Protocole"],["parcours","🧗 Parcours"],["paiements","€ Paiements"],["notes-c","◻ Notes"]].forEach(([id,lbl])=>{
    const b = h("button",{class:"subtab"+(state.subTab===id?" active":"")},lbl);
    b.addEventListener("click",()=>{ state.subTab=id; render(); });
    stabs.appendChild(b);
  });
  box.appendChild(stabs);

  // Content
  const content = h("div",{class:"fade"});
  if (state.subTab==="fiche")     content.appendChild(buildFiche(c));
  if (state.subTab==="temps")     content.appendChild(buildTimelineClient(c));
  if (state.subTab==="protocole") content.appendChild(buildProtocole(c));
  if (state.subTab==="parcours")  content.appendChild(buildParcours(c));
  if (state.subTab==="paiements") content.appendChild(buildPaiements(c));
  if (state.subTab==="notes-c")   content.appendChild(buildNotesClient(c));
  box.appendChild(content);
  wrap.appendChild(box);
  return wrap;
}

  {key:"dispersion", label:"Dispersion attentionnelle", desc:"Difficulté à démarrer/terminer, hyperfocus déséquilibré", profils:["TDAH"]},

  {key:"intensiteEmo", label:"Intensité émotionnelle", desc:"Réactions amplifiées, submersion émotionnelle", profils:["HSP","HPE"]},
  {key:"surchargeSensorielle", label:"Surcharge sensorielle/émotionnelle", desc:"Sensibilité aux stimuli, saturation rapide", profils:["HSP","HPE"]},
  {key:"empathieEnvahissante", label:"Empathie envahissante", desc:"Difficulté à poser des limites, absorption des émotions d'autrui", profils:["HSP","HPE"]},
];

function dimensionsPourProfil(profilClient) {
  const p = (profilClient || "").toUpperCase();
  return DIMENSIONS_EVAL.filter(d =>
    d.profils.includes("all") ||
    d.profils.some(tag => p.includes(tag))
  );
}

function buildAideSection(aide) {
  const box = h("div",{style:"background:#FBF5E4;border:1px solid #E4DAC0;border-radius:12px;padding:14px 16px;margin-bottom:10px;line-height:1.55"});
  if (aide.intro) box.appendChild(h("div",{style:"font-size:13px;color:#2E2A20;margin-bottom:6px"}, aide.intro));
  (aide.blocs || []).forEach(b => {
    box.appendChild(h("div",{style:"font-weight:700;font-size:13.5px;color:#2E2A20;margin:14px 0 4px"}, b.titre));
    (b.paragraphes || []).forEach(t => box.appendChild(h("div",{style:"font-size:13px;color:#2E2A20;margin-bottom:6px"}, t)));
    if (b.dire) box.appendChild(h("div",{style:"font-size:13px;color:#7A5F1E;font-style:italic;margin-bottom:6px"}, "À dire : " + b.dire));
    if (b.repere) box.appendChild(h("div",{style:"font-size:12.5px;color:#5A5648;margin-bottom:2px"}, "✔ Acquis quand : " + b.repere));
  });
  if (aide.fin) box.appendChild(h("div",{style:"font-size:13px;color:#2E2A20;margin-top:14px;padding-top:10px;border-top:1px solid #E4DAC0"}, aide.fin));
  return box;
}

function rdvFrDateLong(date, heure) {
  const d = new Date(date + "T00:00:00");
  const base = isNaN(d) ? date : d.toLocaleDateString("fr-FR", { weekday:"long", day:"numeric", month:"long", year:"numeric" });
  return base + (heure ? " à " + heure : "");
}

function rdvDates(r) {
  const p = x => String(x).padStart(2, "0");
  const ymd = d => d.getFullYear() + p(d.getMonth()+1) + p(d.getDate());
  if (!r.heure) {
    const nd = new Date(r.date + "T00:00:00"); nd.setDate(nd.getDate() + 1);
    return { allDay:true, start:r.date.replace(/-/g, ""), end:ymd(nd) };
  }
  const st = new Date(r.date + "T" + r.heure + ":00"), en = new Date(st.getTime() + 60*60000);
  const f = d => ymd(d) + "T" + p(d.getHours()) + p(d.getMinutes()) + "00";
  return { allDay:false, start:f(st), end:f(en) };
}
function googleCalUrl(r, titre) {
  const dt = rdvDates(r);
  return "https://calendar.google.com/calendar/render?" + new URLSearchParams({ action:"TEMPLATE", text:titre || "Séance de coaching", dates:dt.start + "/" + dt.end, details:r.motif || "" }).toString();
}
function icsEscape(t) { return String(t || "").replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\r?\n/g, "\\n"); }
function rdvToIcs(items) {
  const stamp = new Date().toISOString().replace(/[-:]/g, "").replace(/\.\d+Z$/, "Z");
  const L = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//CoachingStudio//FR","CALSCALE:GREGORIAN","METHOD:PUBLISH"];
  items.forEach(r => {
    const dt = rdvDates(r);
    L.push("BEGIN:VEVENT", "UID:" + r.id + "@coachingstudio", "DTSTAMP:" + stamp);
    if (dt.allDay) L.push("DTSTART;VALUE=DATE:" + dt.start, "DTEND;VALUE=DATE:" + dt.end);
    else L.push("DTSTART:" + dt.start, "DTEND:" + dt.end);
    L.push("SUMMARY:" + icsEscape(r.titre || "Séance de coaching"));
    if (r.motif) L.push("DESCRIPTION:" + icsEscape(r.motif));
    L.push("END:VEVENT");
  });
  L.push("END:VCALENDAR");
  return L.join("\r\n") + "\r\n";
}
function telechargerIcs(nom, contenu) {
  const url = URL.createObjectURL(new Blob([contenu], { type:"text/calendar;charset=utf-8" }));
  const a = document.createElement("a"); a.href = url; a.download = nom;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function buildNextSessionAgendaLinks(c) {
  const r = { id:"next-" + c.id, date:c.nextSession, heure:c.nextSessionHeure || "", motif:"" };
  const row = h("div",{style:"margin-top:8px;display:flex;gap:10px;flex-wrap:wrap;align-items:center"});
  row.appendChild(h("a",{href:googleCalUrl(r, "Séance — " + c.name), target:"_blank", rel:"noopener", style:"color:#9C7A2E;font-size:12.5px;text-decoration:none;font-weight:600"},"📅 Ajouter à Google Agenda"));
  const ics = h("button",{class:"btn-sm"},"📥 .ics");
  ics.addEventListener("click", () => telechargerIcs("seance-" + (c.name || "client").replace(/\s+/g, "-") + ".ics", rdvToIcs([{ ...r, titre:"Séance — " + c.name }])));
  row.appendChild(ics);
  return row;
}

      const lab = h("label",{style:"display:flex;align-items:center;gap:8px;font-size:13.5px;margin:4px 0;cursor:pointer"});

      cb.checked = k === "accueil" ? !(c.portailOutils && c.portailOutils.accueil === false) : !!(c.portailOutils && c.portailOutils[k]);

  }

  if (c.portalToken) { render(c.portalToken); return; }

  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let token = "";
  for (let i = 0; i < 24; i++) token += chars[Math.floor(Math.random() * chars.length)];

  firebase.firestore().collection("portalLinks").doc(token).set({
    clientId: c.id, createdAt: new Date().toISOString()
  }).then(() => {
    c.portalToken = token;
    save();
    ClientsManager.saveClient(c.id, { portalToken: token });
    render(token);
  }).catch(e => { alert("Erreur lors de la génération du lien : " + e.message); });
}

function buildPaiements(c) {

  function render2() {
    wrap.innerHTML="";
    if (!c.paiements) c.paiements=[];
    const totalPaye = c.paiements.filter(p=>p.statut==="payé").reduce((s,p)=>s+Number(p.montant||0),0);
    const totalAttente = c.paiements.filter(p=>p.statut==="en attente").reduce((s,p)=>s+Number(p.montant||0),0);

    const summary = h("div",{style:"display:flex;gap:20px;margin-bottom:14px"},
      h("div",{},h("div",{style:"color:#6B6355;font-size:13px"},"ENCAISSÉ"),h("div",{style:"color:#4a9e6a;font-size:20px;font-weight:700"},totalPaye.toFixed(0)+" €")),

    const hdr = h("div",{style:"display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"}, summary, addBtn);
    wrap.appendChild(hdr);

    if (showForm) {
      const box = h("div",{class:"card",style:"padding:16px;margin-bottom:14px;border-color:#9C7A2E33"});
      const g = h("div",{class:"grid2",style:"margin-bottom:10px"});
      const da = inputEl({type:"date",onChange:v=>newPay.date=v});
      g.appendChild(field("DATE",da));
      const mo = inputEl({type:"number",placeholder:"Ex: 80",onInput:v=>newPay.montant=v});

        save(); showForm=false; render2();
      });
      box.appendChild(sv);
      wrap.appendChild(box);
    }

    if (!c.paiements.length) {
      wrap.appendChild(h("p",{style:"color:#6B6355;font-size:13px;padding:16px 0"},"Aucun paiement enregistré."));
    } else {
      [...c.paiements].sort((a,b)=>(b.date||"").localeCompare(a.date||"")).forEach(pay => {
        const col = pay.statut==="payé" ? "#4a9e6a" : "#9C7A2E";
        const del = h("button",{style:"background:transparent;border:none;cursor:pointer;color:#6B6355;font-size:18px;padding:0 4px"},"×");
        del.addEventListener("click",()=>{
          c.paiements = c.paiements.filter(x=>x.id!==pay.id);
          state.clients = state.clients.map(x=>x.id===c.id?c:x);
          save(); render2();
        });
        const badge = h("span",{style:`padding:2px 8px;border-radius:20px;background:${col}18;color:${col};font-size:12px;font-weight:600`},pay.statut);
        const row = h("div",{class:"obj-row"},
          h("div",{style:"flex:1"},
            h("div",{style:"color:#2E2A20;font-size:14px"},Number(pay.montant||0).toFixed(0)+" €"),

          ),

  return wrap;

function buildEchangesThread(c, author) {
  const wrap = h("div",{style:"margin-top:10px"});
  const list = h("div",{style:"max-height:320px;overflow-y:auto;border:1px solid #E4DAC0;border-radius:10px;padding:10px;background:#FFFDF7;margin-bottom:10px"});
  const entries = (c.echanges || []).slice().sort((a,b)=> new Date(a.createdAt) - new Date(b.createdAt));
  if (!entries.length) {
    list.appendChild(h("p",{style:"color:#6B6355;font-size:13px;text-align:center;padding:14px 0"},"Aucun échange pour l'instant."));
  } else {
    entries.forEach(e => {
      const isCoach = e.author === "coach";
      const row = h("div",{style:`margin-bottom:10px;text-align:${isCoach?"right":"left"}`});
      const bubble = h("div",{style:`display:inline-block;max-width:80%;text-align:left;padding:8px 12px;border-radius:12px;font-size:13.5px;line-height:1.4;background:${isCoach?"#9C7A2E1c":"#E4DAC055"};color:#2E2A20`});
      bubble.appendChild(h("div",{style:"font-size:10.5px;font-weight:700;color:#9C7A2E;margin-bottom:3px"}, isCoach ? "Toi" : (c.name||"Client")));
      bubble.appendChild(h("div",{}, e.text));
      row.appendChild(bubble);
      list.appendChild(row);
    });
  }
  wrap.appendChild(list);

  const inputRow = h("div",{style:"display:flex;gap:8px"});
  const ta = textareaEl({value:"",placeholder:"Écrire un message…",height:"50px"});
  ta.style.flex = "1";
  const sendBtn = h("button",{class:"btn"},"Envoyer");
  sendBtn.addEventListener("click", () => {
    const text = ta.value.trim();
    if (!text) return;
    if (!c.echanges) c.echanges = [];
    c.echanges.push(echangeEntry(author, text));
    ClientsManager.saveClient(c.id, { echanges: c.echanges });
    render();
  });
  inputRow.appendChild(ta); inputRow.appendChild(sendBtn);
  wrap.appendChild(inputRow);
  return wrap;
}

function renderBibliotheque() {
  const wrap = h("div",{class:"fade"});
  wrap.appendChild(h("div",{style:"margin-bottom:24px"},
    h("h1",{style:"font-size:30px;color:#2E2A20;font-weight:600;font-style:italic"},"Bibliothèque du Coach"),
    h("p",{style:"color:#5A5648;font-size:14px;margin-top:6px"},`${BIBLIO.length} fiches · Questions · NLP · Sophro · Burnout · Outils`)
  ));

  const CATS = [...new Set(BIBLIO.map(r=>r.cat))];

  // Filters box
  const fbox = h("div",{class:"card",style:"padding:18px;margin-bottom:16px"});
  const searchInp = inputEl({value:state.bibSearch, placeholder:"🔍 Rechercher dans la bibliothèque…", onInput:v=>{ state.bibSearch=v; rebuildList(); }});
  fbox.appendChild(h("div",{style:"margin-bottom:14px"},searchInp));

  // Cat filter
  const catRow = h("div",{style:"display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center"});
  catRow.appendChild(h("span",{style:"color:#6B6355;font-size:13px;margin-right:4px"},"CAT."));
  ["Tous",...CATS].forEach(c => {
    const b = h("button",{class:"btn-sm"}, c);
    if (state.bibCat===c) { b.style.background="#9C7A2E22"; b.style.color="#9C7A2E"; b.style.borderColor="#9C7A2E55"; }
    b.addEventListener("click",()=>{ state.bibCat=c; rebuildList(); });
    catRow.appendChild(b);
  });
  fbox.appendChild(catRow);

  // Profil filter
  const profRow = h("div",{style:"display:flex;gap:8px;flex-wrap:wrap;align-items:center"});
  profRow.appendChild(h("span",{style:"color:#6B6355;font-size:13px;margin-right:4px"},"PROFIL"));
  ["Tous",...PROFILES].forEach(p => {
    const col = PC[p]||"#9C7A2E";
    const b = h("button",{class:"btn-sm"}, p);
    if (state.bibProfil===p) { b.style.background=col+"22"; b.style.color=col; b.style.borderColor=col+"55"; }
    b.addEventListener("click",()=>{ state.bibProfil=p; rebuildList(); });
    profRow.appendChild(b);
  });
  fbox.appendChild(profRow);

  // Phase filter
  const phaseRow = h("div",{style:"display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px"});
  phaseRow.appendChild(h("span",{style:"color:#6B6355;font-size:13px;margin-right:4px"},"PHASE"));
  ["Tous",...Object.keys(PHASES_LABELS)].forEach(p => {
    const b = h("button",{class:"btn-sm"}, p==="Tous"?"Tous":PHASES_LABELS[p]);
    if ((state.bibPhase||"Tous")===p) { b.style.background="#9C7A2E22"; b.style.color="#9C7A2E"; b.style.borderColor="#9C7A2E55"; }
    b.addEventListener("click",()=>{ state.bibPhase=p; rebuildList(); });
    phaseRow.appendChild(b);
  });
  fbox.appendChild(phaseRow);
  wrap.appendChild(fbox);

  const count = h("div",{style:"color:#6B6355;font-size:12px;margin-bottom:12px"},"");
  wrap.appendChild(count);

  const list = h("div",{style:"display:grid;gap:10px"});
  wrap.appendChild(list);

  function rebuildList() {
    const filtered = BIBLIO.filter(r => {
      const mC = state.bibCat==="Tous" || r.cat===state.bibCat;
      const mP = state.bibProfil==="Tous" || r.profil===state.bibProfil || r.profil==="Tous";
      const mPh = !state.bibPhase || state.bibPhase==="Tous" || r.phase===state.bibPhase;
      const mS = !state.bibSearch || r.titre.toLowerCase().includes(state.bibSearch.toLowerCase()) || r.contenu.toLowerCase().includes(state.bibSearch.toLowerCase());
      return mC && mP && mPh && mS;
    });
    count.textContent = `${filtered.length} résultat${filtered.length>1?"s":""}`;
    list.innerHTML="";

    if (!filtered.length) {
      list.appendChild(h("div",{class:"card",style:"padding:40px;text-align:center;color:#6B6355;font-size:14px"},"Aucune fiche pour ces filtres."));
      return;
    }

    filtered.forEach(r => {
      let open = false;
      const card2 = h("div",{class:"card",style:"padding:16px 20px"});

      const body = h("div",{class:"fiche-body"}, r.contenu);

      const hdr2 = h("div",{style:"display:flex;align-items:center;gap:12px;cursor:pointer"});
      const info = h("div",{style:"flex:1"},
        h("div",{style:"color:#2E2A20;font-size:15px;font-weight:600;margin-bottom:6px"},r.titre),
        h("div",{style:"display:flex;gap:6px;flex-wrap:wrap;align-items:center"},
          badgeCat(r.cat), badgeProfil(r.profil),
          r.phase?h("span",{style:"padding:2px 8px;border-radius:20px;background:#9C7A2E14;color:#9C7A2E;font-size:11px;font-weight:600"}, PHASES_LABELS[r.phase]):null,
          r.source?h("span",{style:"color:#6B6355;font-size:12px;font-style:italic"},"— "+r.source):null
        )
      );

      const copyBtn = h("button",{class:"btn-sm",style:"font-size:13px"},"Copier");
      copyBtn.addEventListener("click",e=>{
        e.stopPropagation();
        try { navigator.clipboard.writeText(r.titre+"\n\n"+r.contenu); } catch(e){}
        copyBtn.textContent="✓ Copié"; copyBtn.style.color="#4a9e6a"; copyBtn.style.borderColor="#4a9e6a44";
        setTimeout(()=>{ copyBtn.textContent="Copier"; copyBtn.style.color=""; copyBtn.style.borderColor=""; },2000);
      });

      const arr = h("span",{class:"arr"},"▼");
      hdr2.appendChild(info); hdr2.appendChild(copyBtn); hdr2.appendChild(arr);
      hdr2.addEventListener("click",()=>{
        open=!open;
        body.style.display=open?"block":"none";
        arr.textContent=open?"▲":"▼";
      });

      card2.appendChild(hdr2); card2.appendChild(body);
      list.appendChild(card2);
    });
  }

  rebuildList();
  return wrap;
}

function outilEsc(s) {
  return String(s === undefined || s === null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function outilQ(s) {
  return String(s).replace(/\\/g, "\\\\").replace(/'/g, "\\'").replace(/"/g, "&quot;");
}

function outilFmt(v) {
  return (Math.round(v * 10) / 10).toString().replace(".", ",");
}

function outilRecalc(def, d) {
  d.scores = {};
  def.domaines.forEach(dom => {
    const q = d.q[dom.id] || {};
    const vals = Object.keys(q).map(k => q[k]).filter(v => typeof v === "number");
    if (vals.length) d.scores[dom.id] = vals.reduce((a, b) => a + b, 0) / vals.length;
  });
}

function outilData(sid, tool) {
  if (!state.outils) state.outils = {};
  if (!state.outils[sid]) state.outils[sid] = {};
  const cur = state.outils[sid][tool];
  const d = (cur && typeof cur === "object") ? cur : {};
  if (!d.q || typeof d.q !== "object") d.q = {};
  if (!d.note || typeof d.note !== "object") d.note = {};
  delete d.mode;
  state.outils[sid][tool] = d;
  outilRecalc(OUTILS_DEF[tool], d);
  return d;
}

function outilStats(def, d) {
  let answered = 0, total = 0, lowQ = null, highQ = null;
  def.domaines.forEach(dom => {
    total += dom.questions.length;
    const q = d.q[dom.id] || {};
    dom.questions.forEach((txt, i) => {
      const v = q[i];
      if (typeof v !== "number") return;
      answered++;
      if (!lowQ || v < lowQ.v) lowQ = { v, txt };
      if (!highQ || v > highQ.v) highQ = { v, txt };
    });
  });
  const rated = def.domaines.filter(x => d.scores[x.id] !== undefined);
  const avg = rated.length ? rated.reduce((a, x) => a + d.scores[x.id], 0) / rated.length : null;
  const lowDom = rated.length > 1 ? rated.reduce((m, x) => d.scores[x.id] < d.scores[m.id] ? x : m, rated[0]) : null;
  return { answered, total, avg, lowDom, lowQ, highQ };
}

function outilRadarSvg(def, scores) {
  const n = def.domaines.length, cx = 230, cy = 215, R = 120;
  const ang = i => -Math.PI / 2 + i * 2 * Math.PI / n;
  const pt = (i, v) => [cx + Math.cos(ang(i)) * R * v / 10, cy + Math.sin(ang(i)) * R * v / 10];
  const fmt = p => p[0].toFixed(1) + "," + p[1].toFixed(1);

  let rings = "";
  [2, 4, 6, 8, 10].forEach(k => {
    rings += `<polygon points="${def.domaines.map((_, i) => fmt(pt(i, k))).join(" ")}" fill="none" stroke="#D8CBA8" stroke-width="1"/>`;
  });
  let axes = "", labels = "", dots = "";
  def.domaines.forEach((dom, i) => {
    const e = pt(i, 10);
    axes += `<line x1="${cx}" y1="${cy}" x2="${e[0].toFixed(1)}" y2="${e[1].toFixed(1)}" stroke="#D8CBA8" stroke-width="1"/>`;
    const lx = cx + Math.cos(ang(i)) * (R + 26), ly = cy + Math.sin(ang(i)) * (R + 26);
    labels += `<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="middle" dominant-baseline="central" font-size="22">${dom.icone}</text>`;
    labels += `<text x="${lx.toFixed(1)}" y="${(ly + 20).toFixed(1)}" text-anchor="middle" font-size="11" fill="#6B6355">${outilEsc(dom.court)}</text>`;
    const s = scores[dom.id];
    if (s !== undefined) {
      const p = pt(i, s);
      dots += `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="5" fill="#8B6B4A"/>`;
    }
  });
  const poly = def.domaines.map((dom, i) => fmt(pt(i, scores[dom.id] === undefined ? 0 : scores[dom.id]))).join(" ");
  return `<svg viewBox="0 0 460 430" width="100%" style="max-width:420px;display:block;margin:0 auto" role="img" aria-label="Radar ${outilEsc(def.titre)}">
    ${rings}${axes}
    <polygon points="${poly}" fill="rgba(156,122,46,0.18)" stroke="#8B6B4A" stroke-width="2.5" stroke-linejoin="round"/>
    ${dots}${labels}
  </svg>`;
}

function outilSummaryHtml(def, d) {
  const st = outilStats(def, d);
  if (!st.answered) return `<span>Aucune question notée pour l'instant.</span>`;
  let h = `<div><b>Moyenne :</b> ${outilFmt(st.avg)}/10 · ${st.answered}/${st.total} questions notées</div>`;
  if (st.lowDom) h += `<div><b>À regarder en premier :</b> ${st.lowDom.icone} ${outilEsc(st.lowDom.court)} (${outilFmt(d.scores[st.lowDom.id])}/10)</div>`;
  if (st.answered > 1 && st.lowQ.v < st.highQ.v) {
    h += `<div><b>Point le plus bas :</b> « ${outilEsc(st.lowQ.txt)} » (${st.lowQ.v}/10)</div>`;
    h += `<div><b>Ressource la plus forte :</b> « ${outilEsc(st.highQ.txt)} » (${st.highQ.v}/10)</div>`;
  }
  return h;
}

function outilHeadScoreHtml(dom, d) {
  const q = d.q[dom.id] || {};
  const n = Object.keys(q).filter(k => typeof q[k] === "number").length;
  const s = d.scores[dom.id];
  return `<b>${s === undefined ? "—" : outilFmt(s)}</b><small>${n}/${dom.questions.length}</small>`;
}

function outilQuestionHtml(tool, sid, dom, i, d) {
  const v = (d.q[dom.id] || {})[i];
  const has = typeof v === "number";
  const S = outilQ(sid);
  return `<div class="rv-q-top">
      <div class="rv-q-text">${outilEsc(dom.questions[i])}</div>
      <div class="rv-q-score" id="rv-qs-${tool}-${dom.id}-${i}">${has ? v : "—"}</div>
      <button type="button" class="rv-clear" title="Effacer cette réponse" aria-label="Effacer cette réponse" onclick="outilClear('${tool}','${S}','${dom.id}',${i})">↺</button>
    </div>
    <input type="range" class="rv-slider${has ? "" : " untouched"}" min="1" max="10" step="1" value="${has ? v : 5}" aria-label="${outilEsc(dom.questions[i])}"
      oninput="outilSlide('${tool}','${S}','${dom.id}',${i},this)" onpointerup="outilSlideCommit('${tool}','${S}','${dom.id}',${i},this)">
    <div class="rv-scale"><span>1 · pas du tout</span><span>10 · tout à fait</span></div>`;
}

function outilDomainHtml(tool, sid, dom, d, open) {
  const S = outilQ(sid);
  const qs = dom.questions.map((_, i) => {
    const has = typeof (d.q[dom.id] || {})[i] === "number";
    return `<div class="rv-q${has ? " has" : ""}" id="rv-q-${tool}-${dom.id}-${i}">${outilQuestionHtml(tool, sid, dom, i, d)}</div>`;
  }).join("");
  return `<details class="rv-dom" id="rv-dom-${tool}-${dom.id}"${open ? " open" : ""}>
    <summary class="rv-dhead">
      <span class="rv-title">${dom.icone} ${outilEsc(dom.titre)}</span>
      <span class="rv-dscore" id="rv-ds-${tool}-${dom.id}">${outilHeadScoreHtml(dom, d)}</span>
      <span class="rv-chev">›</span>
    </summary>
    ${qs}
    <input type="text" class="rv-note" placeholder="Mes mots sur ce thème (facultatif)" value="${outilEsc(d.note[dom.id] || "")}" oninput="outilNote('${tool}','${S}','${dom.id}',this.value)">
  </details>`;
}

function outilPanelHtml(tool, sid) {
  const def = OUTILS_DEF[tool], d = outilData(sid, tool);
  return `<div class="rv-wrap">
    <p class="outil-desc">${outilEsc(def.intro)}</p>
    <div class="rv-radar" id="rv-radar-${tool}">${outilRadarSvg(def, d.scores)}</div>
    <div class="rv-summary" id="rv-sum-${tool}">${outilSummaryHtml(def, d)}</div>
    ${def.domaines.map((dom, k) => outilDomainHtml(tool, sid, dom, d, k === 0)).join("")}
    <div class="rv-saved" id="rv-saved-${tool}"></div>
  </div>`;
}

function outilRefresh(tool, sid) {
  const def = OUTILS_DEF[tool], d = outilData(sid, tool);
  const r = document.getElementById("rv-radar-" + tool);
  if (r) r.innerHTML = outilRadarSvg(def, d.scores);
  const s = document.getElementById("rv-sum-" + tool);
  if (s) s.innerHTML = outilSummaryHtml(def, d);
  def.domaines.forEach(dom => {
    const h = document.getElementById(`rv-ds-${tool}-${dom.id}`);
    if (h) h.innerHTML = outilHeadScoreHtml(dom, d);
  });
}

const _outilsFsTimers = {};
function outilPersist(sid, tool) {
  const d = outilData(sid, tool);
  d.timestamp = new Date().toISOString();
  try {
    localStorage.setItem("cs4-outils", JSON.stringify(state.outils));
  } catch (err) {
    console.error("Outils : sauvegarde locale impossible", err);
  }
  const key = sid + "|" + tool;
  clearTimeout(_outilsFsTimers[key]);
  _outilsFsTimers[key] = setTimeout(() => {
    try {
      if (typeof firebase !== "undefined" && firebase.firestore) {
        firebase.firestore().collection("outils").doc(sid).set({
          clientId: state.selClientId || null,
          coachUid: state.coachUid || null,
          [tool]: d,
          updatedAt: new Date().toISOString()
        }, { mergeFields: ["clientId", "coachUid", "updatedAt", tool] })
          .catch(err => console.error("Outils : Firestore refusé", err));
      }
    } catch (err) {
      console.error("Outils : Firestore indisponible", err);
    }
  }, 800);
  const el = document.getElementById("rv-saved-" + tool);
  if (el) el.textContent = "✓ Enregistré";
}

function outilSlide(tool, sid, domId, i, el) {
  const d = outilData(sid, tool);
  if (!d.q[domId]) d.q[domId] = {};
  const val = Number(el.value);
  d.q[domId][i] = val;
  el.classList.remove("untouched");
  const row = el.closest(".rv-q");
  if (row) row.classList.add("has");
  const sc = document.getElementById(`rv-qs-${tool}-${domId}-${i}`);
  if (sc) sc.textContent = String(val);
  outilRefresh(tool, sid);
  outilPersist(sid, tool);
}

function outilSlideCommit(tool, sid, domId, i, el) {
  if (el.classList.contains("untouched")) outilSlide(tool, sid, domId, i, el);
}

function outilClear(tool, sid, domId, i) {
  const dom = OUTILS_DEF[tool].domaines.find(x => x.id === domId);
  if (!dom) return;
  const d = outilData(sid, tool);
  if (d.q[domId]) delete d.q[domId][i];
  const row = document.getElementById(`rv-q-${tool}-${domId}-${i}`);
  if (row) {
    row.classList.remove("has");
    row.innerHTML = outilQuestionHtml(tool, sid, dom, i, d);
  }
  outilRefresh(tool, sid);
  outilPersist(sid, tool);
}

function outilNote(tool, sid, domId, val) {
  outilData(sid, tool).note[domId] = val;
  outilPersist(sid, tool);
}

function getOutilsClientSessions(clientId) {
  const all = state.sessions || {};
  const out = [];
  Object.keys(all).forEach(k => {
    const v = all[k];
    if (Array.isArray(v)) { if (k === clientId) out.push(...v); }
    else if (v && v.clientId === clientId) out.push(v);
  });
  return out;
}

function renderOutilsTab() {
  const wrap = document.createElement("div");
  const clientId = state.selClientId;

  if (!clientId) {
    const options = state.clients.map(c => `<option value="${outilEsc(c.id)}">${outilEsc(c.name)}</option>`).join('');
    wrap.innerHTML = `<div class="outils-container">
      <h2>🛠️ Outils Coaching</h2>
      <p class="outil-desc">Choisir un client :</p>
      <select onchange="if(this.value) setState({selClientId:this.value, selOutilSessionIndex:null, selOutilSubTab:'ikigai'})" style="padding:8px;border-radius:6px;border:1px solid #ccc;min-width:220px;">
        <option value="">— Sélectionner —</option>${options}
      </select>
    </div>`;
    wrap.appendChild(buildProtocolesEtTests(null));
    return wrap;
  }

  const client = state.clients.find(c => c.id === clientId);
  if (!client) {
    wrap.innerHTML = `<div class="empty-state">Client introuvable</div>`;
    return wrap;
  }

  const clientSessions = getOutilsClientSessions(clientId);
  const currentIndex = (state.selOutilSessionIndex !== undefined && state.selOutilSessionIndex !== null)
    ? state.selOutilSessionIndex : "current";
  const sessionId = currentIndex === "current" ? `${clientId}_current` : `${clientId}_s${currentIndex}`;
  const activeSubTab = state.selOutilSubTab === "arbre" ? "arbre" : "ikigai";

  wrap.innerHTML = `
    <div class="outils-container">
      <h2>🛠️ Outils Coaching — ${outilEsc(client.name)}</h2>
      <button class="tab-btn" onclick="setState({selClientId:null, selOutilSessionIndex:null})">← Changer de client</button>

      <div class="session-selector">
        <label>Session :</label>
        <select id="sessionSelector" onchange="switchOutilSession(this.value)">
          <option value="current" ${currentIndex === "current" ? "selected" : ""}>📝 Session actuelle</option>
          ${clientSessions.map((s, idx) => `
            <option value="${idx}" ${idx === currentIndex ? "selected" : ""}>
              ${s.date ? new Date(s.date).toLocaleDateString('fr-FR') : 'Séance ' + (idx + 1)} — ${outilEsc(s.branchLabel || s.optionName || 'Séance')}
            </option>`).join('')}
        </select>
      </div>

      <div class="outils-tabs">
        <button class="tab-btn ${activeSubTab === 'ikigai' ? 'active' : ''}" onclick="switchOutilTab('ikigai')">🎯 Ikigaï</button>
        <button class="tab-btn ${activeSubTab === 'arbre' ? 'active' : ''}" onclick="switchOutilTab('arbre')">🌳 Arbre de Vie</button>
      </div>

      <div id="ikigai-tab" class="outil-panel ${activeSubTab === 'ikigai' ? '' : 'hidden'}">${outilPanelHtml('ikigai', sessionId)}</div>
      <div id="arbre-tab" class="outil-panel ${activeSubTab === 'arbre' ? '' : 'hidden'}">${outilPanelHtml('arbre', sessionId)}</div>

      <div class="outils-export">
        <button class="btn-save" onclick="exportOutilsPDF('${outilQ(sessionId)}', '${outilQ(client.name)}')">📥 Exporter en PDF</button>
      </div>
    </div>`;
  wrap.appendChild(buildProtocolesEtTests(client));
  return wrap;
}

function switchOutilTab(tabName) {
  state.selOutilSubTab = tabName;
  render();
}

function switchOutilSession(value) {
  state.selOutilSessionIndex = (value === "current") ? "current" : Number(value);
  render();
}

function exportOutilsPDF(sessionId, clientName) {
  const bloc = (tool) => {
    const def = OUTILS_DEF[tool], d = outilData(sessionId, tool);
    const doms = def.domaines.map(dom => {
      const q = d.q[dom.id] || {};

    return `<section><h2>${outilEsc(def.titre)}</h2>${outilRadarSvg(def, d.scores)}

      .dom{border-left:4px solid #9C7A2E;background:#FFFDF7;padding:10px 14px;margin-bottom:12px;page-break-inside:avoid}
      .dom-h{display:flex;justify-content:space-between;font-weight:bold;margin-bottom:6px}
      .dom-s{color:#9C7A2E;font-size:17px}
      .q{display:flex;justify-content:space-between;gap:14px;font-size:13px;padding:3px 0;border-top:1px solid #F0E8D2}
      .qv{font-weight:bold;white-space:nowrap}
      .note{font-style:italic;color:#6B6355;font-size:13px;margin-top:6px}
      .pied{margin-top:24px;border-top:1px solid #ddd;padding-top:10px;font-size:12px;color:#8A806E}
    </style></head><body>
    <h1>Outils Coaching</h1>
    <div class="sous">${outilEsc(clientName)} · ${new Date().toLocaleDateString('fr-FR')}</div>
    ${bloc('ikigai')}${bloc('arbre')}
    <div class="pied">Généré par CoachingStudio — Coach Julien</div>
    </body></html>`;
  const w = window.open('', '', 'height=700,width=850');
  if (!w) { alert("Le navigateur a bloqué la fenêtre d'export. Autorise les pop-ups pour ce site, puis réessaie."); return; }
  w.document.write(html);
  w.document.close();
  setTimeout(() => w.print(), 300);
}

class ContractGenerator {
  constructor(coachSettings, clientData, cadrageData) {
    this.coach = coachSettings;
    this.client = clientData;
    this.cadrage = cadrageData || {};
  }

  generateHTML() {
    let html = CONTRACT_TEMPLATE_SIMPLE;
    
    // Coach
    html = html.replace("{{coachName}}", this.coach.name || "Coach Julien Tieufri");
    html = html.replace("{{coachEmail}}", this.coach.email || "julien.coaching60@gmail.com");
    html = html.replace("{{coachSiret}}", this.coach.siret || "À REMPLIR");
    
    // Client
    html = html.replace("{{coacheeName}}", this.client.name || "Nom Client");
    html = html.replace("{{coachedEmail}}", this.client.email || "");
    html = html.replace("{{coachedTel}}", this.client.tel || "");
    html = html.replace("{{coachedObjective}}", this.client.objective || "");
    
    // Cadrage
    const duration = this.cadrage.duration || "3 mois";
    const sessionDuration = this.cadrage.sessionDuration || 60;
    const frequency = this.cadrage.frequency || "1x/semaine";
    const format = this.cadrage.format || "Visioconférence";
    const totalAmount = this.cadrage.totalAmount || 1200;
    const sessionsCount = this.cadrage.sessionsCount || 12;
    const pricePerSession = sessionsCount > 0 ? totalAmount / sessionsCount : totalAmount;
    
    html = html.replace("{{engagementDuration}}", duration);
    html = html.replace("{{sessionDuration}}", sessionDuration);
    html = html.replace("{{sessionsCount}}", sessionsCount);
    html = html.replace("{{sessionFrequency}}", frequency);
    html = html.replace("{{sessionFormat}}", format);
    html = html.replace("{{totalAmount}}", totalAmount);
    html = html.replace("{{pricePerSession}}", pricePerSession.toFixed(2));
    html = html.replace("{{paymentTerms}}", this.cadrage.paymentTerms || "À la signature");
    
    // Date
    const today = new Date().toLocaleDateString("fr-FR");
    html = html.replace(/{{contractDate}}/g, today);
    
    return html;
  }

  getHTMLPreview() {
    return this.generateHTML();
  }

  generatePDF() {
    const html = this.generateHTML();
    const opt = {
      margin: 5,
      filename: `Contrat_${this.client.name || "Client"}_${Date.now()}.pdf`,
      image: { type: "jpeg", quality: 0.98 },
      html2canvas: { scale: 2 },
      jsPDF: { orientation: "portrait", unit: "mm", format: "a4" }
    };
    html2pdf().set(opt).from(html).save();
  }
}

function archiveContract(clientId, clientName) {
  try {
    const box = document.getElementById("contractBox");
    const flat = flattenSignatures(box);
    const htmlContent = flat.innerHTML;
    const bothSigned = (window.__sigState && window.__sigState.sigCoachCanvas && window.__sigState.sigClientCanvas);
    firebase.firestore().collection("clients").doc(clientId).collection("contracts").doc(Date.now() + "").set({
      type: "coaching_contract",
      status: bothSigned ? "signed" : "draft",
      createdAt: new Date(),
      htmlContent: htmlContent,
      clientName: clientName
    }).then(() => {
      alert(bothSigned ? "✅ Contrat signé et archivé !" : "✅ Contrat archivé (non signé)");
    }).catch(err => {
      alert("❌ Erreur archivage: " + err.message);
    });
  } catch (err) {
    alert("Erreur: " + err.message);
  }
}

function initSignaturePads() {
  ["sigCoachCanvas", "sigClientCanvas"].forEach(function(id) {
    const canvas = document.getElementById(id);
    if (!canvas || canvas.__wired) return;
    canvas.__wired = true;
    const ctx = canvas.getContext("2d");
    ctx.lineWidth = 2;
    ctx.lineCap = "round";
    ctx.strokeStyle = "#1a1a1a";
    let drawing = false;
    let last = null;

    function pos(e) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      return { x: (e.clientX - rect.left) * scaleX, y: (e.clientY - rect.top) * scaleY };
    }

    canvas.addEventListener("pointerdown", function(e) {
      drawing = true;
      try { canvas.setPointerCapture(e.pointerId); } catch(_) {}
      last = pos(e);
      window.__sigState = window.__sigState || {};
      window.__sigState[id] = true;
    });
    canvas.addEventListener("pointermove", function(e) {
      if (!drawing) return;
      const p = pos(e);
      ctx.beginPath();
      ctx.moveTo(last.x, last.y);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
      last = p;
    });
    ["pointerup", "pointercancel", "pointerleave"].forEach(function(evt) {
      canvas.addEventListener(evt, function() { drawing = false; });
    });
  });
}

function clearSignature(id) {
  const canvas = document.getElementById(id);
  if (!canvas) return;
  const ctx = canvas.getContext("2d");
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (window.__sigState) window.__sigState[id] = false;
}

function flattenSignatures(sourceElement) {
  const clone = sourceElement.cloneNode(true);
  const originals = sourceElement.querySelectorAll("canvas.sig-pad");
  const clones = clone.querySelectorAll("canvas.sig-pad");
  originals.forEach(function(cv, i) {
    const img = document.createElement("img");
    img.src = cv.toDataURL("image/png");
    img.style.cssText = cv.style.cssText;
    img.width = cv.width;
    img.height = cv.height;
    if (clones[i]) clones[i].replaceWith(img);
  });
  return clone;
}
