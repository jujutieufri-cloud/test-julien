<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>CoachingStudio</title>
<link rel="icon" type="image/svg+xml" href="img/phare.svg"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'Segoe UI',Tahoma,Geneva,sans-serif;background:#F7F2E7;color:#2E2A20}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:#FDFBF5}::-webkit-scrollbar-thumb{background:#D8CBA8;border-radius:4px}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.fade{animation:fadeUp .25s ease}
input,textarea,select{font-family:inherit;color:#2E2A20;background:#FFFFFF;border:1px solid #D8CBA8;border-radius:8px;padding:10px 14px;font-size:14px;width:100%;outline:none;transition:border .2s}
input:focus,textarea:focus,select:focus{border-color:#9C7A2E}
input::placeholder,textarea::placeholder{color:#6B6355}
select option{background:#FBF7EC}
textarea{resize:vertical}
button{cursor:pointer;font-family:inherit;border:none;transition:opacity .15s,background .15s}
.btn{background:#9C7A2E;color:#F7F2E7;border-radius:8px;padding:9px 20px;font-weight:700;font-size:14px}
.btn:hover{opacity:.85}
.btn-g{background:transparent;color:#5A5648;border:1px solid #D8CBA8;border-radius:8px;padding:9px 16px;font-size:13px}
.btn-g:hover{background:#F0E9D8}
.btn-sm{background:transparent;color:#5A5648;border:1px solid #D8CBA8;border-radius:7px;padding:4px 11px;font-size:12px}
.btn-sm:hover{background:#F0E9D8}
.card{background:#FFFFFF;border:1px solid #E4DAC0;border-radius:14px}
.settings-card{padding:18px;margin-bottom:16px}
.settings-title{font-weight:700;font-size:14px;color:#2E2A20;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.settings-hint{font-size:12px;color:#5A5648;margin-bottom:14px;line-height:1.5}
.settings-subtitle{font-weight:700;font-size:12.5px;color:#8B7355;margin:16px 0 6px;text-transform:uppercase;letter-spacing:.04em}
.list-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #D8CBA8;flex-wrap:wrap;transition:background .15s ease}
.list-row:hover{background:#FBF8F0}
.list-empty{font-size:12.5px;color:#5A5648;padding:8px 0;font-style:italic}
.row-del{background:transparent;border:none;color:#c99a9a;cursor:pointer;font-size:18px;line-height:1;padding:4px 7px;border-radius:6px;transition:color .15s ease,background .15s ease}
.row-del:hover{color:#d07070;background:#FBEFEF}
.add-row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.lbl{color:#5A5648;font-size:13px;display:block;margin-bottom:4px;letter-spacing:.07em}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.span2{grid-column:span 2}
#app{display:flex;height:100vh;overflow:hidden}
html,body{overflow-x:hidden;max-width:100vw}
#mobileMenuBtn{display:none}
#mobileOverlay{display:none}
@media(max-width:860px){
  #mobileMenuBtn{
    display:flex;align-items:center;justify-content:center;
    position:fixed;top:14px;left:14px;z-index:300;
    width:42px;height:42px;border-radius:10px;
    background:#FFFFFF;border:1px solid #E4DAC0;box-shadow:0 2px 10px rgba(0,0,0,.12);
    font-size:20px;color:#2E2A20;cursor:pointer;
  }
  #sidebar{
    position:fixed;top:0;left:0;height:100vh;z-index:250;
    width:250px!important;padding:22px 10px!important;
    transform:translateX(-100%);transition:transform .25s ease;
    box-shadow:0 0 30px rgba(0,0,0,.25);
  }
  #sidebar.mobile-open{transform:translateX(0)}
  #sidebar.collapsed{width:250px}
  #sidebar.collapsed .brand,#sidebar.collapsed .sidebar-foot,#sidebar.collapsed .nav-label,#sidebar.collapsed .dot,#sidebar.collapsed .badge,#sidebar.collapsed .divider{display:flex!important}
  #sidebar .toggle-btn{display:none}
  #mobileOverlay.show{
    display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:240;
  }
  #main{width:100%;padding:70px 16px 24px!important}
  .card{max-width:100%!important;box-sizing:border-box}
  .grid2{grid-template-columns:1fr!important}
}
@media(max-width:600px){
  div[style*="grid-template-columns:repeat(5,1fr)"]{grid-template-columns:repeat(2,1fr)!important}
  div[style*="grid-template-columns:repeat(4,1fr)"]{grid-template-columns:repeat(2,1fr)!important}
  div[style*="grid-template-columns:repeat(3,1fr)"]{grid-template-columns:1fr!important}
}

/* Sidebar */
#sidebar{width:224px;background:#FFFFFF;border-right:1px solid #E4DAC0;display:flex;flex-direction:column;padding:22px 10px;flex-shrink:0;transition:width .25s ease,padding .25s ease;overflow:hidden}
#nav{flex:1;overflow-y:auto;min-height:0}
#sidebar.collapsed{width:52px;padding:12px 8px}
#sidebar.collapsed .brand,#sidebar.collapsed .sidebar-foot,#sidebar.collapsed .nav-label,#sidebar.collapsed .dot,#sidebar.collapsed .badge,#sidebar.collapsed .divider{display:none}
#sidebar.collapsed .nav-item{justify-content:center;padding:10px;font-size:17px}
#sidebar.collapsed .toggle-btn{margin:0 auto}
.brand{padding-left:8px;margin-bottom:28px}
.brand h1{font-size:22px;color:#2E2A20;font-weight:700}.brand h1 span{color:#9C7A2E}
.brand p{color:#6B6355;font-size:12px;letter-spacing:.12em;margin-top:3px}
.divider{height:1px;background:#E4DAC0;margin:8px 0}
nav{flex:1}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;padding:10px 14px;border-radius:10px;border:none;background:transparent;color:#5A5648;font-size:13.5px;font-weight:400;margin-bottom:3px;text-align:left;white-space:nowrap}
.nav-cat-label{padding:14px 14px 6px;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#9C7A2E;opacity:.75}
.nav-pole-label{padding:18px 14px 4px;margin-top:6px;font-size:11.5px;font-weight:800;letter-spacing:.03em;color:#4A4030;border-top:1px solid #D8CBA8}
.nav-pole-label:first-of-type{border-top:none;margin-top:0}
#sidebar.collapsed .nav-pole-label{display:none}
#sidebar.collapsed .nav-cat-label{display:none}
.nav-item:hover{background:#F0E9D8;color:#2E2A20}
.nav-item.active{background:#9C7A2E18;color:#9C7A2E;font-weight:700}
.nav-item .dot{margin-left:auto;width:5px;height:5px;border-radius:50%;background:#9C7A2E;flex-shrink:0}
.nav-item .badge{margin-left:auto;background:#9C7A2E30;color:#9C7A2E;border-radius:20px;padding:1px 8px;font-size:13px;font-weight:700;flex-shrink:0}
.sidebar-foot{padding-left:8px;padding-top:12px;color:#6B6355;font-size:12px;line-height:1.7}
.toggle-btn{display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:8px;border:1px solid #D8CBA8;background:transparent;color:#5A5648;font-size:15px;cursor:pointer;transition:background .15s,color .15s;flex-shrink:0}
.toggle-btn:hover{background:#F0E9D8;color:#9C7A2E}
.toggle-row{display:flex;justify-content:flex-end;margin-bottom:16px}
/* Main */
#main{flex:1;overflow-y:auto;padding:32px 36px}
/* Badges */
.badge-profil{display:inline-block;border-radius:20px;padding:2px 9px;font-size:13px;font-weight:700}
.status-badge{display:inline-block;border-radius:20px;padding:2px 9px;font-size:12px;font-weight:600}
.cat-badge{display:inline-block;border-radius:20px;padding:2px 9px;font-size:12px;font-weight:700}
/* Avatar */
.avatar{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0}
/* Lists */
.client-row{padding:15px 20px;cursor:pointer;display:flex;align-items:center;gap:16px;transition:background .15s;flex-wrap:wrap}
@media(max-width:600px){.client-row{gap:10px}.client-row>div:last-of-type{flex-direction:row!important;align-items:center!important}}
.client-row:hover{background:#F0E9D8}
/* Subtabs */
.subtabs{display:flex;flex-wrap:wrap;margin-bottom:20px;border-bottom:1px solid #E4DAC0}
.subtab{padding:8px 16px;border:none;background:transparent;cursor:pointer;font-family:inherit;font-size:13px;color:#5A5648;border-bottom:2px solid transparent;margin-bottom:-1px}
.subtab.active{color:#9C7A2E;font-weight:700;border-bottom-color:#9C7A2E}
/* Stat cards */
.stat-card{padding:18px;display:flex;align-items:center;gap:14px}
.stat-icon{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.stat-val{font-size:30px;font-weight:700;line-height:1}
.stat-lbl{font-size:13px;color:#5A5648;margin-top:3px}
/* Biblio */
.fiche-body{margin-top:16px;padding:16px 18px;background:#FFFFFF;border-radius:10px;border:1px solid #E4DAC0;color:#5A5648;font-size:13.5px;line-height:2;white-space:pre-wrap;display:none}
.fiche-body.open{display:block}
/* Session row */
.sess-row{display:flex;gap:12px;padding:12px 16px;background:#FFFFFF;border-radius:10px;border:1px solid #E4DAC0;margin-bottom:8px}
.sess-num{width:26px;height:26px;border-radius:50%;background:#9C7A2E18;color:#9C7A2E;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0}
/* Obj row */
.obj-row{display:flex;align-items:center;gap:12px;padding:11px 16px;background:#FFFFFF;border-radius:10px;border:1px solid #E4DAC0;margin-bottom:8px}
.obj-check{width:22px;height:22px;border-radius:6px;border:2px solid;background:transparent;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;cursor:pointer}
/* Progress bar */
.prog-track{height:3px;background:#E4DAC0;border-radius:4px;margin-top:4px}
.prog-bar{height:3px;border-radius:4px}
/* Action buttons on dashboard */
.action-card{padding:18px;cursor:pointer;text-align:center;border-radius:14px;border:1px dashed;transition:background .15s}
.tool-btn{padding:8px 16px;border-radius:8px;border:1px dashed;cursor:pointer;font-size:13px;font-weight:600;transition:background .15s ease;display:inline-flex;align-items:center;gap:6px}
/* Quick form */
.qform{padding:24px;margin-bottom:20px;border-radius:14px;border:1px solid #9C7A2E44;background:#FFFFFF}
/* Notes textarea */
#notesArea{flex:1;line-height:1.9;padding:22px;font-size:14px;border-radius:14px;min-height:0}
/* Tooltip */
.copied{color:#4a9e6a!important;border-color:#4a9e6a44!important}
/* Accordion arrow */
.arr{color:#6B6355;font-size:18px;user-select:none}

/* 📱 OPTIMISATIONS MOBILE */
@media(max-width:768px){
  /* Inputs tactiles */
  input[type="text"],
  input[type="email"],
  input[type="tel"],
  input[type="date"],
  input[type="time"],
  textarea,
  select {
    min-height: 44px !important;
    font-size: 16px !important; /* Évite zoom auto au focus */
    padding: 12px 14px !important;
    border-radius: 8px !important;
  }
  
  /* Boutons tactiles */
  button, .btn, .btn-g, .tool-btn, .subtab {
    min-height: 44px !important;
    min-width: 44px !important;
    padding: 12px 16px !important;
    font-size: 15px !important;
    border-radius: 8px !important;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  
  /* Gestion du clavier virtuel */
  input:focus, textarea:focus, select:focus {
    outline: none;
    border-color: #9C7A2E;
    box-shadow: 0 0 0 3px #9C7A2E22;
  }
  
  /* Prévenir le zoom au focus */
  input[type="text"],
  input[type="email"],
  input[type="tel"],
  input[type="date"],
  textarea {
    font-size: 16px;
  }
  
  /* Layout orientations */
  @media(orientation: portrait) {
    #main {
      padding: 70px 12px 24px !important;
    }
  }
  
  @media(orientation: landscape) {
    #main {
      padding: 60px 12px 24px !important;
    }
    #sidebar.mobile-open {
      height: 100%;
      overflow-y: auto;
    }
  }
  
  /* Scroll smooth */
  html {
    scroll-behavior: smooth;
  }
  
  /* Éviter les doigts qui se touchent */
  .nav-item, .client-row, .sess-row, .obj-row {
    min-height: 48px;
    padding: 12px 14px;
  }
  
  /* Dropdowns tactiles */
  select {
    appearance: none;
    background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%235A5648' stroke-width='2'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
    background-repeat: no-repeat;
    background-position: right 12px center;
    background-size: 20px;
    padding-right: 40px !important;
  }
}

@media(max-width:600px){
  body {
    overflow-x: hidden;
  }
  
  /* Réduire espacement */
  #main {
    padding: 70px 10px 20px !important;
  }
  
  .card {
    border-radius: 10px !important;
  }
  
  /* Actions plus grandes */
  .action-card {
    padding: 20px !important;
    min-height: 60px;
  }
  
  /* Fullwidth sur forms */
  .grid2 {
    grid-template-columns: 1fr !important;
  }
  
  /* Boutons coller en bas sur mobile */
  form > .grid2:last-of-type,
  form > div:last-of-type {
    position: sticky;
    bottom: 0;
    background: white;
    padding: 12px 0;
    border-top: 1px solid #E4DAC0;
  }
}

/* Landscape + portrait tweaks */
@media(max-height: 600px) {
  #main {
    padding-top: 50px !important;
  }
  .qform {
    padding: 16px !important;
  }
}
/* ═══ OUTILS TAB ═══ */
.outils-container { padding: 20px; }
.session-selector { margin-bottom: 20px; display: flex; gap: 10px; align-items: center; }
.session-selector select { padding: 8px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
.outils-tabs { display: flex; gap: 10px; margin: 20px 0; border-bottom: 1px solid #E4DAC0; }
.tab-btn { padding: 10px 20px; border: none; background: #f3f4f6; cursor: pointer; border-radius: 6px; font-weight: 500; transition: all 0.2s; font-size: 14px; }
.tab-btn.active { background: #4f46e5; color: white; }

.tab-btn.active:hover { background: #4f46e5; }
.outil-panel { display: block; }
.outil-panel.hidden { display: none; }

.ikigai-input-group label, .arbre-section h4 { display: block; font-weight: bold; margin-bottom: 8px; color: #1f2937; font-size: 14px; }
.ikigai-input-group textarea, .arbre-section textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-family: inherit; min-height: 80px; font-size: 14px; }
.ikigai-visual, .arbre-visual { margin-top: 30px; padding: 20px; background: #f9fafb; border-radius: 8px; }
.outils-export { margin-top: 30px; text-align: center; }
.btn-save { padding: 10px 20px; background: #10b981; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 14px; transition: background 0.2s; }
.btn-save:hover { background: #059669; }
.empty-state { padding: 40px; text-align: center; color: #999; font-size: 14px; }
/* ═══ OUTILS V3 — radar + questions à curseur ═══ */
.rv-wrap{max-width:720px;margin:0 auto}
.rv-radar{margin:10px 0 6px}
.rv-summary{background:#FFFDF7;border:1px solid #E4DAC0;border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.55;color:#4A4030;margin-bottom:16px}
.rv-summary div{margin:3px 0}
.rv-dom{background:#FFFDF7;border:1px solid #E4DAC0;border-radius:14px;margin:12px 0;padding:0 14px}
.rv-dom[open]{padding-bottom:14px}
.rv-dhead{list-style:none;display:flex;align-items:center;gap:10px;cursor:pointer;padding:14px 0;min-height:48px}
.rv-dhead::-webkit-details-marker{display:none}
.rv-title{flex:1;font-weight:600;font-size:15px;color:#3A3226;line-height:1.35}
.rv-dscore{display:flex;flex-direction:column;align-items:flex-end;color:#9C7A2E;line-height:1.1}
.rv-dscore b{font-size:20px}
.rv-dscore small{font-size:11px;color:#8A806E}
.rv-chev{font-size:22px;color:#8A806E;transition:transform .2s}
.rv-dom[open] .rv-chev{transform:rotate(90deg)}
.rv-q{padding:12px 0 10px;border-top:1px solid #F0E8D2}
.rv-q-top{display:flex;align-items:flex-start;gap:10px}
.rv-q-text{flex:1;font-size:15px;color:#3A3226;line-height:1.4}
.rv-q-score{min-width:26px;text-align:right;font-weight:700;font-size:18px;color:#9C7A2E}
.rv-clear{background:none;border:none;color:#8A806E;font-size:18px;cursor:pointer;width:32px;height:32px;padding:0;visibility:hidden}
.rv-q.has .rv-clear{visibility:visible}
.rv-slider{width:100%;margin:12px 0 2px;accent-color:#9C7A2E;height:32px}
.rv-slider.untouched{opacity:.5}
.rv-scale{display:flex;justify-content:space-between;font-size:12px;color:#8A806E}
.rv-note{width:100%;box-sizing:border-box;margin-top:10px;padding:10px 12px;border:1px solid #E4DAC0;border-radius:10px;font:inherit;font-size:14px;background:#FFFFFF}
.rv-saved{font-size:12px;color:#4a9e6a;text-align:right;min-height:16px}
</style>

Le changement va d'une situation problématique vers une situation désirée. Il fait toujours naître une résistance d'égale puissance : c'est un mécanisme normal, pas un échec du client.

① « C'est fâcheux, je vis mal la situation. »
② « Si seulement j'avais / j'étais... »
③ « Il faudrait que je... » (sans passage à l'acte)
④ Un alibi solide pour ne pas bouger
⑤ Le non-agir est travesti pour masquer l'insatisfaction

LA COURBE DE DEUIL (traversée à chaque changement)
Déni → Colère → Marchandage → Tristesse → Acceptation
Le rôle du coach : accompagner chaque étape sans forcer, et savoir passer la main si besoin.

LES 4 PHASES DU CYCLE DE HUDSON
① SOI HÉROÏQUE — Lancement. Énergie haute, tournée vers l'extérieur : rêve, plan, action, plaisir (« ça marche ! »).
   → Accompagner : se former, réseauter, équilibrer les domaines de vie, prendre des pauses.
② SOI DÉSENCHANTÉ — Désynchronisation. Agacement, frustration, colère qui monte : ce qui marchait ne suffit plus.
   → Accompagner : nommer ce qui coince, préparer un plan de sortie sans pression, explorer d'autres options.
③ SOI INTÉRIORISÉ — Désengagement. Énergie basse, tournée vers l'intérieur : tristesse, repli, cocooning.
   → Accompagner : ralentir sans culpabiliser, soutenir, journal ou thérapie si besoin, ne pas pousser à l'action.
④ SOI PASSIONNÉ — Renouveau. Espoir, exploration, réintégration, nouveaux projets, sens retrouvé.
   → Accompagner : clarifier identité et valeurs, encourager des prises de risque mesurées.
⚠️ Une personne émotive en phase ② peut sembler être en phase ③ : vérifier avant d'adapter l'accompagnement.

QUESTIONS DE COACH (bilan de cycle)
– Combien de cycles as-tu vécus depuis l'âge adulte ?
– Quel thème dominait chacun ? Quel titre lui donnerais-tu ?
– Dans quelle phase es-tu aujourd'hui, et laquelle te plaît le plus ?

LES 6 PÔLES D'ÉNERGIE DE HUDSON (2 à 3 dominants en général, à repérer avec le client)
Puissance personnelle · Réussite · Intimité · Jeu · Quête de sens · Contribution

LES 4 VIEILLES RÈGLES DE VIE (qui ne fonctionnent plus)
① La linéarité — la vie comme suite prévisible d'étapes (études, travail, famille, retraite)
② La constance — travailler dur garantirait sécurité et bonheur pour toute la vie
③ Dehors/Dedans — la sécurité vient de l'extérieur (entreprise, État, diplômes)
④ Apprendre une fois pour toutes pendant la scolarité, puis c'est fini

LES 4 NOUVELLES RÈGLES DE VIE (qui donnent du pouvoir)
① Le recyclage — la vie se mesure en chapitres/cycles, pas en ligne droite
② Le changement — devenu la norme, plus l'exception
③ Dedans/Dehors — la sécurité vient de soi : identité solide, valeurs et objectifs propres
④ Apprendre est l'activité de toute une vie, à tout âge

LES 3 STADES DU DÉVELOPPEMENT PERSONNEL (à traverser sans en sauter aucun)
① Le ressenti et l'expérimentation — attention sans jugement au corps, aux sensations, aux pensées
② La compréhension — l'intellect analyse ensuite ce qui a été vécu, sans effacer le ressenti
③ Le lâcher-prise — l'ego cesse de vouloir tout contrôler ; confiance et sérénité s'installent`},
  {id:"o7b",cat:"Outils pratiques",phase:"evaluation",profil:"Tous",titre:"Matrice SWOT (forces/faiblesses/opportunités/menaces)",source:"Albert S. Humphrey — MHD Formation (CC BY 4.0)",
   contenu:`DÉFINITION
Le SWOT croise 2 axes pour éclairer un projet ou une décision : interne/externe, et positif/négatif.
Interne + positif = Forces (S) · Interne + négatif = Faiblesses (W)
Externe + positif = Opportunités (O) · Externe + négatif = Menaces (T)

QUESTIONS PAR CASE
① FORCES — Quels sont les atouts du projet ? Quelle est sa différence, son avantage ? Sur quelles ressources (matérielles, humaines) le client peut-il s'appuyer ?
② FAIBLESSES — Que lui manque-t-il pour réaliser le projet ? Que doit-il encore apprendre ?
③ OPPORTUNITÉS — Quelles opportunités de lieu, de moyens, de contacts, de contexte permettraient de concrétiser ce projet ?
④ MENACES — Quels blocages prévisibles ? Quelles contraintes incontournables / négociables ? Quelles résistances (humaines, institutionnelles, économiques, environnementales) ? Le projet prend-il en compte ses besoins, ses valeurs, ses atouts et ses faiblesses personnelles ? Quel impact sur son environnement, ses comportements, sa qualité de vie ?

2 POSTURES À REPÉRER CHEZ LE CLIENT
– Focalisé Forces/Faiblesses (« l'input ») : centré sur les moyens à mobiliser (temps, argent, apprentissages). Changer = chercher de nouveaux moyens.
– Focalisé Opportunités/Menaces (« l'output ») : centré sur l'objectif et le résultat. Toute menace devient une occasion de changer, d'inventer, d'ajuster sa vision.
→ Utile pour situer où porte l'attention du client, et l'aider à explorer l'axe qu'il néglige.`},
  {id:"o8b",cat:"Outils pratiques",phase:"entrainement",profil:"Tous",titre:"Écoute active et reformulation",source:"MHD Formation (CC BY 4.0)",
   contenu:`ÉCOUTE PASSIVE VS ÉCOUTE ACTIVE
Passive : processus mécanique, peu d'effort, on entend sans absorber.
Active : demande un effort — absorber ce qui est dit, le relier à sa propre expérience, le rendre réutilisable.

PRATIQUER L'ÉCOUTE ACTIVE
– Garder le contact visuel, se pencher vers l'avant, écouter avec tout le corps
– Observer le langage corporel, les expressions, le ton — ils font partie du message
– Ne pas se laisser distraire ; poser de côté tout objet à manipuler
– Avancer par étapes : écouter → interpréter → évaluer (ne pas sauter à l'action)
– Repérer aussi ce qui s'exprime involontairement : lapsus, ordre du discours, mots chargés

LE SILENCE
Première technique d'écoute active : se taire pendant que l'autre parle ou cherche ses mots. Il existe des silences de réflexion, de conception, d'accoutumance — les laisser vivre.

LE QUESTIONNEMENT (en entonnoir : du général au particulier)
– Questions ouvertes : laisser l'interlocuteur s'exprimer librement
– Questions fermées / alternatives : préciser un point
– Questions de relance : approfondir ce qui vient d'être dit (≠ questions d'enchaînement qui font juste poursuivre le récit)
À éviter : questions négatives involontaires ou inductives, deux questions en une, questionnaire rigide plaqué sur le discours du client.

LES 3 REFORMULATIONS
① Reformulation-écho — reprendre un mot fort de l'interlocuteur (fort pour lui, pas nécessairement pour vous)
② Reformulation-résumé — renvoyer une image synthétique d'un discours spontané et désordonné
③ Reformulation-élucidation — renvoyer une vue du problème différente de ce qui a été dit explicitement, mais sentie sous-jacente ; pousse à aller plus loin

S'ENTRAÎNER
Interviewer (pas interroger) sur un sujet personnel en n'utilisant que des reformulations. Une reformulation juste se reconnaît au « oui » de l'interlocuteur. Signes de progrès : discours plus riche, implication accrue, traits personnels révélés, confiance visible.`},
  {id:"o9b",cat:"Outils pratiques",phase:"entrainement",profil:"Tous",titre:"Les trois positions de perception",source:"MHD Formation (CC BY 4.0)",
   contenu:`DÉFINITION
Face à une situation, on a tendance à ne voir qu'un seul point de vue — limitant. Circuler entre 3 positions ouvre davantage de choix.

LES 3 POSITIONS
① Première position (SOI) — la situation vue depuis mon propre point de vue : mes références, mes critères. Position associée par excellence.
② Deuxième position (L'AUTRE) — le point de vue de l'autre personne, telle qu'elle vit la situation. Position dissociée de moi, associée au modèle du monde de l'autre.
③ Troisième position (LE SYSTÈME) — un point de vue extérieur à la relation moi/l'autre. J'observe avec curiosité : qu'est-ce que je déclenche chez l'autre, qu'est-ce que sa réponse déclenche chez moi ? Qu'est-ce que je pourrais faire différemment ?

On peut circuler dans ces 3 positions autant de fois que nécessaire pour trouver une solution qui respecte les deux modèles du monde.

EXERCICE — RÉFLEXION SUR UN CONFLIT (groupe de 3, 60 min : sujet, programmeur, observateur)
① Le sujet identifie une situation conflictuelle à faire évoluer
② Chaise 1 — explorer le conflit de son propre point de vue
③ État séparateur
④ Chaise 2 — explorer le conflit du point de vue de l'autre
⑤ État séparateur
⑥ Chaise 3 — observer la relation, chercher des options
⑦ Retour en position 1 pour intégrer ce qui a été découvert en P2 et P3
⑧ Repasser dans les autres positions si nécessaire`},
  {id:"o10b",cat:"Outils pratiques",phase:"entrainement",profil:"Tous",titre:"Cadrage et recadrage — technique du briefing/débriefing",source:"MHD Formation (CC BY 4.0)",
   contenu:`LE PILOTAGE
Organiser une mécanique qui permet de centrer la personne sur ses axes de progrès et de suivre son évolution.

LE BRIEFING (préparer l'action — « la préparation prime l'action »)
① Faire parler, laisser s'exprimer — prendre en compte toutes les facettes
② Écouter — le non-dit, le sous-dit, le sur-dit, le pas-dit, les évitements ; ressourcer la personne sur ses talents
③ Lui demander les solutions qu'elle peut mettre en place (« puis-je t'en proposer ? » seulement après qu'elle ait elle-même proposé)
④ Faire poser des actions — quand, comment
⑤ Prendre un nouveau rendez-vous pour évaluer le chemin parcouru
→ Un briefing se fait à chaque nouvelle action ou objectif, en cas d'inconnu, ou après un échec à corriger.

LE DÉBRIEFING — 5 grandes phases
Quoi de neuf ? Réussites et échecs depuis le dernier entretien → Retour au plan d'action : comment mis en œuvre ? → Reprendre point par point, les zones d'ombre → Chercher ensemble le correctif, laisser 24h pour résoudre → Dernier tour d'horizon, nouveau rendez-vous.
Erreurs à éviter : minimiser les difficultés, juger, penser que le temps arrangera les choses, penser qu'un seul entretien suffit.

LE RECADRAGE
Doit être fulgurant, franc, suivi d'un retour immédiat à la stabilité — ni rancune, ni agressivité.
RNAR 1 — Rappel Non Agressif de la Règle, factuel : « J'ai vu que... » + le sens donné à la règle. Écouter la justification sans rebondir dessus.
RNAR 2 — Même chose, suivi d'une question fermée : « on est d'accord, oui ou non ? »
Reprise d'autorité (si besoin) — convocation brève et formelle, conclure rapidement sans accepter de justification supplémentaire.`},
  {id:"o11b",cat:"Outils pratiques",phase:"evaluation",profil:"Tous",titre:"Entretien d'objectif (fiche de référence)",source:"MHD Formation (CC BY 4.0)",
   contenu:`QUAND L'UTILISER
Quand il y a un écart entre la situation réelle et la situation souhaitée. (Fiche de référence rapide — le déroulé guidé complet est disponible dans Protocole.)

① OBJECTIF
— Sur quel objectif veux-tu travailler ?
— Qu'est-ce que tu veux vraiment ?

② RÉALITÉ
— Où en es-tu par rapport à cela aujourd'hui ?

③ OPTIONS
— Trouve 5 options qui te permettront d'atteindre ton objectif (dont 2 farfelues)
— Laquelle te paraît la plus facile, sur laquelle tu pourrais t'engager maintenant ?
— À quoi saurais-tu que tu avances dans la bonne direction ?
— Quelles difficultés pourrais-tu rencontrer, personnelles ou extérieures ?
— Sur une échelle de 1 à 10, ta détermination à mettre en place cette action ?
— De quoi as-tu besoin pour une évaluation plus haute ?

④ SAUT
— Quand vas-tu le faire ?
— Qu'auras-tu accompli d'ici notre prochain rendez-vous ?
— (penser au verrouillage : tél, mail, etc.)`},
  {id:"o12b",cat:"Outils pratiques",phase:"psychoeducation",profil:"Tous",titre:"Les trois pôles du fonctionnement humain",source:"MHD Formation (CC BY 4.0)",
   contenu:`LES 3 MODES D'EXPRESSION (qui s'influencent réciproquement)
① Processus internes — cognitifs, activité mentale, pensée, réflexion
② États internes — ce que nous ressentons
③ Comportements externes — et réactions physiologiques, ce que nous manifestons

→ Utile pour repérer vers quel pôle orienter un entretien : un client qui reste dans le comportement (« je fais ça ») peut être invité vers l'état interne (« qu'est-ce que ça te fait ? ») ou le processus (« qu'est-ce que tu te dis ? »).

EXERCICE (groupe de 3, 30 min : sujet, programmeur, guide)
Sujet et programmeur assis face à face, le guide debout derrière le sujet. Par gestes convenus, le guide invite le programmeur à orienter l'entretien vers l'un des trois pôles.`},
  {id:"o13b",cat:"Outils pratiques",phase:"entrainement",profil:"Tous",titre:"La stratégie de créativité de Walt Disney",source:"Robert Dilts (modélisation de Walt Disney) — MHD Formation (CC BY 4.0)",
   contenu:`PRINCIPE
Walt Disney abordait chaque projet en 3 étapes séquentielles : rêver, explorer les moyens de réaliser, puis critiquer précisément ce qui avait émergé.

LES 3 ESPACES (installés en triangle, en méta-position)
① Rêveur — dissocié, accède librement : se souvenir d'une expérience où l'on rêvait librement, très créatif
② Réalisateur — associé, organise : se souvenir d'une expérience où l'on structurait un plan précis et réaliste
③ Critique — dissocié, évalue : se souvenir d'une expérience où l'on évaluait une situation de façon constructive et juste

DÉROULÉ AVEC UN OBJECTIF
① Rêveur — comme un film dont le client est le héros : voir les séquences, sans douter, sans se critiquer
② Réalisateur — s'associer à la réalisation concrète de ce qui a été rêvé
③ Critique — évaluer le plan : qu'est-ce qui est bon, qu'est-ce qui manque ?
④ Retour au Rêveur — rêver à nouveau en intégrant les apports du Réalisateur et du Critique
→ Repasser dans les 3 espaces jusqu'à satisfaction dans chacun d'eux.`},
  {id:"o14b",cat:"Outils pratiques",phase:"entrainement",profil:"Tous",titre:"Techniques de l'écoute et de l'accompagnement",source:"MHD Formation (CC BY 4.0)",
   contenu:`QUESTIONS OUVERTES / FERMÉES
Ouvertes — large choix de réponse, préférées en coaching : explorent représentations, états internes, attitudes.
Fermées — réponse oui/non : utiles pour valider une reformulation, ou rassurer une personne insécurisée en tout début d'accompagnement.

LE SILENCE
Clé de la relation de coaching : ne pas interrompre les propos ou l'émotion. Laisse le coaché avancer à son rythme — un temps d'élaboration, pas un vide à combler.

LA REFORMULATION
— Des contenus : reprendre l'essentiel de ce qui a été dit (« si j'ai bien compris... »). Favorise la communication, le sentiment d'être écouté, évite les malentendus.
— Des ressentis : le coach partage son propre état interne pour renforcer sa présence dans la relation.

LE FORMATAGE (configurer une expérience, la rendre identifiable — 7 points)
① Focalisation — orienter vers des expériences précises (unité de temps, de lieu, d'action)
② Temps météo — inviter à prendre conscience de ce qui se passe en soi
③ Clarification — rendre le propos plus clair et concret
④ Identification — nommer les éléments significatifs du problème
⑤ Technique du reflet — exprimer ce que le coach perçoit chez le coaché
⑥ Confrontation — rendre conscients des éléments incohérents (réservé, qualité relationnelle requise)
⑦ Écho — répéter les derniers mots prononcés, souvent sur un mode interrogatif

LES 3 FORMES DE LANGAGE
— Interprétatif : le sens donné à l'expérience (« ça veut dire que... »)
— Évaluatif : qualifie l'expérience, centré sur l'émotion ressentie
— Descriptif : objective la situation — à privilégier pour une représentation réaliste et repérante`},

// Protège la copie locale : une liste vide (mauvais compte) ne doit jamais effacer les clients mémorisés.
// ---------- Rendez-vous du client (passés / à venir) ----------
function rdvKey(r) { return (r.date || "") + "T" + (r.heure || "00:00"); }
function rdvNowKey() { const d = new Date(), p = x => String(x).padStart(2, "0"); return d.getFullYear() + "-" + p(d.getMonth()+1) + "-" + p(d.getDate()) + "T" + p(d.getHours()) + ":" + p(d.getMinutes()); }
function rdvFrDate(date) { const d = new Date(date + "T00:00:00"); return isNaN(d) ? date : d.toLocaleDateString("fr-FR", { weekday:"short", day:"numeric", month:"short", year:"numeric" }); }
function rdvListeClient(clientId) {
  return (state.appointments || []).filter(a => a.clientId === clientId && a.date).map(a => ({ id: a.id, date: a.date, heure: a.heure || "", motif: a.motif || "" }));
}
function rdvDuClient(c) {
  const local = rdvListeClient(c.id);
  const liste = local.length ? local : (c.rendezVous || []);
  return liste.filter(r => r && r.date);
}
// La copie des rendez-vous d'un client est gardée dans sa fiche (Firestore) : le portail client peut la lire.
function synchroniserRdvClient(clientId) {
  if (!clientId) return;
  const client = (state.clients || []).find(c => c.id === clientId);
  if (!client) return;
  const rendezVous = rdvListeClient(clientId);
  client.rendezVous = rendezVous;
  ClientsManager.saveClient(clientId, { rendezVous });
}
let _rdvReconcilie = false;
function reconcilierRendezVousClients() {
  if (_rdvReconcilie) return;
  _rdvReconcilie = true;
  (state.clients || []).forEach(c => {
    const tri = l => l.slice().sort((a, b) => a.id < b.id ? -1 : 1);
    const calcule = tri(rdvListeClient(c.id));
    if (!calcule.length) return;                       // jamais d'écrasement par une liste vide
    if (JSON.stringify(calcule) === JSON.stringify(tri(c.rendezVous || []))) return;
    c.rendezVous = calcule;
    firebase.firestore().collection("clients").doc(c.id).set({ rendezVous: calcule }, { merge: true }).catch(e => console.error("rendez-vous clients:", e));
  });
}
function buildRdvSection(c) {
  const box = h("div",{style:"margin-top:22px"});
  const head = h("div",{style:"display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"});
  head.appendChild(h("div",{style:"color:#6B6355;font-size:13px;letter-spacing:.08em"},"RENDEZ-VOUS"));
  const tous = rdvDuClient(c);
  if (tous.length) {
    const exp = h("button",{class:"btn-sm"},"📥 Exporter (.ics)");
    exp.addEventListener("click", () => telechargerIcs("rendez-vous-" + (c.name || "client").replace(/\s+/g, "-") + ".ics", rdvToIcs(tous.map(r => ({ ...r, titre: "Séance — " + c.name })))));
    head.appendChild(exp);
  }
  box.appendChild(head);
  if (!tous.length) { box.appendChild(h("p",{style:"color:#6B6355;font-size:13px"},"Aucun rendez-vous enregistré pour ce client.")); return box; }
  const maintenant = rdvNowKey();
  const avenir = tous.filter(r => rdvKey(r) >= maintenant).sort((a, b) => rdvKey(a) < rdvKey(b) ? -1 : 1);
  const passes = tous.filter(r => rdvKey(r) < maintenant).sort((a, b) => rdvKey(a) < rdvKey(b) ? 1 : -1);
  function groupe(titre, liste, couleur, avecGoogle) {
    const g = h("div",{style:"margin-bottom:14px"});
    g.appendChild(h("div",{style:"font-weight:700;font-size:13px;color:" + couleur + ";margin-bottom:6px"}, titre + " (" + liste.length + ")"));
    if (!liste.length) g.appendChild(h("div",{style:"color:#6B6355;font-size:12.5px"},"Aucun"));
    liste.forEach(r => {
      const row = h("div",{style:"display:flex;justify-content:space-between;gap:8px;padding:7px 10px;border:1px solid #E4DAC0;border-radius:8px;margin-bottom:5px;background:#FFFDF7;font-size:13.5px;color:#2E2A20"});
      row.appendChild(h("span",{}, rdvFrDate(r.date) + (r.heure ? " · " + r.heure : "") + (r.motif ? " — " + r.motif : "")));
      if (avecGoogle) row.appendChild(h("a",{href: googleCalUrl(r, "Séance — " + c.name), target:"_blank", rel:"noopener", style:"color:#9C7A2E;font-size:12px;white-space:nowrap;text-decoration:none"},"📅 Google Agenda"));
      g.appendChild(row);
    });
    return g;
  }
  box.appendChild(groupe("À venir", avenir, "#9C7A2E", true));
  box.appendChild(groupe("Passés", passes, "#6B6355", false));
  return box;
}

// ---------- Plante d'évolution du projet ----------
function parcoursProgress(p) {
  if (!p) return 0;
  const ph = p.phases || [];
  if (ph.length) return ph.filter(x => x.done).length / ph.length;
  const ob = p.objectifs || [];
  if (ob.length) return ob.reduce((t, o) => t + (o.progression || 0), 0) / ob.length / 100;
  return 0;
}
function plantStage(r) { return r < 0.25 ? 1 : r < 0.5 ? 2 : r < 0.75 ? 3 : 4; }
const PLANT_NOMS = ["Le lancement", "La mise en place", "La pratique", "La floraison"];
function plantSvg(stage) {
  const top = { 1:115, 2:80, 3:55, 4:38 }[stage];
  const leaf = (x, y, rot) => `<ellipse cx="${x}" cy="${y}" rx="10" ry="4.8" fill="#5FA05A" transform="rotate(${rot} ${x} ${y})"/>`;
  const flower = (x, y, c) => { let t = ""; for (let i = 0; i < 5; i++) t += `<ellipse cx="${x}" cy="${y-8}" rx="4.8" ry="7.5" fill="${c}" transform="rotate(${i*72} ${x} ${y})"/>`; return t + `<circle cx="${x}" cy="${y}" r="3.6" fill="#F2C94C"/>`; };
  const bud = (x, y) => `<ellipse cx="${x}" cy="${y}" rx="4" ry="6" fill="#E88A8A"/>`;
  const pairs = { 1:1, 2:2, 3:3, 4:3 }[stage];
  let leaves = "";
  for (let k = 0; k < pairs; k++) { const y = 138 - k * 26; leaves += leaf(68, y, -30) + leaf(92, y - 6, 30); }
  let haut = "";
  if (stage === 3) haut = bud(80, top - 4) + bud(66, top + 16) + bud(94, top + 12);
  if (stage === 4) haut = flower(80, top, "#E87A7A") + flower(60, top + 24, "#F29BA0") + flower(100, top + 20, "#E87A7A");
  if (stage <= 2) haut = leaf(72, top, -40) + leaf(88, top - 2, 40);
  return `<svg viewBox="0 0 160 190" width="150" height="178" role="img" aria-label="Plante, étape ${stage} sur 4"><path d="M80 152 L80 ${top}" stroke="#4E8B4A" stroke-width="4" stroke-linecap="round" fill="none"/>${leaves}${haut}<ellipse cx="80" cy="152" rx="34" ry="6" fill="#6B4A32"/><path d="M46 152 L54 186 L106 186 L114 152 Z" fill="#C8734A"/><rect x="44" y="148" width="72" height="9" rx="3" fill="#B5633C"/></svg>`;
}
function buildPlantBlock(c) {
  const r = parcoursProgress(c.parcours), st = plantStage(r);
  const box = h("div",{style:"display:flex;align-items:center;gap:16px;border:1px solid #E4DAC0;border-radius:14px;padding:12px 16px;margin-bottom:22px;background:#FFFDF7"});
  const holder = h("div",{}); holder.innerHTML = plantSvg(st);
  box.appendChild(holder);
  const txt = h("div",{});
  txt.appendChild(h("div",{style:"font-size:12px;letter-spacing:.08em;color:#6B6355"},"ÉVOLUTION DU PROJET"));
  txt.appendChild(h("div",{style:"font-size:17px;font-weight:700;color:#2E2A20;margin:4px 0"}, "Étape " + st + " · " + PLANT_NOMS[st-1]));
  txt.appendChild(h("div",{style:"font-size:13px;color:#6B6355"}, Math.round(r * 100) + "% des étapes du parcours franchies"));
  box.appendChild(txt);
  return box;
}

// Envoie un exercice du catalogue dans le parcours du client (il apparaît tout de suite dans son espace).
function envoyerExercice(c, cat, sauver) {
  if (!c.exercices) c.exercices = [];
  c.exercices.push({
    id: "ex_" + Date.now() + "_" + cat.id, catalogueId: cat.id, titre: cat.titre, consigne: cat.consigne,
    champs: cat.champs.map(ch => { const o = { id: ch.id, label: ch.label, aide: ch.aide || "" }; if (ch.type === "choix" || ch.type === "points") { o.type = ch.type; if (ch.total) o.total = ch.total; if (ch.max) o.max = ch.max; if (ch.toutes) o.toutes = true; o.options = (ch.options || []).map(x => ({ id: x.id, texte: x.texte })); } return o; }),
    done: false, envoyeLe: new Date().toISOString()
  });
  if (sauver !== false) ClientsManager.saveClient(c.id, { exercices: c.exercices });
}

// Réponses du client à un exercice structuré (lecture seule pour le coach).
function buildReponsesExercice(c, ex) {
  const rep = (c.reponsesExercices && c.reponsesExercices[ex.id]) || {};
  const remplis = ex.champs.filter(ch => String(rep[ch.id] || "").trim()).length;
  const det = h("details",{style:"margin-top:8px"});
  let maj = "";
  if (rep._maj) { const d = new Date(rep._maj); if (!isNaN(d)) maj = " · mis à jour le " + d.toLocaleDateString("fr-FR", { day:"numeric", month:"short" }); }
  det.appendChild(h("summary",{style:"cursor:pointer;font-size:12.5px;color:#9C7A2E;font-weight:600"}, "Réponses du client : " + remplis + "/" + ex.champs.length + maj));
  ex.champs.forEach(ch => {
    det.appendChild(h("div",{style:"font-size:12px;color:#6B6355;margin-top:8px"}, ch.label));
    const val = String(rep[ch.id] || "").trim(); let texte;
    if (ch.type === "points") { const p = pointsDe(val, (ch.options || []).length, 10), tot = ch.total || 10; texte = p ? (ch.options || []).map((o, k) => p[k] ? o.texte + " — note " + p[k] : "").filter(Boolean).join("\n") + (p.reduce((a, b) => a + b, 0) > tot ? "\n⚠️ Total " + p.reduce((a, b) => a + b, 0) + " / " + tot + " maximum" : "") : ""; }
    else { const opt = (ch.options || []).find(o => o.id === val); texte = opt ? opt.texte : val; }
    det.appendChild(h("div",{style:"font-size:13px;color:#2E2A20;white-space:pre-wrap"}, texte || "—"));
  });
  const catRes = catalogueComplet().find(x => x.id === ex.catalogueId);
  if (catRes && catRes.resultats) det.appendChild(buildResultatsCoach(catRes, rep, c, ex));
  return det;
}

  const box = h("div",{style:"margin-bottom:20px"});

    const pk = packPourEtape(c);

        const reste = exercicesAEnvoyer(c, pk.exercices).length;
        const bp = h("button",{class: reste ? "btn-sm" : "btn-g"}, reste ? "📤 Envoyer le pack (" + reste + " exercice" + (reste > 1 ? "s" : "") + ")" : "✓ Pack déjà envoyé");
        bp.disabled = !reste; bp.addEventListener("click", () => { envoyerPack(c, pk.exercices); dessiner(); if (apres) apres(); }); sg.appendChild(bp);

      box.appendChild(sg);
    }

// Diagnostic : retrouve les clients et séances rattachés à un autre identifiant de compte (ou sans identifiant).
async function diagnosticClients() {
  const user = firebase.auth().currentUser;
  if (!user) throw new Error("tu n'es pas connecté");
  const db = firebase.firestore();
  const [cs, ss] = await Promise.all([db.collection("clients").get(), db.collection("sessions").get()]);
  const groupes = {};
  const g = u => (groupes[u] = groupes[u] || { uid: u, clients: [], sessions: [] });
  cs.forEach(d => { const x = d.data() || {}; g(x.coachUid || "(aucun)").clients.push({ id: d.id, nom: x.name || x.nom || "(sans nom)" }); });
  ss.forEach(d => { const x = d.data() || {}; g(x.coachUid || "(aucun)").sessions.push({ id: d.id }); });
  let sauvegarde = 0;
  try { sauvegarde = (JSON.parse(localStorage.getItem("cs4-clients-sauvegarde") || "[]") || []).length; } catch (e) {}
  return { uid: user.uid, email: user.email || "", total: cs.size, moi: groupes[user.uid] || { clients: [], sessions: [] }, autres: Object.values(groupes).filter(x => x.uid !== user.uid), sauvegarde };
}

// Rattache les clients et séances d'un autre identifiant au compte connecté. Rien n'est supprimé.
async function rattacherClients(groupe, uid) {
  const db = firebase.firestore();
  const ops = [];
  groupe.clients.forEach(c => ops.push(db.collection("clients").doc(c.id)));
  groupe.sessions.forEach(x => ops.push(db.collection("sessions").doc(x.id)));
  const ancien = groupe.uid === "(aucun)" ? null : groupe.uid;
  for (let i = 0; i < ops.length; i += 400) {
    const batch = db.batch();
    ops.slice(i, i + 400).forEach(ref => batch.set(ref, { coachUid: uid, ancienCoachUid: ancien }, { merge: true }));
    await batch.commit();
  }
  return ops.length;
}

// Nettoyage ponctuel : donnees de test INTAKE / EN LIVE (fonctionnalites retirees).
// N'agit que sur les champs intake/intakeDate des clients et sur les seances EN LIVE (champ branch). Rien d'autre.
async function inventaireIntakeLive() {
  const user = firebase.auth().currentUser;
  if (!user) throw new Error("tu n'es pas connecté");
  const db = firebase.firestore();
  const [cs, ss] = await Promise.all([
    db.collection("clients").where("coachUid", "==", user.uid).get(),
    db.collection("sessions").where("coachUid", "==", user.uid).get()
  ]);
  const clients = [], sessions = [];
  cs.forEach(d => { const x = d.data() || {}; if (x.intake !== undefined || x.intakeDate !== undefined) clients.push({ id: d.id, nom: x.name || x.nom || "(sans nom)", intake: x.intake === undefined ? null : x.intake, intakeDate: x.intakeDate === undefined ? null : x.intakeDate }); });
  ss.forEach(d => { const x = d.data() || {}; if (x.branch !== undefined || x.branchLabel !== undefined || x.microAction !== undefined) sessions.push({ id: d.id, clientId: x.clientId || "", data: x }); });
  return { uid: user.uid, clients, sessions };
}

function telechargerSauvegardeIntakeLive(inv) {
  const contenu = JSON.stringify({ date: new Date().toISOString(), uid: inv.uid, clients: inv.clients, sessions: inv.sessions }, null, 2);
  const blob = new Blob([contenu], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "sauvegarde-intake-live-" + new Date().toISOString().slice(0, 10) + ".json";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

async function supprimerIntakeLive(inv) {
  const db = firebase.firestore();
  const del = firebase.firestore.FieldValue.delete();
  const ops = [];
  inv.clients.forEach(c => ops.push({ type: "champs", ref: db.collection("clients").doc(c.id) }));
  inv.sessions.forEach(s => ops.push({ type: "doc", ref: db.collection("sessions").doc(s.id) }));
  for (let i = 0; i < ops.length; i += 400) {
    const batch = db.batch();
    ops.slice(i, i + 400).forEach(o => { if (o.type === "champs") batch.update(o.ref, { intake: del, intakeDate: del }); else batch.delete(o.ref); });
    await batch.commit();
  }
  return ops.length;
}

function exportBackup() {

    ressources: state.ressources,
    notes: state.notes,

  const a = document.createElement("a");
  const d = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = `coachingstudio-sauvegarde-${d}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function importBackup(file) {
  const reader = new FileReader();
  reader.onload = (e) => {
    let data;
    try {
      data = JSON.parse(e.target.result);
    } catch (err) {
      alert("Fichier invalide : impossible de lire ce JSON.");
      return;
    }
    if (!data.clients || !Array.isArray(data.clients)) {
      alert("Fichier invalide : format de sauvegarde non reconnu.");
      return;
    }
    if (!confirm(`Restaurer cette sauvegarde va REMPLACER les données actuelles (${state.clients.length} client(s) actuel(s) → ${data.clients.length} client(s) dans la sauvegarde). Continuer ?`)) return;
    state.clients = data.clients;
    state.ressources = data.ressources || [];
    state.notes = data.notes || "";
    state.appointments = data.appointments || [];
    save();
    setState({tab:"dashboard", selClientId:null});
    alert("Sauvegarde restaurée avec succès.");
  };
  reader.readAsText(file);
}

      }).then(() => {

    if (this.unsubs[familyCode]) return;
    const ref = firebase.firestore().collection("familles").doc(familyCode);
    this.unsubs[familyCode] = ref.onSnapshot(snap => {
      if (snap.exists) this.familyData[familyCode] = snap.data();
      if (state.tab === "clairiere") render();

  unlink(familyCode) {
    if (this.unsubs[familyCode]) { this.unsubs[familyCode](); delete this.unsubs[familyCode]; }
    this.linkedFamilies = this.linkedFamilies.filter(c => c !== familyCode);

    delete this.familyData[familyCode];
    render();
  }
};

const MOOD_EMOJI = {joie:'😊',calme:'😌',fatigue:'😴',stress:'😰',colere:'😠',triste:'😢'};

function computeMemberInsights(data, pid) {
  const journee = data.journee || {};
  const entries = Object.keys(journee)
    .filter(k => journee[k] && journee[k].pid === pid)
    .map(k => journee[k])
    .filter(e => e.date)
    .sort((a,b) => a.date.localeCompare(b.date))
    .slice(-14);

  const routinesBySlot = (data.personRoutines && data.personRoutines[pid]) || {};
  const tasksDone = data.tasksDone || {};
  const incomplete = [];
  Object.keys(routinesBySlot).forEach(slot => {
    (routinesBySlot[slot] || []).forEach(r => {
      if (r.steps && r.steps.length) {
        r.steps.forEach(s => {
          const k = pid + '_' + slot + '_' + r.id + '_' + s.id;
          if (!tasksDone[k]) incomplete.push({slot, label: r.name + ' — ' + s.name});
        });
      } else {
        const k = pid + '_' + slot + '_' + r.id;
        if (!tasksDone[k]) incomplete.push({slot, label: r.name});
      }
    });
  });

  return { entries, incomplete };
}

function svgEnergyCurve(entries) {
  if (!entries.length) return h("div",{style:"font-size:13px;color:#6B6355;padding:6px 0"},"Pas encore de données d'énergie enregistrées.");
  const w = 240, hgt = 46, pad = 4;
  const step = entries.length > 1 ? (w - pad*2) / (entries.length - 1) : 0;
  const pts = entries.map((e,i) => {
    const val = typeof e.energie === 'number' ? e.energie : 0;
    const x = pad + i*step;
    const y = hgt - pad - (val/10)*(hgt - pad*2);
    return x.toFixed(1)+","+y.toFixed(1);
  }).join(" ");
  const svgNS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(svgNS, "svg");
  svg.setAttribute("width", w); svg.setAttribute("height", hgt); svg.setAttribute("viewBox", `0 0 ${w} ${hgt}`);
  const poly = document.createElementNS(svgNS, "polyline");
  poly.setAttribute("points", pts);
  poly.setAttribute("fill","none"); poly.setAttribute("stroke","#4a9e6a"); poly.setAttribute("stroke-width","2");
  svg.appendChild(poly);
  return svg;
}

function renderMemberInsights(data, m) {
  const { entries, incomplete } = computeMemberInsights(data, m.id);
  const box = h("div",{style:"margin-top:8px;padding-top:8px;border-top:1px solid #D8CBA8"});

  box.appendChild(h("div",{style:"font-size:12.5px;color:#5A5648;margin-bottom:4px"},"Énergie (14 derniers jours, /10)"));
  box.appendChild(svgEnergyCurve(entries));

  if (entries.length) {
    const moodRow = h("div",{style:"display:flex;gap:4px;margin-top:6px;flex-wrap:wrap"});
    entries.forEach(e => {
      moodRow.appendChild(h("span",{style:"font-size:14px",title:e.date+" — "+(e.humeur||'')}, MOOD_EMOJI[e.humeur] || '·'));
    });
    box.appendChild(moodRow);
  }

  if (incomplete.length) {
    const list = h("div",{style:"margin-top:8px;font-size:13px;color:#d0a070"});
    list.appendChild(h("div",{style:"font-weight:600;margin-bottom:3px"}, "⚠️ Non complété actuellement (" + incomplete.length + ")"));
    incomplete.slice(0,5).forEach(item => {
      list.appendChild(h("div",{style:"color:#9a9a85;padding:1px 0"}, "· " + item.label));
    });
    if (incomplete.length > 5) list.appendChild(h("div",{style:"color:#6a7a6a;font-style:italic"}, "+ " + (incomplete.length-5) + " autres"));
    box.appendChild(list);
  } else if (Object.keys((data.personRoutines||{})[m.id] || {}).length) {
    box.appendChild(h("div",{style:"margin-top:8px;font-size:13px;color:#4a9e6a"}, "✅ Toutes les routines définies sont à jour"));
  }

  return box;
}

function envoyerProgramme(familyCode, memberId, templateId, prenom) {
  const t = ROUTINE_TEMPLATES.find(x => x.id === templateId);
  if (!t) return;
  const routineObj = {
    id: 'r_' + Date.now(),
    name: t.name,
    jours: JOURS_ABBR_ALL.slice(),
    steps: t.steps.map((s,i) => ({ id: 's_' + (Date.now()+i), name: s }))
  };
  const path = `personRoutines.${memberId}.${t.slot}`;
  firebase.firestore().collection("familles").doc(familyCode).update({
    [path]: firebase.firestore.FieldValue.arrayUnion(routineObj)
  }).then(() => {

        if (rawDay && Array.isArray(rawDay.plages)) {
          plages = [0,1].map(i => ({ ...DEFAULT_SETTINGS.horaires[j].plages[i], ...(rawDay.plages[i]||{}) }));
        } else if (rawDay && rawDay.debut) {
          // ancien format (une seule plage débi/fin) : migration en douceur
          plages = [
            { ouvert: !!rawDay.ouvert, debut: rawDay.debut, fin: rawDay.fin },
            { ...DEFAULT_SETTINGS.horaires[j].plages[1] }
          ];
        } else {
          plages = DEFAULT_SETTINGS.horaires[j].plages.map(p => ({...p}));
        }
        mergedHoraires[j] = { plages };
      });
      this.data = {
        ...DEFAULT_SETTINGS,
        ...raw,
        horaires: mergedHoraires,
        dureeRdv: raw.dureeRdv || DEFAULT_SETTINGS.dureeRdv,
        tarifs: { ...DEFAULT_SETTINGS.tarifs, ...(raw.tarifs||{}) },
        messageInfo: { ...DEFAULT_SETTINGS.messageInfo, ...(raw.messageInfo||{}) },
        conges: raw.conges || [],
        forfaits: raw.forfaits || DEFAULT_SETTINGS.forfaits,
        contenuSite: {
          hero: { ...DEFAULT_SETTINGS.contenuSite.hero, ...((raw.contenuSite||{}).hero||{}) },
          quiSuisJe: { ...DEFAULT_SETTINGS.contenuSite.quiSuisJe, ...((raw.contenuSite||{}).quiSuisJe||{}) },
          profilIntro: { ...DEFAULT_SETTINGS.contenuSite.profilIntro, ...((raw.contenuSite||{}).profilIntro||{}) },
          chapitres: DEFAULT_SETTINGS.contenuSite.chapitres.map((ch,i) => ({ ...ch, ...(((raw.contenuSite||{}).chapitres||[])[i]||{}) }))
        }
      };
      if (!raw.horaires) {
        // Le document n'a jamais reçu d'horaires : on les initialise
        // pour que le site public ne se retrouve jamais sans données.
        this.save({ horaires: DEFAULT_SETTINGS.horaires });
      }
      if (cb) cb();
      if (state.tab === "reglages") render();
    }, e => { console.error("listen settings:", e); this.data = { ...DEFAULT_SETTINGS }; if (cb) cb(); });
  },
  save(patch) {
    firebase.firestore().collection("settings").doc("coach").set(patch, { merge: true })
      .then(() => notifCoach("✅ Réglages enregistrés"))
      .catch(e => notifCoach("Erreur : " + e.message));
  }
};

const RdvRequests = {
  items: [],
  unsub: null,
  autoTraites: new Set(),
  autoSupprimees: new Set(),
  listen() {
    if (this.unsub || !CoachLink.user) return;
    this.unsub = firebase.firestore().collection("rdvRequests")
      .orderBy("createdAt", "desc")
      .onSnapshot(snap => {
        this.items = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        this.autoConfirmerClientsExistants();
        this.nettoyerAnciennesDemandes();
        if (state.tab === "rdv" || state.tab === "agenda") render();
      }, e => console.error("listen rdvRequests:", e));
  },
  autoConfirmerClientsExistants() {
    this.items
      .filter(r => r.status === "nouveau" && !this.autoTraites.has(r.id))
      .forEach(r => {
        const client = trouverClientExistant(r);
        if (client) {
          this.autoTraites.add(r.id);
          if (r.motif === "Séance Découverte (gratuite)") {
            // La séance découverte gratuite est réservée aux nouveaux clients.
            this.setStatus(r.id, "rejete");
            notifCoach("⛔ Séance découverte refusée automatiquement : " + client.name + " est déjà client (offre réservée aux nouveaux).");
          } else {
            this.setStatus(r.id, "confirme");
            notifCoach("✅ RDV auto-confirmé (client existant) : " + client.name);
          }
        }
      });
  },
  nettoyerAnciennesDemandes() {
    const db = firebase.firestore();
    const seuil = Date.now() - 3 * 24 * 60 * 60 * 1000; // 3 jours
    this.items
      .filter(r => r.status !== "nouveau" && r.createdAt && new Date(r.createdAt).getTime() < seuil && !this.autoSupprimees.has(r.id))
      .forEach(r => {
        this.autoSupprimees.add(r.id);
        db.collection("rdvRequests").doc(r.id).delete()
          .catch(e => console.error("nettoyage rdvRequests:", e));
      });
  },
  setStatus(id, status, callback) {
    const db = firebase.firestore();
    const req = this.items.find(r => r.id === id);
    db.collection("rdvRequests").doc(id).update({ status })
      .then(() => {
        if (status === "confirme" && req) {
          if (req.date && req.heure) {
            const slotId = req.date + "_" + req.heure;
            db.collection("bookedSlots").doc(slotId).set({ date: req.date, heure: req.heure })
              .catch(e => console.error("bookedSlots:", e));
          }
          creerOuMajClientDepuisRdv(req);
        } else if (status === "rejete" && req && req.date && req.heure) {
          // Le créneau avait été réservé automatiquement à l'envoi : on le libère.
          const slotId = req.date + "_" + req.heure;
          db.collection("bookedSlots").doc(slotId).delete()
            .catch(e => console.error("bookedSlots (liberation):", e));
        }
        if (callback) callback(null);
      })
      .catch(e => {
        notifCoach("Erreur : " + e.message);
        if (callback) callback(e);
      });
  },
  annuler(id, callback) {
    const db = firebase.firestore();
    const req = this.items.find(r => r.id === id);
    db.collection("rdvRequests").doc(id).update({ status: "annule" })
      .then(() => {
        if (req && req.date && req.heure) {
          const slotId = req.date + "_" + req.heure;
          db.collection("bookedSlots").doc(slotId).delete()
            .catch(e => console.error("bookedSlots (annulation):", e));
          state.appointments = state.appointments.filter(a =>
            !(a.source === "site" && a.date === req.date && a.heure === req.heure));
          save();
        }
        notifCoach("Rendez-vous annulé, créneau libéré.");
        if (callback) callback(null);
        render();
      })
      .catch(e => {
        notifCoach("Erreur : " + e.message);
        if (callback) callback(e);
      });
  }
};

const MOTIF_TARIF_KEY = {
  "Séance Découverte (gratuite)": "decouverte",
  "Forfait Déclic": "declic",
  "Programme Sérénité": "codeChaine",
  "Forfait Famille Hérisson": "famille"
};

function montantPourMotif(motif) {
  const forfaitsDef = (CoachSettings.data && CoachSettings.data.forfaits) || DEFAULT_SETTINGS.forfaits;
  const fMatch = forfaitsDef.find(f => f.nom === motif);
  if (fMatch) return Number(fMatch.prix) || 0;
  const key = MOTIF_TARIF_KEY[motif];
  if (key && CoachSettings.data && CoachSettings.data.tarifs && CoachSettings.data.tarifs[key] != null) {
    return Number(CoachSettings.data.tarifs[key]);
  }
  return 0;
}

function appliquerForfait(client, motif) {
  const forfaitsDef = (CoachSettings.data && CoachSettings.data.forfaits) || DEFAULT_SETTINGS.forfaits;
  const fMatch = forfaitsDef.find(f => f.nom === motif);
  const total = fMatch ? Number(fMatch.seances) : 0;
  if (!total) return; // séance à l'unité / découverte / autre / club : pas de suivi de forfait
  if (client.forfaitNom !== motif || !client.forfaitTotal) {
    client.forfaitNom = motif;
    client.forfaitTotal = total;
    client.forfaitUtilisees = 1;
  } else {
    client.forfaitUtilisees = Math.min(total, (client.forfaitUtilisees||0) + 1);
  }
}

function normalizePhone(raw) {
  if (!raw) return "";
  let d = String(raw).replace(/[^\d+]/g, "");
  if (d.startsWith("+33")) d = "0" + d.slice(3);
  else if (d.startsWith("0033")) d = "0" + d.slice(4);
  return d;
}

function gcalUrl() { try { return localStorage.getItem("cs4-gcal-url") || ""; } catch (e) { return ""; } }

// Dialogue avec TON script Google Apps Script (qui tourne dans ton compte Google).
async function gcalAppel(corps) {
  const url = gcalUrl();
  if (!url) throw new Error("agenda Google pas encore relié");
  let r;
  try { r = await fetch(url, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(corps) }); }
  catch (e) { throw new Error("connexion impossible (réseau ou navigateur)"); }
  let j; try { j = await r.json(); } catch (e) { throw new Error("réponse illisible : vérifie l'adresse du script"); }
  if (!j.ok) throw new Error(j.erreur || "refusé par le script");
  return j;
}

function gcalPayload(a) {
  return { id: a.id, reqId: a.reqId || "", date: a.date, heure: a.heure || "", titre: "Séance — " + (a.clientName || "client"), motif: a.motif || "" };
}

// Automatique, jamais bloquant : si Google est indisponible, l'agenda de l'app fonctionne comme avant.
function gcalSyncRdv(action, a) {
  if (!gcalUrl() || !a || !a.id || (action === "upsert" && !a.date)) return;
  gcalAppel({ action: action === "delete" ? "delete" : "upsert", rdv: gcalPayload(a) })
    .then(() => { GCAL.etat = "ok"; })
    .catch(e => { GCAL.etat = "erreur"; console.warn("Google Agenda :", e.message); });
}

async function gcalToutSynchroniser() {
  const d = new Date(), p = x => String(x).padStart(2, "0");
  const aujourdhui = d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
  const liste = (state.appointments || []).filter(a => a.date && a.date >= aujourdhui).map(gcalPayload);
  if (!liste.length) return { ok: true, nb: 0, echecs: 0, vide: true };
  return gcalAppel({ action: "bulk", liste });
}

function gcalDerniere() { try { return JSON.parse(localStorage.getItem("cs4-gcal-last") || "null"); } catch (e) { return null; } }

// Panneau Google Agenda : relie ton agenda via un petit script Google, sans Google Cloud ni Vercel.
function buildGcalCard() {
  const card = h("div",{style:"border:1px solid #E4DAC0;border-radius:12px;padding:14px 16px;margin-bottom:18px;background:#FFFDF7"});
  const etat = h("div",{style:"font-size:13.5px;color:#5A5648;margin:6px 0 10px;line-height:1.45"},"Vérification…");
  const actions = h("div",{style:"display:flex;gap:8px;flex-wrap:wrap"});
  card.appendChild(h("div",{style:"font-weight:700;color:#2E2A20;font-size:14px"},"📅 Google Agenda"));
  card.appendChild(etat); card.appendChild(actions);

  function bouton(libelle, fn, primaire) {
    const b = h("button",{class: primaire ? "btn" : "btn-g"}, libelle);
    b.addEventListener("click", async () => { b.disabled = true; try { await fn(); } finally { b.disabled = false; } });
    return b;
  }
  function afficher(emoji, texte, couleur, boutons) {
    etat.textContent = emoji + " " + texte; etat.style.color = couleur;
    actions.innerHTML = ""; boutons.forEach(x => actions.appendChild(x));
  }

  const copier = async () => {
    try { await navigator.clipboard.writeText(GCAL_SCRIPT); alert("✅ Script copié.\n\nDans Google Apps Script : efface tout le code, colle ce script, enregistre (disquette).\n\nPremière fois : Déployer > Nouveau déploiement > Application Web (exécuter en tant que : Moi, accès : Tout le monde) et copie l'adresse en /exec.\n\nMise à jour d'un script déjà déployé : Déployer > Gérer les déploiements > crayon > Version : Nouvelle version > Déployer (l'adresse ne change pas).\n\nPuis, une seule fois : choisis la fonction « installerDeclencheur » dans la barre du haut, touche Exécuter et accepte les autorisations."); }
    catch (e) { alert("La copie automatique n'est pas possible sur ce navigateur."); }
  };
  const lier = async () => {
    const u = (prompt("Colle ici l'adresse de ton application web Google.\n\nElle commence par https://script.google.com/macros/s/ et finit par /exec") || "").trim();
    if (!u) return;
    if (!/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(u)) { alert("Cette adresse ne ressemble pas à celle d'une application web Google Apps Script (elle doit finir par /exec)."); return; }
    try { localStorage.setItem("cs4-gcal-url", u); } catch (e) { alert("Impossible d'enregistrer l'adresse sur ce navigateur."); return; }
    await verifier();
  };
  const delier = async () => {
    if (!confirm("Délier Google Agenda de cet appareil ?\n\nLes évènements déjà créés dans ton agenda restent en place.")) return;
    try { localStorage.removeItem("cs4-gcal-url"); localStorage.removeItem("cs4-gcal-last"); } catch (e) {}
    await verifier();
  };
  async function synchroniser() {
    afficher("🔄", "Synchronisation en cours…", "#5A5648", []);
    try {
      const r = await gcalToutSynchroniser();
      if (!r.vide) localStorage.setItem("cs4-gcal-last", JSON.stringify({ n: r.nb, echecs: r.echecs || 0, quand: new Date().toLocaleString("fr-FR", { day:"numeric", month:"short", hour:"2-digit", minute:"2-digit" }) }));
    } catch (e) { /* l'état réel s'affiche juste après */ }
    await verifier();
  }

  async function verifier() {
    if (!gcalUrl()) return afficher("⚪", "Pas encore relié. Sans Google Cloud ni Vercel : (1) copie le script, (2) colle-le dans Google Apps Script et déploie, (3) colle ici l'adresse obtenue, (4) lance « installerDeclencheur » une fois dans Google Apps Script pour activer la synchro automatique toutes les 5 minutes.", "#6B6355",
      [bouton("1. Copier le script", copier), bouton("2. Ouvrir Google Apps Script", async () => { window.open("https://script.new", "_blank"); }), bouton("3. Coller l'adresse", lier, true)]);
    try {
      const st = await gcalAppel({ action: "ping" });
      const last = gcalDerniere(), auto = st.auto, suffixe = last ? " · dernière synchro manuelle : " + last.quand + " (" + last.n + " rendez-vous" + (last.echecs ? ", " + last.echecs + " en échec" : "") + ")" : "";
      const base = "Connecté" + (st.compte ? " · " + st.compte : "");
      if (!auto) return afficher("🟠", base + " — ton script est une ancienne version : copie le nouveau, remplace-le dans Google Apps Script, redéploie (nouvelle version), puis lance « installerDeclencheur ».", "#B26A00", [bouton("Copier le nouveau script", copier, true), bouton("Revérifier", verifier), bouton("Délier", delier)]);
      if (!auto.installe) return afficher("🟠", base + " — la synchro automatique (toutes les 5 min) n'est pas encore activée : dans Google Apps Script, choisis la fonction « installerDeclencheur », touche Exécuter et accepte les autorisations.", "#B26A00", [bouton("Revérifier", verifier, true), bouton("Synchroniser maintenant", synchroniser), bouton("Délier", delier)]);
      const dr = auto.derniere, min = dr && dr.quand ? Math.round((Date.now() - new Date(dr.quand).getTime()) / 60000) : null;
      let ligne, emoji = "🟢", couleur = "#2F7D3B";
      if (!dr) ligne = " — automatique activé, première exécution en attente (moins de 5 min).";
      else if (dr.erreur) { emoji = "🟠"; couleur = "#B26A00"; ligne = " — automatique activé, mais la dernière exécution a rencontré une erreur : " + dr.erreur; }
      else if (min > 20) { emoji = "🟠"; couleur = "#B26A00"; ligne = " — automatique activé, mais aucune exécution depuis " + min + " min."; }
      else ligne = " — automatique toutes les 5 min · dernière exécution il y a " + (min < 1 ? "moins d'une minute" : min + " min") + (dr.versGoogle || dr.versSite ? " (" + (dr.versGoogle || 0) + " vers Google, " + (dr.versSite || 0) + " créneau(x) du site mis à jour)" : "") + ".";
      return afficher(emoji, base + ligne + suffixe, couleur, [bouton("Synchroniser maintenant", synchroniser, true), bouton("Revérifier", verifier), bouton("Délier", delier)]);
    } catch (e) {
      return afficher("🔴", "Le script ne répond pas correctement : " + e.message, "#B0413E", [bouton("Réessayer", verifier), bouton("Changer l'adresse", lier), bouton("Délier", delier)]);
    }
  }
  verifier();
  return card;
}

function ajouterRdvAgenda({ clientId, clientName, date, heure, motif, notes, source, reqId }) {
  const nouveauRdv = {
    id: "a" + Date.now() + Math.random().toString(36).slice(2,6),
    clientId: clientId || null,
    clientName: clientName || "Client",
    date: date || "",
    heure: heure || "",
    motif: motif || "",
    notes: notes || "",
    source: source || "manuel",
    reqId: reqId || null
  };
  state.appointments.push(nouveauRdv);
  save();
  gcalSyncRdv("upsert", nouveauRdv);
  if (nouveauRdv.clientId) synchroniserRdvClient(nouveauRdv.clientId);
  if (date && heure) {
    const slotId = date + "_" + heure;
    firebase.firestore().collection("bookedSlots").doc(slotId).set({ date, heure })
      .catch(e => console.error("bookedSlots (agenda manuel):", e));
  }
}

function supprimerRdvAgenda(id) {
  const item = state.appointments.find(a => a.id === id);
  state.appointments = state.appointments.filter(a => a.id !== id);
  save();
  if (item) gcalSyncRdv("delete", item);
  if (item && item.clientId) synchroniserRdvClient(item.clientId);
  if (item && item.date && item.heure) {
    const slotId = item.date + "_" + item.heure;
    firebase.firestore().collection("bookedSlots").doc(slotId).delete()
      .catch(e => console.error("bookedSlots delete:", e));
  }
  if (item && item.reqId) {
    firebase.firestore().collection("rdvRequests").doc(item.reqId).update({ status: "annule" })
      .catch(e => console.error("annulation rdvRequests:", e));
  }
}

function trouverClientExistant(req) {
  const emailNorm = (req.email || "").trim().toLowerCase();
  const telNorm = normalizePhone(req.tel);
  return state.clients.find(c => {
    const sameEmail = emailNorm && (c.email||"").trim().toLowerCase() === emailNorm;
    const samePhone = telNorm && normalizePhone(c.tel) === telNorm;
    return sameEmail || samePhone;
  }) || null;
}

function creerOuMajClientDepuisRdv(req) {
  let client = trouverClientExistant(req);
  const montant = montantPourMotif(req.motif);

  if (client) {
    client.sessions = (client.sessions || 0) + 1;
    client.nextSession = req.date || client.nextSession || "";
    client.nextSessionHeure = req.heure || client.nextSessionHeure || "";
    client.sessionHistory = client.sessionHistory || [];
    client.sessionHistory.push("Séance " + client.sessionHistory.length + 1 + " — " + (req.motif || "RDV") + (req.theme ? " (" + req.theme + ")" : "") + (req.date ? " le " + req.date : ""));
    appliquerForfait(client, req.motif);
    client.paiements = client.paiements || [];
    client.paiements.push({ id: Date.now()+"", date: req.date || new Date().toISOString().slice(0,10), montant, statut: "en attente" });
    save();
    ClientsManager.saveClient(client.id, client); // 🔄 Sync Firestore
    ajouterRdvAgenda({ clientId: client.id, clientName: client.name, date: req.date, heure: req.heure, motif: req.motif, notes: req.message, source: "site", reqId: req.id });
    notifCoach("✅ Séance ajoutée à la fiche de " + client.name);
  } else {
    const nom = ((req.prenom||"") + " " + (req.nom||"")).trim() || "Nouveau client";
    const nouveauClient = {
      id: "c" + Date.now(),
      name: nom,
      email: req.email || "",
      tel: req.tel || "",
      profile: "À définir",
      age: null,
      objective: req.motif || "",
      sessions: 1,
      nextSession: req.date || "",
      nextSessionHeure: req.heure || "",
      status: "actif",
      notes: req.message || "",
      sessionHistory: ["Séance 1 — " + (req.motif || "RDV") + (req.theme ? " (" + req.theme + ")" : "") + (req.date ? " le " + req.date : "")],
      objectifs: [],
      entretiens: [],
      paiements: [{ id: Date.now()+"", date: req.date || new Date().toISOString().slice(0,10), montant, statut: "en attente" }]
    };
    appliquerForfait(nouveauClient, req.motif);
    state.clients.push(nouveauClient);
    save();
    ClientsManager.saveClient(nouveauClient.id, nouveauClient); // 🔄 Sync Firestore
    ajouterRdvAgenda({ clientId: nouveauClient.id, clientName: nom, date: req.date, heure: req.heure, motif: req.motif, notes: req.message, source: "site", reqId: req.id });
    notifCoach("✅ Nouvelle fiche client créée : " + nom);
  }
}

const MOIS_NOMS_FR = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];

function isoDate(d) { return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function parseISO(s) { return new Date(s + "T00:00:00"); }
function startOfWeekMonday(d) { const day = d.getDay(); const diff = (day===0?-6:1-day); const r = new Date(d); r.setDate(d.getDate()+diff); return r; }
const JOURS_COURT = ["lun","mar","mer","jeu","ven","sam","dim"];

function appointmentsForDate(dateStr) {
  return state.appointments.filter(a => a.date === dateStr).sort((a,b) => (a.heure||"").localeCompare(b.heure||""));
}

function resynchroniserCreneaux() {
  const avecCreneau = state.appointments.filter(a => a.date && a.heure);
  if (!avecCreneau.length) { notifCoach("Aucun rendez-vous avec créneau à synchroniser."); return; }
  const db = firebase.firestore();
  let fait = 0;
  const total = avecCreneau.length;
  avecCreneau.forEach(a => {
    const slotId = a.date + "_" + a.heure;
    db.collection("bookedSlots").doc(slotId).set({ date: a.date, heure: a.heure })
      .then(() => { fait++; if (fait === total) notifCoach("✅ " + total + " créneau(x) resynchronisé(s)."); })
      .catch(e => console.error("resync bookedSlots:", e));
  });
}

function renderAgendaMois() {
  const wrap = h("div",{});
  const ref = parseISO(state.agendaRef);
  const year = ref.getFullYear(), month = ref.getMonth();
  const firstOfMonth = new Date(year, month, 1);
  const startGrid = startOfWeekMonday(firstOfMonth);
  const todayStr = isoDate(new Date());

  const nav = h("div",{style:"display:flex;align-items:center;gap:12px;margin-bottom:16px"});
  const prevBtn = h("button",{class:"btn-sm"},"‹ Mois préc.");
  const nextBtn = h("button",{class:"btn-sm"},"Mois suiv. ›");
  prevBtn.addEventListener("click", () => { const d = new Date(year, month-1, 1); state.agendaRef = isoDate(d); state.agendaSelectedDay=null; render(); });
  nextBtn.addEventListener("click", () => { const d = new Date(year, month+1, 1); state.agendaRef = isoDate(d); state.agendaSelectedDay=null; render(); });
  nav.appendChild(prevBtn); nav.appendChild(h("div",{style:"color:#2E2A20;font-weight:700;font-size:14px;flex:1;text-align:center;text-transform:capitalize"}, MOIS_NOMS_FR[month]+" "+year)); nav.appendChild(nextBtn);
  wrap.appendChild(nav);

  const grid = h("div",{style:"display:grid;grid-template-columns:repeat(7,1fr);gap:6px"});
  JOURS_COURT.forEach(j => grid.appendChild(h("div",{style:"text-align:center;color:#6B6355;font-size:13px;font-weight:700;padding-bottom:4px;text-transform:capitalize"}, j)));

  const cursor = new Date(startGrid);
  for (let w = 0; w < 6; w++) {
    for (let i = 0; i < 7; i++) {
      const dStr = isoDate(cursor);
      const inMonth = cursor.getMonth() === month;
      const dayApts = appointmentsForDate(dStr);
      const isToday = dStr === todayStr;
      const isSelected = state.agendaSelectedDay === dStr;
      const cell = h("div",{style:`min-height:56px;border-radius:8px;padding:6px;cursor:pointer;background:${isSelected?"#9C7A2E22":"#FFFFFF"};border:1px solid ${isToday?"#9C7A2E66":"#E4DAC0"};opacity:${inMonth?1:0.35}`});

      if (dayApts.length) {
        cell.appendChild(h("div",{style:"margin-top:4px;font-size:9.5px;color:#9C7A2E;font-weight:700"}, dayApts.length + " RDV"));
      }
      cell.addEventListener("click", () => { state.agendaSelectedDay = (state.agendaSelectedDay===dStr) ? null : dStr; render(); });
      grid.appendChild(cell);
      cursor.setDate(cursor.getDate()+1);

    const detail = h("div",{class:"card",style:"padding:16px 18px;margin-top:16px"});

    if (!dayApts.length) detail.appendChild(h("p",{style:"color:#6B6355;font-size:12.5px"},"Aucun rendez-vous ce jour-là."));
    dayApts.forEach(a => detail.appendChild(appointmentRow(a)));
    wrap.appendChild(detail);
  }

  return wrap;
}
